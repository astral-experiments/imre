[package]
name = "imre-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Keep pass-boundary verification enabled in release differential tests.
verify-ir = []

[dependencies]
imre-ast = { path = "../imre-ast" }
imre-regex = { path = "../imre-regex" }
blake3 = "1"
csv = "1"
sha2 = { version = "=0.11.1", default-features = false }
indexmap = "=2.14.2"
notify = "8.2.0"
same-file = "1"
num-bigint.workspace = true
rpds = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "=0.1.25"
ruff_python_ast.workspace = true
ruff_python_codegen.workspace = true
ruff_python_stdlib.workspace = true
ruff_python_parser.workspace = true
ruff_python_trivia.workspace = true
ruff_text_size.workspace = true
ruff_db.workspace = true
ty_python_semantic.workspace = true
ty_python_core.workspace = true
ty_module_resolver.workspace = true
ty_site_packages.workspace = true
ty_vendored.workspace = true
salsa.workspace = true
salsa-macro-rules.workspace = true
fancy-regex.workspace = true
regex.workspace = true
tempfile = "=3.23.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
zip = { version = "8", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
object = { version = "=0.39.1", default-features = false, features = ["read_core", "std", "archive", "elf", "macho"] }

[[bin]]
name = "imre"
path = "src/main.rs"

[lints]
workspace = true
