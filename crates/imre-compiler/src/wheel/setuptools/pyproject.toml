[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imre-setuptools"
version = "0.1.2"
description = "Build setuptools extensions for an Imre target"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"

[project.entry-points."setuptools.finalize_distribution_options"]
imre = "imre_setuptools:activate"

[tool.setuptools]
py-modules = ["imre_setuptools"]
