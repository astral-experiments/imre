[package]
name = "imre-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
num-bigint.workspace = true
num-traits.workspace = true
compact_str.workspace = true
itoa.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true
libc = "=0.2.190"
getrandom = { version = "=0.3.4", features = ["std"] }
rustix = { version = "=1.1.5", features = ["fs"] }
memchr = "=2.8.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
ruff_python_literal = "=0.0.14"
icu_properties = "=2.3.0"
ryu = "=1.0.23"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "preserve_order"] }
toml_parser = "=1.1.5"
hashbrown = { version = "=0.17.1", default-features = false, features = ["inline-more"] }
glidesort = "=0.1.2"
smallvec = { version = "=1.16.3", features = ["union"] }
sha2 = { version = "=0.11.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = "=0.12.1"

[lints]
workspace = true
