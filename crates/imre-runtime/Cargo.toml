[package]
name = "imre-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
allocator-api2 = "=0.2.21"
imre-regex = { path = "../imre-regex" }
indexmap = "=2.14.2"
base64 = "=0.22.1"
constant_time_eq = "=0.4.2"
num-bigint.workspace = true
num-traits.workspace = true
compact_str.workspace = true
itoa.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true
libc = "=0.2.190"
getrandom = { version = "=0.3.4", features = ["std"] }
rustix = { version = "=1.1.5", features = ["fs"] }
memchr = "=2.8.3"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }
corosensei = "=0.3.4"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
zlib-rs = { version = "=0.6.8", default-features = false }
ruff_python_literal = "=0.0.15"
ruff_python_ast.workspace = true
ruff_python_parser.workspace = true
ruff_text_size.workspace = true
icu_properties = "=2.3.0"
ryu = "=1.0.23"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "preserve_order"] }
toml_datetime = "=1.1.2"
toml_parser = "=1.1.5"
hashbrown = { version = "=0.17.1", default-features = false, features = ["inline-more"] }
triomphe = { version = "=0.1.17", default-features = false }
glidesort = "=0.1.2"
smallvec = { version = "=1.16.3", features = ["union"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
unicode-case-mapping = "=1.0.0"
unicode-normalization = "=0.1.25"
unicode_names2 = "=1.3.0"

[build-dependencies]
regex-syntax.workspace = true
cc = "=1.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = "=0.12.1"

[lints]
workspace = true
