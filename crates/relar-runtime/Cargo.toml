[package]
name = "relar-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
num-bigint.workspace = true
num-traits.workspace = true
compact_str.workspace = true
itoa.workspace = true
libc = "=0.2.190"
memchr = "=2.8.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
ruff_python_literal = "=0.0.14"
icu_properties = "=2.3.0"
ryu = "=1.0.23"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["raw_value", "unbounded_depth"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "preserve_order"] }
smallvec = { version = "=1.16.3", features = ["union"] }

[lints]
workspace = true
