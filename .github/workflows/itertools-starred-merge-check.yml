name: Verify starred tuples and every original itertools occurrence
on:
  push:
    branches: [codex/itertools-starred-merge-check]
permissions:
  contents: read
jobs:
  iterator-audit:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify tested source matches the intended feature tree
        run: |
          git rev-parse HEAD^ HEAD
          git diff --exit-code HEAD^ HEAD -- crates Cargo.lock Cargo.toml
          git checkout --detach 1f033f7f39c698be67eeb0189587bfcb0c0c3e38
      - id: gil
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install Clang 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Build the combined compiler and runtime
        id: build
        run: |
          cargo fmt --all -- --check
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: |
            Lib
            Modules/itertoolsmodule.c
          persist-credentials: false
      - name: Run every complete original primary method, checking operations and fixture roles
        id: primary
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          python3 -B benchmarks/cpython_stdlib/suite_modes.py --source 1f033f7f39c698be67eeb0189587bfcb0c0c3e38 --entry "$dir/coverage.py" --reference "$dir/reference-linux.json" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --output "$RUNNER_TEMP/itertools-both"
          cp "$RUNNER_TEMP/itertools-both/ordinary.json" "$RUNNER_TEMP/itertools-all.json"
          cat "$RUNNER_TEMP/itertools-both/source.json"
          python3 -B benchmarks/cpython_stdlib/suite_evidence.py "$dir/reference-linux.json" "$RUNNER_TEMP/itertools-all.json"
      - name: Save the exact per-occurrence report
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          python3 - "$RUNNER_TEMP/itertools-all.json" <<'PY'
          import base64,gzip,hashlib,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          encoded=base64.b64encode(gzip.compress(data,mtime=0)).decode()
          print('ITERTOOLS_REPORT_SHA256='+hashlib.sha256(data).hexdigest())
          for i in range(0,len(encoded),3000): print('ITERTOOLS_REPORT_PART='+encoded[i:i+3000])
          PY
      - name: Compare four native tuple executions and the untouched original entry points
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          python3 -B "$dir/tuple_spread_audit.py" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-git .cpython-stdlib-reference --result "$RUNNER_TEMP/tuple-spreads.json"
          python3 -c 'import base64,gzip,pathlib,sys; print("ITERTOOLS_TUPLE_RECEIPT="+base64.b64encode(gzip.compress(pathlib.Path(sys.argv[1]).read_bytes(),mtime=0)).decode())' "$RUNNER_TEMP/tuple-spreads.json"
      - name: Verify every stored occurrence against the tested integration source
        if: "${{ !cancelled() && steps.primary.outcome == 'success' }}"
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          diff -u "$dir/evidence-linux.json" "$RUNNER_TEMP/itertools-all.json" || true
          cmp "$dir/evidence-linux.json" "$RUNNER_TEMP/itertools-all.json"
      - name: Compare native tuple ownership under ASan and LSan
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          src=benchmarks/cpython_stdlib/full/itertools/tuple_spreads.py
          python3 -B "$src" > "$RUNNER_TEMP/starred-ref"
          for opt in 0 3; do
            target/debug/imre build "$src" --quiet --no-cache --sanitize --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$opt" -o "$RUNNER_TEMP/starred"
            ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/starred" > "$RUNNER_TEMP/starred-out"
            diff -u "$RUNNER_TEMP/starred-ref" "$RUNNER_TEMP/starred-out"
          done
      - name: Build both unchanged itertools files in all four modes
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          python3 -B "$dir/whole_files.py" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-git .cpython-stdlib-reference --result "$RUNNER_TEMP/whole-files.json"
          python3 -c 'import json,sys; a,b=(json.load(open(p)) for p in sys.argv[1:]); assert a["suites"] == b["suites"]; print("ITERTOOLS_WHOLE_FILES="+json.dumps(b,separators=(",",":")))' "$dir/whole-files-linux.json" "$RUNNER_TEMP/whole-files.json"
      - name: Compare NullHandler lock overrides and the original logging method
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          root=benchmarks/cpython_stdlib/full
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python3 -B "$root/logging/null_handler.py" "${args[@]}" --result "$RUNNER_TEMP/null-handler.json"
      - name: Refuse native record, dict and boxed tuple comparisons
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          cat > "$RUNNER_TEMP/key_refusal.py" <<'STARRED_KEY_REFUSAL_PY'
          """Check refusal, recovery and ownership where a tuple display meets typed equality."""
          from pathlib import Path
          import argparse, json, os, resource, subprocess, sys, tempfile

          SOURCES = {
          "record": '''import sys

          def compare(a: str, b: str) -> None:
              ai = [(a, 0)]
              bi = [(b, 0)]
              left = (*ai, ("tail", 0))
              right = (*bi, ("tail", 0))
              try:
                  print(left == right)
              except MemoryError:
                  print("memory-error")
              print(len(left))
              print(len(right))
              print(left == right)

          compare(sys.argv[1], sys.argv[2])
          ''',
          "dict": '''import sys

          def pop(a: str, b: str) -> None:
              ai = [(a, 0)]
              bi = [(b, 0)]
              left = ((*ai, ("tail", 0))[0], 0)
              right = ((*bi, ("tail", 0))[0], 0)
              values = {left: 7}
              try:
                  first = values.pop(right, None)
                  if first is None:
                      print("missing")
                  else:
                      print(first)
              except MemoryError:
                  print("memory-error")
              print(len(values))
              print(values.get(left, -1))
              second = values.pop(right, None)
              if second is None:
                  print("missing")
              else:
                  print(second)
              print(len(values))

          pop(sys.argv[1], sys.argv[2])
          ''',
          "boxed": '''import sys
          from collections.abc import Mapping
          def compare(left: Mapping[str, object], right: Mapping[str, object]) -> None:
              try:
                  print(left["x"] == right["x"])
              except MemoryError:
                  print("memory-error")
              print(len(left))
              print(len(right))
              print(left["x"] == right["x"])
          def prepare(a: str, b: str) -> None:
              ai = [(a, 0)]
              bi = [(b, 0)]
              left = ((*ai, ("tail", 0))[0], 0)
              right = ((*bi, ("tail", 0))[0], 0)
              compare({"x": left, "y": left}, {"x": right, "y": right})
              deep_left = (((left, 0), 0), 0)
              deep_right = (((right, 0), 0), 0)
              compare({"x": deep_left, "y": deep_left}, {"x": deep_right, "y": deep_right})
          prepare(sys.argv[1], sys.argv[2])
          ''',
          }
          WRAP = r'''
          #include <errno.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          static unsigned active, refused;
          static int enter(const char *operation) {
              const char *setting = getenv("IMRE_REFUSE_TUPLE_WORKLIST");
              unsigned old = active;
              active = active || (setting && strcmp(setting, operation) == 0);
              return old;
          }
          static int deny(size_t size) {
              if (!active || refused || size < 128) return 0;
              refused = 1; errno = ENOMEM; return 1;
          }
          extern void *__real_malloc(size_t);
          extern void *__real_realloc(void *, size_t);
          extern void *__real_calloc(size_t, size_t);
          void *__wrap_malloc(size_t n) {return deny(n) ? NULL : __real_malloc(n);}
          void *__wrap_realloc(void *p,size_t n) {return deny(n) ? NULL : __real_realloc(p,n);}
          void *__wrap_calloc(size_t n,size_t s) {return deny(n*s) ? NULL : __real_calloc(n,s);}
          extern uint32_t __real_imre_record_equal(const void *, const void *);
          uint32_t __wrap_imre_record_equal(const void *a,const void *b) {
              int old=enter("record"); uint32_t out=__real_imre_record_equal(a,b); active=old; return out;
          }
          extern uint32_t __real_imre_dict_try_pop(void *, uintptr_t, void *);
          uint32_t __wrap_imre_dict_try_pop(void *a,uintptr_t b,void *out) {
              int old=enter("dict"); uint32_t found=__real_imre_dict_try_pop(a,b,out); active=old; return found;
          }
          extern uint32_t __real_imre_system_exit_code_equal(const void *, uint32_t, uintptr_t);
          uint32_t __wrap_imre_system_exit_code_equal(const void *a,uint32_t k,uintptr_t b) {
              int old=enter("boxed"); uint32_t out=__real_imre_system_exit_code_equal(a,k,b); active=old; return out;
          }
          '''

          def run(argv, *, env=None):
              return subprocess.run(argv, capture_output=True, env=env, timeout=90,
                                    preexec_fn=lambda: resource.setrlimit(resource.RLIMIT_CORE, (0, 0)))

          def main():
              parser=argparse.ArgumentParser()
              for name in ('imre','runtime','clang'):parser.add_argument('--'+name,type=Path,required=True)
              parser.add_argument('--negative',action='store_true')
              parser.add_argument('--boxed',action='store_true')
              parser.add_argument('--boxed-only',action='store_true')
              parser.add_argument('--reachable-only',action='store_true')
              parser.add_argument('--result',type=Path,required=True)
              opts=parser.parse_args()
              report=[]
              with tempfile.TemporaryDirectory(prefix='imre-itertools-starred-key-') as directory:
                  temp=Path(directory); c=temp/'wrap.c'; obj=temp/'wrap.o'; c.write_text(WRAP)
                  subprocess.run([opts.clang,'-c','-O1',c,'-o',obj],check=True)
                  for mode,src in SOURCES.items():
                      if opts.boxed_only and mode!='boxed':continue
                      if mode=='boxed' and not (opts.boxed or opts.boxed_only):continue
                      path=temp/(mode+'.py'); path.write_text(src)
                      for level in (0,3):
                          exe=temp/'run'
                          args=[opts.imre.resolve(),'build',path,'--no-cache','--quiet','--runtime',opts.runtime.resolve(),
                                '--clang',opts.clang,'--opt-level',str(level),'-o',exe,'-C',f'link-arg={obj}']
                          if opts.reachable_only:args.append('--reachable-only')
                          for sym in ('malloc','calloc','realloc','imre_record_equal','imre_dict_try_pop','imre_system_exit_code_equal'):
                              args+=['-C','link-arg=-Wl,--wrap='+sym]
                          build=run(args)
                          if build.returncode:raise AssertionError((mode,level,'build',build.stderr.decode()))
                          for secondary in (('A','B') if mode!='dict' else ('A',)):
                              inputs=['A',secondary]
                              ref=run([sys.executable,'-B',path,*inputs]); normal=run([exe,*inputs])
                              if (normal.returncode,normal.stdout,normal.stderr)!=(0,ref.stdout,ref.stderr) or ref.returncode:raise AssertionError((mode,'normal',ref,normal))
                              refused=run([exe,*inputs],env=dict(os.environ,IMRE_REFUSE_TUPLE_WORKLIST=mode))
                              if mode!='dict':wanted=b'memory-error\n2\n2\n'+(b'True\n' if secondary=='A' else b'False\n')
                              else:wanted=b'memory-error\n1\n7\n7\n0\n'
                              if mode=='boxed':
                                  truth=b'True\n' if secondary=='A' else b'False\n'
                                  wanted=truth+b'2\n2\n'+truth+wanted
                              seen=(refused.returncode,refused.stdout,refused.stderr)==(0,wanted,b'')
                              report.append(dict(mode=mode,level=level,reachable_only=opts.reachable_only,inputs=inputs,reference=ref.stdout.decode(),exit=refused.returncode,stdout=refused.stdout.decode(),stderr=refused.stderr.decode(),caught_and_retried=seen))
                              print(mode,level,inputs,report[-1],flush=True)
              opts.result.write_text(json.dumps(report,indent=2)+'\n')
              if opts.negative:assert all(x['exit']==-6 and 'memory allocation of' in x['stderr'] for x in report), report
              else:assert all(x['caught_and_retried'] for x in report), report

          if __name__=='__main__':main()
          STARRED_KEY_REFUSAL_PY
          for mode in ordinary reachable; do
            extra=(); if [[ "$mode" == reachable ]]; then extra=(--reachable-only); fi
            python3 -B "$RUNNER_TEMP/key_refusal.py" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${extra[@]}" --boxed --result "$RUNNER_TEMP/keys-$mode.json"
          done
      - name: Test the runtime lane's packed iterator effects repair
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          cargo test --locked -j 2 -p imre-compiler --lib effects::tests::local_and_final_analysis_agree_on_packed_list_allocations -- --exact
      - name: Retain packed struct values across a starred islice and list clear
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        env:
          GIL_PYTHON: "${{ steps.gil.outputs.python-path }}"
        run: |
          src="$RUNNER_TEMP/starred-packed.py"
          cat > "$src" <<'STARRED_PACKED_PY'
          """Combine packed list reads, a shared islice, and fixed and runtime-sized tuple indexing."""
          from imre import struct
          from itertools import islice


          @struct
          class Point:
              x: float
              active: bool


          def exercise(index: int) -> None:
              rows = [Point(-0.0, False)] * 128
              rows[63] = Point(63.0, True)
              rows[65] = Point(65.0, True)
              source = islice(rows, 63, 67)
              first = next(source)
              rows[64] = Point(64.5, True)
              gathered = (first, *source, Point(-1.0, True))
              rows[65] = Point(999.0, False)
              rows.clear()
              print(len(gathered))
              for point in gathered:
                  print(point.x)
                  print(point.active)
              print(gathered[index].x)
              fixed = (gathered[0], gathered[-1])
              print(fixed[index].x)
              print(len((*source,)))
              try:
                  print(gathered[100].x)
              except IndexError as exc:
                  print(str(exc))


          exercise(1)
          exercise(-1)
          STARRED_PACKED_PY
          PYTHONPATH="$PWD/stdlib" "$GIL_PYTHON" -B "$src" > "$RUNNER_TEMP/packed-ref"
          test "$(wc -l < "$RUNNER_TEMP/packed-ref")" -eq 30
          for opt in 0 3; do
            for mode in ordinary reachable; do
              flags=(); if [[ "$mode" == reachable ]]; then flags=(--reachable-only); fi
              target/debug/imre build "$src" --quiet --no-cache --opt-level "$opt" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${flags[@]}" -o "$RUNNER_TEMP/packed-native"
              "$RUNNER_TEMP/packed-native" > "$RUNNER_TEMP/packed-out" 2> "$RUNNER_TEMP/packed-err"
              diff -u "$RUNNER_TEMP/packed-ref" "$RUNNER_TEMP/packed-out"
              test ! -s "$RUNNER_TEMP/packed-err"
            done
          done
      - name: Compare iterator and tuple controls, runtime indexing and packed struct cursors
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        run: |
          for src in tests/fixtures/text/formatter_ownership.py tests/fixtures/containers/chainmap.py tests/fixtures/iterator_pipelines/groupby.py tests/fixtures/iterator_pipelines/source_generator.py tests/fixtures/text/percent_tuple.py tests/fixtures/iterables/delegated_rows.py tests/fixtures/text/alnum.py tests/fixtures/iterables/mixed_method_sources.py tests/fixtures/expressions/tuple_runtime_index.py tests/fixtures/expressions/tuple_formatter_get_value.py tests/fixtures/dataclasses/value_struct.py tests/fixtures/dataclasses/repeated_value_struct.py tests/fixtures/dataclasses/sparse_value_struct.py; do
            for opt in 0 3; do
              for mode in ordinary reachable; do
                extra=(); if [[ "$mode" == reachable ]]; then extra=(--reachable-only); fi
                target/debug/imre build "$src" --quiet --no-cache --opt-level "$opt" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${extra[@]}" -o "$RUNNER_TEMP/binding-case"
                  PYTHONPATH="$PWD/stdlib" python3 -B "$src" > "$RUNNER_TEMP/binding.ref" 2> "$RUNNER_TEMP/binding.ref.err"
                  "$RUNNER_TEMP/binding-case" > "$RUNNER_TEMP/binding.native" 2> "$RUNNER_TEMP/binding.native.err"
                  diff -u "$RUNNER_TEMP/binding.ref" "$RUNNER_TEMP/binding.native"
                  diff -u "$RUNNER_TEMP/binding.ref.err" "$RUNNER_TEMP/binding.native.err"
              done
            done
          done
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        id: freethreaded
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        with:
          python-version: '3.14.5t'
      - name: Verify the separate free-threaded companion with its GIL guard
        if: "${{ !cancelled() && steps.freethreaded.outcome == 'success' }}"
        env:
          GIL_INTERPRETER: "${{ steps.gil.outputs.python-path }}"
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib" python3 -B "$dir/free_threading.py" --gil-python "$GIL_INTERPRETER" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/itertools-companion.json"
          python3 -B benchmarks/cpython_stdlib/suite_evidence.py "$dir/reference-free-threading-linux.json" "$RUNNER_TEMP/itertools-companion.json"
          python3 -c 'import json,sys;print("ITERTOOLS_COMPANION="+json.dumps(json.load(open(sys.argv[1])),sort_keys=True,separators=(",",":")))' "$RUNNER_TEMP/itertools-companion.json"
          cmp "$dir/evidence-free-threading-linux.json" "$RUNNER_TEMP/itertools-companion.json"
      - name: Preserve both full primary occurrence reports and their source receipt
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: itertools-primary-ordinary-and-reachable
          path: ${{ runner.temp }}/itertools-both/*.json
          if-no-files-found: error
      - name: Exercise starred text literals with the repaired reachability graph
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        env:
          GIL_PYTHON: "${{ steps.gil.outputs.python-path }}"
        run: |
          dir="$RUNNER_TEMP/starred-text"
          mkdir -p "$dir"
          cargo test --locked -j 2 -p imre-compiler --lib modules::reachability::tests::literal_text_methods_do_not_root_unrelated_source_methods -- --exact > "$dir/rust.log"
          grep -F '1 passed; 0 failed' "$dir/rust.log"
          cat > "$dir/base.py" <<'STARRED_LITERAL'
          def mark(text: str) -> str:
              print(text)
              return text


          class Token:
              def strip(self) -> str:
                  return "user"

              def __index__(self) -> int:
                  print("index")
                  return 3

              def clean(self) -> None:
                  result = (mark("first"), *" xy ".strip(), *b"az".decode(),
                            *"x\ty".expandtabs(self), mark("last"))
                  print(len(result))
                  print(repr(result))


          Token().clean()
          STARRED_LITERAL
          sed 's/def strip(self) -> str:/def strip(self, *args) -> str:/' "$dir/base.py" > "$dir/cold.py"
          sed 's/" xy "\.strip()/self.strip()/' "$dir/cold.py" > "$dir/direct.py"
          for variant in base cold direct; do
            "$GIL_PYTHON" -I -B "$dir/$variant.py" > "$dir/$variant.ref"
            for opt in 0 3; do
              for mode in ordinary reachable; do
                flags=(); if [[ "$mode" == reachable ]]; then flags=(--reachable-only); fi
                cmd=(target/debug/imre build "$dir/$variant.py" --quiet --no-cache --opt-level "$opt" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${flags[@]}" -o "$dir/program")
                if [[ "$variant" == direct || ( "$variant" == cold && "$mode" == ordinary ) ]]; then
                  if "${cmd[@]}" > "$dir/diagnostic" 2>&1; then echo "expected a reachable variadic method: $variant $mode $opt"; exit 1; fi
                  grep -F 'variadic parameters' "$dir/diagnostic"
                else
                  "${cmd[@]}"
                  "$dir/program" > "$dir/out" 2> "$dir/err"
                  diff -u "$dir/$variant.ref" "$dir/out"
                  test ! -s "$dir/err"
                  echo "$variant O$opt $mode: outputs matched"
                fi
              done
            done
          done
      - name: Read the initial stdlib table generator and API examples
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6f8796b3ad4698b8704160aba48b5c44a3d0fadd
          path: .itertools-table-provider
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /benchmarks/cpython_stdlib/full/support_table.py
            /benchmarks/cpython_stdlib/full/api_examples.toml
      - name: Compare every measured stdlib row before and after starred tuples
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        env:
          GIL_INTERPRETER: "${{ steps.gil.outputs.python-path }}"
        run: |
          out="$RUNNER_TEMP/itertools-table"
          mkdir -p "$out"
          table=benchmarks/cpython_stdlib/full
          for file in support_table.py api_examples.toml; do
            cp ".itertools-table-provider/$table/$file" "$table/$file"
          done
          render() {
            "$GIL_INTERPRETER" -B - "$table/support_table.py" "$out/$1.md" <<'ROW_MEASURE'
          import pathlib, runpy, sys
          assert sys.version_info[:3] == (3, 14, 5) and sys._is_gil_enabled()
          pathlib.Path(sys.argv[2]).write_text(runpy.run_path(sys.argv[1])['render'](pathlib.Path('target/debug/imre').resolve()))
          ROW_MEASURE
            sha256sum target/debug/imre target/debug/libimre_runtime.a > "$out/$1-binaries.sha256"
            git rev-parse HEAD 'HEAD^{tree}' > "$out/$1-source.txt"
          }
          test "$(git rev-parse HEAD)" = 1f033f7f39c698be67eeb0189587bfcb0c0c3e38
          render feature
          git checkout --detach e696c849b5ecf928c339e56c6e8b8fa53bef9673
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
          render base
          git diff --no-index -- "$out/base.md" "$out/feature.md" > "$out/rows.diff" || { cat "$out/rows.diff"; exit 1; }
          sha256sum "$out/base.md" "$out/feature.md"
          grep -F '| `itertools` |' "$out/feature.md"
      - name: Save both measured stdlib tables and their exact sources
        if: "${{ !cancelled() && steps.build.outcome == 'success' }}"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: itertools-starred-stdlib-table
          path: ${{ runner.temp }}/itertools-table/
          if-no-files-found: error
