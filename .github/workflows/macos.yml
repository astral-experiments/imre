name: macOS socket fixture trace
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stock-python:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Trace the unmodified CPython fixture on timeout
        run: |
          python3 -E -c "import faulthandler, runpy; faulthandler.dump_traceback_later(15, exit=True); runpy.run_path('tests/fixtures/socket/operations.py', run_name='__main__'); faulthandler.cancel_dump_traceback_later()"
      - name: Probe TCP refusal and the rest of the fixture independently
        if: always()
        run: python3 -E .github/scripts/socket-oracle-darwin.py
