name: macOS synchronous socketserver
on: workflow_dispatch
permissions:
  contents: read
jobs:
  socket:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5ac151ac9eb776db4555e34a8fc7d145f4012615
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Confirm the actual product and select the CPython SDK
        run: |
          test "$(git rev-parse HEAD)" = 5ac151ac9eb776db4555e34a8fc7d145f4012615
          git rev-parse HEAD
          uname -ms
          bash .github/scripts/select-macos-sdk.sh
      - run: cargo build --release --locked -p imre-compiler -p imre-runtime
      - name: Compare synchronous handler dispatch and descriptor cleanup on Darwin
        run: python3 tests/socketserver_tcp.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang --opt-levels 0 3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-socket-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Run original SocketServerTest context close, bind leak and TCP requests
        env:
          PYTHONPATH: .cpython-socket-reference/Lib
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,sys,tempfile
          sys.path.insert(0,str(Path("benchmarks/cpython_stdlib/full/socketserver").resolve()))
          import run as probe
          m=json.loads((probe.HERE/"UPSTREAM.json").read_text())
          probe.verify_files(probe.HERE/"upstream",m["files"])
          probe.verify_interpreter_tests(m)
          with tempfile.TemporaryDirectory() as tmp:
              p={}
              for key,data in (("normal",probe.entry()),("bad",probe.entry(True)),("server",(probe.HERE/"serve.py").read_bytes())):
                  w=Path(tmp)/key
                  w.mkdir()
                  if key=="bad":
                      (w/"leaking.py").write_bytes(probe.LEAK)
                  p[key]=w/"case.py"
                  p[key].write_bytes(data)
              probe.observe({k:[sys.executable,"-E",v] for k,v in p.items()})
              print("Darwin CPython: context close, bind leak and three original TCP requests passed; three controls rejected",flush=True)
              for level in (0,3):
                  tc=probe.Toolchain(Path("target/release/imre").resolve(),Path("target/release/libimre_runtime.a").resolve(),Path("/usr/bin/clang"),level)
                  probe.observe({k:[tc.build(v.read_bytes(),v.parent)] for k,v in p.items()})
                  print(f"Darwin O{level}: two original native bodies, one host-driven method, three controls rejected",flush=True)
          PY
