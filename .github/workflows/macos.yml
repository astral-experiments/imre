name: macOS
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ci:macos') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
    concurrency:
      group: macos-${{ github.ref }}
      cancel-in-progress: true
    # Both images carry SDK 26 for the pinned CPython distribution.
    runs-on: ${{ github.repository == 'viarius-experiments/imre' && 'nscloud-macos-tahoe-arm64-6x14' || 'macos-15' }}
    timeout-minutes: 45
    env:
      IMRE_REAL_WHEEL: .cpython-wheel-reference/Lib/ensurepip/_bundled/pip-26.1.1-py3-none-any.whl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Select the macOS SDK used for CPython compatibility
        run: bash .github/scripts/select-macos-sdk.sh
      - run: cargo build --workspace --release --locked
      - name: Verify the standard library reference and native ledgers
        run: |
          python3 benchmarks/cpython_stdlib/full/reference_report.py
          python3 benchmarks/cpython_stdlib/full/native_report.py
          python3 benchmarks/cpython_stdlib/full/test_native_report.py
      - run: cargo test --workspace --release --locked
      - name: Compare string core on Apple Silicon
        run: python3 benchmarks/cpython_stdlib/full/string/native_core.py --imre target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
      - name: Compare pathlib stat, constructors and samefile on Apple Silicon
        run: python3 tests/paths.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --fixture path_stat --fixture stat_options --fixture constructor_protocol --fixture path_protocol_descriptors --fixture samefile --fixture samefile_descriptors --opt-levels 0 3
      - name: Build and install Imre extension wheels
        run: |
          python3 -m pip install "wheel==0.45.1" "packaging==25.0" "build==1.3.0" "setuptools==81.0.0"
          python3 tests/extension_wheel.py --compiler target/release/imre --runtime target/release/libimre_runtime.a
          python3 tests/setuptools_wheel.py --compiler target/release/imre --runtime target/release/libimre_runtime.a
      - uses: ./.github/actions/test-google-crc32c
      - name: Compare Apple Silicon executables with CPython
        run: |
          target/release/imre build tests/programs/control_flow.py -o "$RUNNER_TEMP/control_flow"
          lipo "$RUNNER_TEMP/control_flow" -verify_arch arm64
          python3 tests/run_suites.py --workers 3 --log-dir "$RUNNER_TEMP/imre-suites" \
            --suites unittest_main differential io errno posix_readiness files bytes socket_tcp socketserver_tcp http_server paths processes argparse_cli workspaces base45 containers comprehensions tuple_keys callables \
            -- --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
          cat "$RUNNER_TEMP/imre-suites/errno.log"
          cat "$RUNNER_TEMP/imre-suites/socket_tcp.log"
          cat "$RUNNER_TEMP/imre-suites/http_server.log"
          python3 tests/socket_tcp.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 0
          python3 tests/unittest_main.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --manifest benchmarks/cpython_stdlib/full/errno/UPSTREAM.json --upstream-source benchmarks/cpython_stdlib/full/errno/upstream/Lib/test/test_errno.py --opt-levels 3

      - name: Get the pinned CPython test files and bundled pip wheel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-wheel-reference
          sparse-checkout: |
            Lib/ensurepip/_bundled
            Lib/test
          persist-credentials: false
      - name: Compare PyPA's RECORD validator with CPython
        run: python3 tests/wheel_record.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
      - name: Compare uv's upstream wheel checker with CPython
        run: python3 tests/uv_wheel_check.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
      - name: Check Darwin stat functions and exports against CPython
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          dir=benchmarks/cpython_stdlib/full/stat
          python3 "$dir/run_operations.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang --cpython-source .cpython-wheel-reference --result "$RUNNER_TEMP/cpython-stat.json"
          python3 "$dir/check_modes.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang
      - name: Compare Ruff’s reporters with CPython
        run: |
          target/release/imre build examples/conformance_report/upstream/conformance.py -o "$RUNNER_TEMP/ruff-conformance"
          python3 tests/ruff_program.py --binary "$RUNNER_TEMP/ruff-conformance"
          target/release/imre build examples/memory_report/upstream/memory_report.py -o "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_compare.py --binary "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_run.py --binary "$RUNNER_TEMP/ruff-memory"
          target/release/imre build examples/conformance_report/__main__.py --module-root examples -o "$RUNNER_TEMP/conformance-report"
          python3 benchmarks/conformance_grouping_inputs.py \
            --archive benchmarks/results/2026-10-22-collector-ownership-study.tar.xz \
            --output "$RUNNER_TEMP/conformance-inputs" --check-reporter "$RUNNER_TEMP/conformance-report"
