name: macOS
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resolver:
    runs-on: macos-15
    timeout-minutes: 12
    concurrency: http-server-apple-probe-${{ github.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-github-archives-aarch64-apple-darwin
          run-id: 40261255764
          github-token: ${{ github.token }}
          path: archive
      - run: |
          cd archive
          shasum -a 256 -c *.sha256
          tar xzf imre-aarch64-apple-darwin.tar.gz
      - run: |
          bash .github/scripts/select-macos-sdk.sh
          cc tests/apple-http-resolver.c -o "$RUNNER_TEMP/c-resolver"
          nm -u "$RUNNER_TEMP/c-resolver" | grep -i hostbyaddr
          lib=$(python3 -c 'import _socket;print(_socket.__file__)')
          nm -u "$lib" | grep -Ei 'gethostbyaddr|getnameinfo'
          bindir=archive/imre-aarch64-apple-darwin
          "$bindir/imre" build benchmarks/cpython_stdlib/full/http/server_contract.py --no-cache --runtime "$bindir/libimre_runtime.a" --opt-level 3 -o "$RUNNER_TEMP/native-handler"
          nm -u "$RUNNER_TEMP/native-handler" | grep -Ei 'gethostbyaddr|getnameinfo'
          python3 -u tests/apple-http-probe.py "$RUNNER_TEMP/native-handler" "$RUNNER_TEMP/c-resolver"
