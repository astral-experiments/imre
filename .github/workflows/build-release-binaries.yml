# Build the archives used by CI and GitHub Releases.
name: Build release binaries

on:
  workflow_call:
    inputs:
      include_macos:
        description: Include the macOS archive in the release and installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: >-
      ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-15' ||
          matrix.target == 'aarch64-unknown-linux-gnu' &&
          (github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-aarch64-4' || 'ubuntu-24.04-arm') ||
          (github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04') }}
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.include_macos && '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","aarch64-apple-darwin"]' || '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu"]') }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the macOS SDK used for CPython compatibility
        if: runner.os == 'macOS'
        run: bash .github/scripts/select-macos-sdk.sh

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 libclang-rt-18-dev patchelf
      - name: Support Linux ARM64 kernels with up to 64 KiB pages
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo 'JEMALLOC_SYS_WITH_LG_PAGE=16' >> "$GITHUB_ENV"
      - name: Build binary
        run: cargo build --locked --profile dist --target "$TARGET" --workspace
      - name: Test runtime
        run: cargo test --locked --profile dist --target "$TARGET" -p imre-runtime

      - name: Archive binary
        shell: bash
        run: |
          ARCHIVE_NAME=imre-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          umask 022
          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/dist/imre" "target/$TARGET/dist/libimre_runtime.a" LICENSE-APACHE LICENSE-MIT "$ARCHIVE_NAME/"
          cp examples/conformance_report/upstream/LICENSE "$ARCHIVE_NAME/LICENSE-Ruff"
          cargo metadata --locked --format-version 1 --filter-platform "$TARGET" > "$RUNNER_TEMP/imre-packages.json"
          typeshed_manifest=$(jq -er '.packages[] | select(.name == "ty_vendored") | .manifest_path' "$RUNNER_TEMP/imre-packages.json")
          cp "$(dirname "$typeshed_manifest")/vendor/typeshed/LICENSE" "$ARCHIVE_NAME/LICENSE-typeshed"
          if [[ "$TARGET" == *-linux-gnu ]]; then
            cp "target/$TARGET/dist/libimre_runtime_jemalloc.a" "$ARCHIVE_NAME/"
            jemalloc_manifest=$(jq -er '.packages[] | select(.name == "tikv-jemalloc-sys") | .manifest_path' "$RUNNER_TEMP/imre-packages.json")
            cp "$(dirname "$jemalloc_manifest")/jemalloc/COPYING" "$ARCHIVE_NAME/LICENSE-jemalloc"
            python3 scripts/bundle-linux-toolchain.py "$ARCHIVE_NAME/imre-toolchain"
          fi
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"

      - name: Test archived binary
        run: |
          tar -xzf "imre-$TARGET.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          "./imre-$TARGET/imre" build-target --output-dir sdk > reported-target.json
          cmp reported-target.json sdk/target.json
          test -s sdk/include/Python.h && test -s sdk/setuptools/pyproject.toml && test -s sdk/scikit/Imre.cmake
          echo 'print(40 + 2)' > smoke.py
          test "$("./imre-$TARGET/imre" run smoke.py)" = 42
          if [[ "$TARGET" == *-linux-gnu ]]; then
            test -s "imre-$TARGET/LICENSE-jemalloc"
            test "$("./imre-$TARGET/imre" run smoke.py --allocator jemalloc)" = 42
          fi

      - name: Build and run without a system toolchain
        if: runner.os == 'Linux'
        run: |
          # The Ubuntu 24.04 multi-architecture image contains glibc and no native build tools.
          docker run --rm -i --network none --read-only --tmpfs /tmp:exec,mode=1777 \
            --user 65534:65534 --cap-drop ALL --security-opt no-new-privileges \
            -e TARGET -e HOME=/tmp \
            ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            sh -ec '
              cd /tmp
              for tool in clang clang-18 cc gcc ld ld.lld; do test -z "$(command -v "$tool")"; done
              tar -xz
              bindir="$PWD/imre-$TARGET"
              echo "print(40 + 2)" > hello.py
              "$bindir/imre" build hello.py --verbose-link -o hello 2>link.log
              grep -F -- "$bindir/imre-toolchain/bin/clang" link.log
              grep -F -- "$bindir/imre-toolchain/bin/ld.lld" link.log
              test "$(./hello)" = 42
              test "$(IMRE_CACHE_TRACE=1 "$bindir/imre" run hello.py 2>cache.log)" = 42
              grep -Fx "imre cache hit" cache.log
              test "$("$bindir/imre" run hello.py --allocator jemalloc)" = 42
            ' < "imre-$TARGET.tar.gz"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-github-archives-${{ matrix.target }}
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.sha256

  build-global-dist-artifacts:
    name: Shell installer
    needs: build
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-github-archives-*
          path: target/distrib
          merge-multiple: true
      - name: Build shell installer
        shell: bash
        env:
          INCLUDE_MACOS: ${{ inputs.include_macos }}
        run: |
          tag=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "imre-compiler").version')
          dist=(uv run --locked --only-dev --python 3.12 dist)
          targets=()
          if [[ "$INCLUDE_MACOS" != true ]]; then
            targets=(--target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu)
          fi
          "${dist[@]}" manifest --tag="$tag" "${targets[@]}" --artifacts=local --no-local-paths --output-format=json > "$RUNNER_TEMP/local-manifest.json"
          # Cargo-dist embeds the native archive checksums in the installer.
          mapfile -t checksums < <(jq -r '.artifacts[].checksum // empty' "$RUNNER_TEMP/local-manifest.json")
          (
            cd target/distrib
            sha256sum --check --strict -- "${checksums[@]}"
            cat "${checksums[@]}" > "$RUNNER_TEMP/archive-checksums"
          )
          jq --rawfile sums "$RUNNER_TEMP/archive-checksums" '
            reduce ($sums | split("\n")[] | select(length > 0) | split("  ")) as [$sha, $name]
              (.; .artifacts[$name].checksums.sha256 = $sha)
          ' "$RUNNER_TEMP/local-manifest.json" > target/distrib/local-dist-manifest.json
          "${dist[@]}" build --tag="$tag" "${targets[@]}" --artifacts=global
          python3 scripts/prepare-shell-installer.py target/distrib/imre-installer.sh
          (cd target/distrib && sha256sum --binary imre-installer.sh >> sha256.sum)
      - name: Test shell installer
        run: |
          export IMRE_DOWNLOAD_URL="file://$PWD/target/distrib"
          export IMRE_UNMANAGED_INSTALL="$RUNNER_TEMP/imre-install"
          sh target/distrib/imre-installer.sh
          sh target/distrib/imre-installer.sh
          echo 'print(40 + 2)' > "$RUNNER_TEMP/hello.py"
          test "$(env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin \
            "$IMRE_UNMANAGED_INSTALL/imre" run "$RUNNER_TEMP/hello.py" --verbose-link 2>"$RUNNER_TEMP/install-link.log")" = 42
          grep -F -- "$IMRE_UNMANAGED_INSTALL/imre-toolchain/bin/clang" "$RUNNER_TEMP/install-link.log"
          grep -F -- "$IMRE_UNMANAGED_INSTALL/imre-toolchain/bin/ld.lld" "$RUNNER_TEMP/install-link.log"
          test "$("$IMRE_UNMANAGED_INSTALL/imre" run "$RUNNER_TEMP/hello.py" --allocator jemalloc)" = 42
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-github-installer
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          if-no-files-found: error
          path: |
            target/distrib/imre-installer.sh
            target/distrib/sha256.sum
