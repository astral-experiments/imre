# Build the archives used by CI and GitHub Releases.
name: Build release binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 18
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Install LLD for the Linux x86_64 archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get install -y lld-18
      - name: Support Linux ARM64 kernels with up to 64 KiB pages
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo 'JEMALLOC_SYS_WITH_LG_PAGE=16' >> "$GITHUB_ENV"
      - name: Build binary
        run: cargo build --locked --profile dist --target "$TARGET" --workspace
      - name: Test runtime
        run: cargo test --locked --profile dist --target "$TARGET" -p relar-runtime

      - name: Archive binary
        shell: bash
        run: |
          ARCHIVE_NAME=relar-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          umask 022
          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/dist/relar" "target/$TARGET/dist/librelar_runtime.a" LICENSE-APACHE LICENSE-MIT "$ARCHIVE_NAME/"
          cp examples/conformance_report/upstream/LICENSE "$ARCHIVE_NAME/LICENSE-Ruff"
          cargo metadata --locked --format-version 1 --filter-platform "$TARGET" > "$RUNNER_TEMP/relar-packages.json"
          typeshed_manifest=$(jq -er '.packages[] | select(.name == "ty_vendored") | .manifest_path' "$RUNNER_TEMP/relar-packages.json")
          cp "$(dirname "$typeshed_manifest")/vendor/typeshed/LICENSE" "$ARCHIVE_NAME/LICENSE-typeshed"
          if [[ "$TARGET" == *-linux-gnu ]]; then
            cp "target/$TARGET/dist/librelar_runtime_jemalloc.a" "$ARCHIVE_NAME/"
            jemalloc_manifest=$(jq -er '.packages[] | select(.name == "tikv-jemalloc-sys") | .manifest_path' "$RUNNER_TEMP/relar-packages.json")
            cp "$(dirname "$jemalloc_manifest")/jemalloc/COPYING" "$ARCHIVE_NAME/LICENSE-jemalloc"
          fi
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            install -m 755 /usr/bin/ld.lld-18 "$ARCHIVE_NAME/relar-ld.lld"
            # licenses/LLD.txt is lld/LICENSE.TXT from llvmorg-18.1.3.
            cat licenses/LLD.txt /usr/share/doc/lld-18/copyright > "$ARCHIVE_NAME/LICENSE-LLD"
          fi
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"

      - name: Test archived binary
        run: |
          tar -xzf "relar-$TARGET.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo 'print(40 + 2)' > smoke.py
          test "$("./relar-$TARGET/relar" run smoke.py)" = 42
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            linker="$PWD/relar-$TARGET/relar-ld.lld"
            test -s "relar-$TARGET/LICENSE-LLD"
            "$linker" --version | grep -E 'LLD 18\.[0-9.]+ \(compatible with GNU linkers\)'
            env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin \
              "./relar-$TARGET/relar" build smoke.py --verbose-link -o smoke-lld 2>link.log
            grep -F -- "$linker" link.log
            readelf -p .comment smoke-lld | grep -E 'Linker: .*LLD 18\.'
            test "$(./smoke-lld)" = 42
          fi
          if [[ "$TARGET" == *-linux-gnu ]]; then
            test -s "relar-$TARGET/LICENSE-jemalloc"
            test "$("./relar-$TARGET/relar" run smoke.py --allocator jemalloc)" = 42
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-github-archives-${{ matrix.target }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.sha256

  build-global-dist-artifacts:
    name: Shell installer
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-github-archives-*
          path: target/distrib
          merge-multiple: true
      - name: Build shell installer
        shell: bash
        run: |
          tag=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "relar-compiler").version')
          dist=(uv run --locked --only-dev --python 3.12 dist)
          "${dist[@]}" manifest --tag="$tag" --artifacts=local --no-local-paths --output-format=json > "$RUNNER_TEMP/local-manifest.json"
          # Cargo-dist embeds the native archive checksums in the installer.
          mapfile -t checksums < <(jq -r '.artifacts[].checksum // empty' "$RUNNER_TEMP/local-manifest.json")
          (
            cd target/distrib
            sha256sum --check --strict -- "${checksums[@]}"
            cat "${checksums[@]}" > "$RUNNER_TEMP/archive-checksums"
          )
          jq --rawfile sums "$RUNNER_TEMP/archive-checksums" '
            reduce ($sums | split("\n")[] | select(length > 0) | split("  ")) as [$sha, $name]
              (.; .artifacts[$name].checksums.sha256 = $sha)
          ' "$RUNNER_TEMP/local-manifest.json" > target/distrib/local-dist-manifest.json
          "${dist[@]}" build --tag="$tag" --artifacts=global
          (cd target/distrib && sha256sum --binary relar-installer.sh >> sha256.sum)
      - name: Test shell installer
        run: |
          export RELAR_DOWNLOAD_URL="file://$PWD/target/distrib"
          export RELAR_UNMANAGED_INSTALL="$RUNNER_TEMP/relar-install"
          sh target/distrib/relar-installer.sh
          echo 'print(40 + 2)' > "$RUNNER_TEMP/hello.py"
          test "$(env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin \
            "$RELAR_UNMANAGED_INSTALL/relar" run "$RUNNER_TEMP/hello.py" --verbose-link 2>"$RUNNER_TEMP/install-link.log")" = 42
          grep -F -- "$RELAR_UNMANAGED_INSTALL/relar-ld.lld" "$RUNNER_TEMP/install-link.log"
          test "$("$RELAR_UNMANAGED_INSTALL/relar" run "$RUNNER_TEMP/hello.py" --allocator jemalloc)" = 42
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-github-installer
          if-no-files-found: error
          path: |
            target/distrib/relar-installer.sh
            target/distrib/sha256.sum
