# Build the Linux archives used by CI and GitHub Releases.
name: Build release binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Build binary
        run: cargo build --locked --profile dist --target "$TARGET" --workspace
      - name: Test runtime
        run: cargo test --locked --profile dist --target "$TARGET" -p relar-runtime

      - name: Archive binary
        shell: bash
        run: |
          ARCHIVE_NAME=relar-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          umask 022
          mkdir -p "$ARCHIVE_NAME"
          cp "target/$TARGET/dist/relar" "target/$TARGET/dist/librelar_runtime.a" LICENSE-APACHE LICENSE-MIT "$ARCHIVE_NAME/"
          cp examples/conformance_report/upstream/LICENSE "$ARCHIVE_NAME/LICENSE-Ruff"
          typeshed_manifest=$(cargo metadata --locked --format-version 1 --filter-platform "$TARGET" | jq -er '.packages[] | select(.name == "ty_vendored") | .manifest_path')
          cp "$(dirname "$typeshed_manifest")/vendor/typeshed/LICENSE" "$ARCHIVE_NAME/LICENSE-typeshed"
          tar czvf "$ARCHIVE_FILE" "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_FILE" > "$ARCHIVE_FILE.sha256"

      - name: Test archived binary
        run: |
          tar -xzf "relar-$TARGET.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo 'print(40 + 2)' > smoke.py
          test "$("./relar-$TARGET/relar" run smoke.py)" = 42

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-github-archives-${{ matrix.target }}
          path: |
            *.tar.gz
            *.sha256
