name: Collections merge evidence
on:
  push:
    branches: ['codex/stdlib-collections-hosted-mapping-values-89cae38-8e3563f']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 70
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Check out the exact product tree
        run: |
          cp benchmarks/cpython_stdlib/full/collections/hosted_probe.py "$RUNNER_TEMP/collections-probe.py"
          git checkout --detach 31ed762a1babcaa0bf4be9c892fc3639d4dd3fec
          test "$(git rev-parse HEAD^1)" = 89cae3808dc6fad85355d5dc8d947dd6b10cc5b2
          test "$(git rev-parse HEAD^2)" = 8e3563f2fb03f5432dc6c7a35f12c28fd9dac58d
          test "$(git rev-parse 'HEAD^{tree}')" = f5116b7c48407d5ff627c3a5b64f932ea95bd3be
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-collections
          sparse-checkout: |
            Lib
            Objects
          persist-credentials: false
      - name: Build the prospective compiler and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18
          cargo build --workspace --locked -j 2
      - name: Attempt every original occurrence at O0 and O3
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/.cpython-collections/Lib" python3 "$RUNNER_TEMP/collections-probe.py" "$RUNNER_TEMP/collections-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: collections-31ed762
          path: ${{ runner.temp }}/collections-results
          if-no-files-found: error
          retention-days: 30
