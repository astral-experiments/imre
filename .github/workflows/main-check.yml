name: Main check

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cargo check --workspace --locked
