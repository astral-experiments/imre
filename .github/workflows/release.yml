name: Release
permissions: {}

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build release artifacts without publishing
        required: true
        default: false
        type: boolean

env:
  ACTIONS_CACHE_MODE: none
  UV_LOCKED: 1

jobs:
  plan:
    if: github.repository_id == '1423429334' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          enable-cache: false
      - id: plan
        run: |
          tag=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "imre-compiler").version')
          uv run --only-dev --python 3.12 dist plan --tag="$tag" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Check release tag
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ fromJson(steps.plan.outputs.manifest).announcement_tag }}
        run: |
          jq -e '.announcement_changelog | type == "string" and length > 0' plan-dist-manifest.json > /dev/null || {
            echo "::error::Merge the Prepare release PR for $RELEASE_TAG first"
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          release_exists="$(gh api graphql \
            -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -f tag="$RELEASE_TAG" \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { id } } }' \
            --jq '.data.repository | if . == null then error("Repository not found") else .release != null end')"
          if [[ "$release_exists" != false ]]; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi

  build-release-artifacts:
    needs: plan
    uses: ./.github/workflows/build-release-binaries.yml
    with:
      include_macos: true
    permissions:
      contents: read

  publish-github:
    needs: [plan, build-release-artifacts]
    if: ${{ !inputs.dry-run }}
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - name: Download GitHub artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-github-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ fromJson(needs.plan.outputs.val).announcement_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          PRERELEASE_FLAG: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease && '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(needs.plan.outputs.val).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(needs.plan.outputs.val).announcement_github_body }}
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          (cd artifacts && sha256sum --check --strict sha256.sum)
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-mirror:
    needs: [plan, publish-github]
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    environment: release
    concurrency:
      group: imre-publish-mirror
      queue: max
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ fromJson(needs.plan.outputs.val).announcement_tag }}
    steps:
      - name: Download and verify public release assets
        run: |
          gh release download "$RELEASE_TAG" --dir public \
            --pattern 'imre-*.tar.gz' --pattern 'imre-*.tar.gz.sha256' \
            --pattern imre-installer.sh --pattern sha256.sum
          cd public
          sha256sum --check --strict sha256.sum
          for archive in imre-*.tar.gz; do
            sha256sum --check --strict "$archive.sha256"
          done
          cp imre-installer.sh install.sh
          sha256sum --binary install.sh *.tar.gz.sha256 >> sha256.sum
      - name: Publish to Astral Labs
        shell: bash
        working-directory: public
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MIRROR_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MIRROR_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ vars.MIRROR_R2_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.MIRROR_R2_BUCKET_NAME }}
          PRERELEASE: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
        run: |
          aws s3 cp --recursive --cache-control 'public, max-age=31536000, immutable' \
            . "s3://$R2_BUCKET/imre/releases/$RELEASE_TAG/"
          curl -LsSf --retry 3 "https://labs.astral.sh/imre/releases/$RELEASE_TAG/install.sh" | cmp - install.sh
          if [[ "$PRERELEASE" == false ]]; then
            latest=$(gh release view --json tagName --jq .tagName)
            if [[ "$RELEASE_TAG" == "$latest" ]]; then
              aws s3 cp --cache-control 'public, max-age=300' \
                install.sh "s3://$R2_BUCKET/imre/install.sh"
            fi
          fi
