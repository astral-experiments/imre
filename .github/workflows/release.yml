name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/*release*
      - CHANGELOG.md
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
      - dist-workspace.toml
      - crates/*/dist.toml
      - pyproject.toml
      - rust-toolchain.toml
      - LICENSE-*
      - examples/conformance_report/upstream/LICENSE
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bare Cargo version to publish from main, or dry-run'
        type: string
        default: dry-run
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || 'dry-run' }}
        run: |
          if [[ "$RELEASE_TAG" != dry-run && ( "$GITHUB_REPOSITORY" != astral-sh/relar || "$GITHUB_REF" != refs/heads/main ) ]]; then
            echo 'Publish releases from astral-sh/relar on main.' >&2
            exit 1
          fi
          version=$(python3 scripts/release-version.py -- "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" != dry-run ]]; then
            python3 scripts/release-version.py --notes -- "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.tag != 'dry-run'
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            dist_sha256: cd355dab0b4c02fb59038fef87655550021d07f45f1d82f947a34ef98560abb8
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            dist_sha256: 382cc29ff91ef12a5bf78ad8ee1804661d24e2fbe64b1bdedd6078723b677ae5
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Install cargo-dist 0.31.0
        env:
          DIST_SHA256: ${{ matrix.dist_sha256 }}
        run: |
          file="cargo-dist-$TARGET.tar.xz"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/$file" -o "$RUNNER_TEMP/$file"
          printf '%s  %s\n' "$DIST_SHA256" "$RUNNER_TEMP/$file" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" "cargo-dist-$TARGET/dist"
          install -m 755 "$RUNNER_TEMP/cargo-dist-$TARGET/dist" "$HOME/.cargo/bin/dist"
      - name: Test the runtime on the release architecture
        run: cargo test --profile dist --locked --target "$TARGET" -p relar-runtime
      - name: Package and run a script from the extracted archive
        run: bash scripts/package-release.sh "$TARGET" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relar-${{ matrix.target }}
          path: |
            dist/relar-${{ matrix.target }}.tar.gz
            dist/relar-${{ matrix.target }}.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [plan, package]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'astral-sh/relar' && github.ref == 'refs/heads/main' && inputs.tag == needs.plan.outputs.version
    runs-on: ubuntu-24.04
    concurrency: relar-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: relar-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - name: Publish verified archives to GitHub Releases
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          assets=()
          for arch in x86_64 aarch64; do
            archive="relar-$arch-unknown-linux-gnu.tar.gz"
            # Bind the sidecar to its expected filename before checking the archive.
            expected=$(sha256sum --binary "$archive")
            [[ $(<"$archive.sha256") == "$expected" ]]
            assets+=("$archive" "$archive.sha256")
          done

          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq -- "refs/tags/$TAG" <<< "$refs"; then
            # The commits endpoint peels annotated tags to the underlying commit.
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points to $commit, expected $GITHUB_SHA." >&2
              exit 1
            fi
          fi
          flags=()
          if [[ ${TAG%%+*} == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Relar $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}" "${assets[@]}"
