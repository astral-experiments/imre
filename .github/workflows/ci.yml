name: Shutil archive integration evidence
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          mkdir "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          sudo apt-get update && sudo apt-get install -y clang-18 lld-18 zstd
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Four unchanged test_shutil entry modes
        run: |
          python -B benchmarks/cpython_stdlib/full/check_suite_startup.py --compiler target/debug/imre --cpython-git .cpython test.test_shutil > "$RUNNER_TEMP/evidence/startup-linux.json" || test $? = 1
          jq -e '.tests_executed==0 and (.checks|length==4) and all(.checks[]; (.diagnostic | contains("test_shutil.py:14:") | not))' "$RUNNER_TEMP/evidence/startup-linux.json"
      - name: Original archive operations and crossed handlers at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          mod=benchmarks/cpython_stdlib/full/shutil
          opts=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python -B "$mod/archive_ops.py" "${opts[@]}" --cpython-source .cpython --result "$RUNNER_TEMP/evidence/archive-linux.json"
          for probe in archive_filters archive_handler_controls archive_root_controls check_csv_handlers; do
            python -B "$mod/$probe.py" "${opts[@]}" | tee "$RUNNER_TEMP/evidence/$probe.log"
          done
      - name: Compare native draws and filesystem fixture at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          python -B benchmarks/cpython_stdlib/full/shutil/random_consumer.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/evidence/random-consumer-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-archive-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7