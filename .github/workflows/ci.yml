name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Compare generated programs with CPython
        run: python3 tests/differential.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare static module graphs with CPython
        run: python3 tests/imports.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare fixed classes with CPython
        run: python3 tests/classes.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare typed containers with CPython
        run: python3 tests/containers.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare eager comprehensions with CPython
        run: python3 tests/comprehensions.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare scalar f-strings with CPython
        run: python3 tests/fstrings.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare keyword calls and scalar defaults with CPython
        run: python3 tests/calls.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare conditional expressions and sequence access with CPython
        run: python3 tests/expressions.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare binary64 floats and numeric conversions with CPython
        run: python3 tests/floats.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare bytes and binary files with CPython
        run: python3 tests/bytes.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare structural pattern matching with CPython
        run: python3 tests/matching.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare assignment expressions and scope with CPython
        run: python3 tests/assignments.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare exception propagation and cleanup with CPython
        run: python3 tests/exceptions.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare output and interactive I/O with CPython
        run: python3 tests/io.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Compare UTF-8 files and context cleanup with CPython
        run: python3 tests/files.py --compiler target/release/relar --runtime target/release/librelar_runtime.a --clang clang-18
      - name: Build the bitcode runtime for ThinLTO
        env:
          RUSTFLAGS: -Clinker-plugin-lto
        run: cargo build -p relar-runtime --release --locked --target-dir target/lto
      - name: Check ThinLTO linking and native semantics
        run: |
          relar_target="$(rustc -vV | sed -n 's/^host: //p')"
          relar_lld_dir="$(rustc --print sysroot)/lib/rustlib/$relar_target/bin"
          python3 tests/lto.py --compiler target/release/relar --runtime target/lto/release/librelar_runtime.a --clang clang-18 --target "$relar_target" --rust-lld "$relar_lld_dir/rust-lld" --python python3
          for suite in differential imports classes containers comprehensions fstrings calls expressions floats bytes matching assignments exceptions io files; do
            python3 "tests/$suite.py" --compiler target/release/relar --runtime target/lto/release/librelar_runtime.a --clang clang-18 --target "$relar_target" --lto-linker "$relar_lld_dir/gcc-ld/ld.lld" --opt-levels 3
          done
      - name: Build the runtime with AddressSanitizer
        env:
          RUSTC_BOOTSTRAP: '1'
          RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
        run: |
          relar_target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo build -p relar-runtime --release --locked --target "$relar_target" --target-dir target/asan
      - name: Check generated code and runtime with AddressSanitizer
        run: |
          relar_target="$(rustc -vV | sed -n 's/^host: //p')"
          for suite in differential imports classes containers comprehensions fstrings calls expressions floats bytes matching assignments exceptions io files; do
            python3 "tests/$suite.py" --compiler target/release/relar --runtime "target/asan/$relar_target/release/librelar_runtime.a" --clang clang-18 --sanitize --opt-levels 1
          done
          for suite in containers fstrings calls expressions floats bytes matching assignments files; do
            python3 "tests/$suite.py" --compiler target/release/relar --runtime "target/asan/$relar_target/release/librelar_runtime.a" --clang clang-18 --sanitize --opt-levels 0
          done
      - name: Validate the route planner against an independent oracle
        run: |
          target/release/relar build examples/route_planner.py -o /tmp/route-planner --clang clang-18
          python3 benchmarks/validate.py --binary /tmp/route-planner
      - name: Validate the dependency planner against an independent oracle
        run: |
          target/release/relar build examples/dependency_planner/__main__.py --module-root examples --runtime target/release/librelar_runtime.a --clang clang-18 --opt-level 3 -o /tmp/dependency-planner
          python3 benchmarks/dependency_validate.py --binary /tmp/dependency-planner
      - name: Validate the Rust planner references and integer boundaries
        run: |
          python3 benchmarks/reference/dependency_planner/build.py --artifact-dir /tmp/relar-rust-reference --target-dir target/rust-reference
          python3 benchmarks/reference/dependency_planner/check_boundaries.py --python python3 --relar /tmp/dependency-planner --rust-bigint /tmp/relar-rust-reference/planner-bigint --rust-i64 /tmp/relar-rust-reference/planner-i64 --output /tmp/relar-rust-reference/validation.json
      - name: Validate the incremental planner and numeric reference boundaries
        run: |
          target/release/relar build examples/incremental_planner/__main__.py --module-root examples --runtime target/release/librelar_runtime.a --clang clang-18 --opt-level 3 -o /tmp/incremental-planner
          python3 benchmarks/reference/incremental_planner/build.py --artifact-dir /tmp/relar-incremental-reference --target-dir target/incremental-reference
          # Checked i64 compares only in-range cases and must reject every excluded overflow case.
          python3 benchmarks/incremental_validate.py --python python3 --binary /tmp/incremental-planner --rust-bigint /tmp/relar-incremental-reference/planner-bigint --rust-i64 /tmp/relar-incremental-reference/planner-i64 --output /tmp/relar-incremental-reference/validation.json
      - name: Validate framed batches and recovery against CPython and Rust
        run: |
          target/release/relar build examples/batch_planner/__main__.py --module-root examples --runtime target/release/librelar_runtime.a --clang clang-18 --opt-level 3 -o /tmp/batch-planner
          python3 benchmarks/reference/incremental_planner/build.py --batch --artifact-dir /tmp/relar-batch-reference --target-dir target/incremental-reference
          python3 benchmarks/batch_validate.py --python python3 --binary /tmp/batch-planner --rust-bigint /tmp/relar-batch-reference/planner-batch-bigint --output /tmp/relar-batch-reference/validation.json
      - name: Validate file manifests and complete reports against CPython and Rust
        run: |
          target/release/relar build examples/manifest_planner/__main__.py --module-root examples --runtime target/release/librelar_runtime.a --clang clang-18 --opt-level 3 -o /tmp/manifest-planner
          python3 benchmarks/reference/incremental_planner/build.py --manifest --artifact-dir /tmp/relar-manifest-reference --target-dir target/incremental-reference
          python3 benchmarks/manifest_validate.py --python python3 --binary /tmp/manifest-planner --rust-bigint /tmp/relar-manifest-reference/planner-manifest-bigint --output /tmp/relar-manifest-reference/validation.json
      - name: Validate inventory reconciliation against CPython and Rust
        run: |
          target/release/relar build examples/inventory_reconciliation/__main__.py --module-root examples --runtime target/release/librelar_runtime.a --clang clang-18 --opt-level 3 -o /tmp/inventory-reconciliation
          python3 benchmarks/reference/inventory_reconciliation/build.py --artifact-dir /tmp/relar-inventory-reference --target-dir target/inventory-reference
          python3 benchmarks/inventory_validate.py --python python3 --binary /tmp/inventory-reconciliation --rust-bigint /tmp/relar-inventory-reference/inventory-bigint --output /tmp/relar-inventory-reference/validation.json
