name: Functools merge preflight
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Exact merge sources: JSON matrix with name, commit and tree for each row'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Exact source / ${{ matrix.name }}
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.candidates) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      ASAN_OPTIONS: detect_leaks=0
      CANDIDATE: ${{ matrix.commit }}
      TREE: ${{ matrix.tree }}
      KIND: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          git show -s --format='%H %T %s'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Prepare the exact merge with current main
        if: matrix.name != 'receipts' && matrix.name != 'dispatch'
        run: |
          cat > "$RUNNER_TEMP/prepare" <<'SH'
          set -euo pipefail
          git fetch --quiet --no-tags origin refs/heads/main:refs/remotes/origin/main
          base=$(git rev-parse origin/main)
          tree=$(git merge-tree --write-tree "$base" "$1")
          commit=$(git -c user.name=Preflight -c user.email=preflight@users.noreply.github.com commit-tree "$tree" -p "$base" -p "$1" -m 'Test the live merge tree')
          git checkout --quiet --detach "$commit"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          echo "$base $tree $commit" > "$RUNNER_TEMP/source"
          cat "$RUNNER_TEMP/source"
          SH
          bash "$RUNNER_TEMP/prepare" "$CANDIDATE"
          read -r base tree commit < "$RUNNER_TEMP/source"
          echo "SEED=$CANDIDATE" >> "$GITHUB_ENV"
          echo "CANDIDATE=$commit" >> "$GITHUB_ENV"
          echo "TREE=$tree" >> "$GITHUB_ENV"
      - name: Build and test compiler and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 libclang-rt-18-dev
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime
          cargo test --locked -j 2 -p imre-compiler -p imre-runtime --lib
          mkdir "$RUNNER_TEMP/receipts"
      - name: Compare executable behavior at O0 with ASan and O3
        run: |
          cat > "$RUNNER_TEMP/compare" <<'SH'
          set -euo pipefail
          fixtures=(tests/fixtures/callables/owned_caches.py tests/fixtures/containers/namedtuple.py)
          case "$KIND" in
            cache|both) fixtures+=(tests/fixtures/callables/cache_parameters.py tests/fixtures/containers/dict_clear.py);;
            annotation)
              fixtures+=(tests/fixtures/callables/forward_refs.py tests/fixtures/unions/boolean_integer.py tests/fixtures/module_values/wrapper_attributes/main.py benchmarks/cpython_stdlib/full/inspect/static_attributes.py)
              if test -f tests/fixtures/callables/annotations_deferred.py; then fixtures+=(tests/fixtures/callables/annotations_deferred.py); fi;;
            defaults) fixtures+=(tests/fixtures/module_values/wrapper_attributes/main.py);;
            dispatch) fixtures+=(tests/fixtures/callables/single_dispatch.py);;
            percent) fixtures+=(tests/fixtures/text/percent_scalar.py tests/fixtures/text/percent_tuple.py);;
            links|wraps)
              fixtures+=(tests/fixtures/callables/wrapper_links.py tests/fixtures/module_values/wrapper_attributes/main.py)
              if test "$KIND" = wraps; then fixtures+=(tests/fixtures/callables/wraps_application.py); fi;;
          esac
          for source in "${fixtures[@]}"; do
            python "$source" > "$RUNNER_TEMP/oracle" 2> "$RUNNER_TEMP/oracle-err"
            for opt in 0 3; do
              extra=()
              if test "$opt" = 0; then extra+=(--sanitize); fi
              target/debug/imre build "$source" --module-root "$(dirname "$source")" --no-cache --opt-level "$opt" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${extra[@]}" -o "$RUNNER_TEMP/exe"
              if test "$opt" = 0 && [[ "$source" == */wrapper_links.py || "$source" == */wraps_application.py ]]; then
                ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/exe" > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
              else
                "$RUNNER_TEMP/exe" > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err"
              fi
              cmp "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/out"
              cmp "$RUNNER_TEMP/oracle-err" "$RUNNER_TEMP/err"
              echo "O$opt $source $(wc -c < "$RUNNER_TEMP/out") bytes"
            done
          done
          SH
          bash "$RUNNER_TEMP/compare"
      - name: Run the unchanged functools methods with their reference fixtures
        if: matrix.name == 'cache' || matrix.name == 'both' || matrix.name == 'receipts'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-stdlib-reference/Lib"
          dir=benchmarks/cpython_stdlib/full/functools
          out="$RUNNER_TEMP/receipts"
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python "$dir/run_cache.py" "${args[@]}" --result "$out/cache.json"
          cmp "$dir/cache-parameters-linux.json" "$out/cache.json"
          python "$dir/run_reduce.py" "${args[@]}" --result "$out/reduce.json"
          cmp "$dir/reduce-linux.json" "$out/reduce.json"
          python "$dir/run_bodies.py" "${args[@]}" --compiler-commit "$CANDIDATE" --result "$out/bodies.json"
      - name: Record every primary occurrence on the exact canonical source
        if: matrix.name == 'receipts'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-stdlib-reference/Lib"
          dir=benchmarks/cpython_stdlib/full/functools
          out="$RUNNER_TEMP/receipts"
          python benchmarks/cpython_stdlib/suite_inventory.py "$dir/UPSTREAM.json" --result "$out/reference.json"
          cmp "$dir/reference-linux.json" "$out/reference.json"
          python "$dir/write_evidence.py" --bodies "$out/bodies.json" --cache "$out/cache.json" --reduce "$out/reduce.json" --cache-commit "$CANDIDATE" --reduce-commit "$CANDIDATE" --result "$out/evidence-linux.json"
          git show -s --format='%H %T' HEAD > "$out/exact-source"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: matrix.name == 'receipts'
        with:
          python-version: '3.14.5t'
      - name: Run the four unchanged companion workers with the GIL disabled
        if: matrix.name == 'receipts'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-stdlib-reference/Lib"
          export PYTHON_GIL=0
          dir=benchmarks/cpython_stdlib/full/functools
          out="$RUNNER_TEMP/receipts"
          python -c 'import sys, sysconfig; assert sys.version_info[:3] == (3, 14, 5) and sysconfig.get_config_var("Py_GIL_DISABLED") and not sys._is_gil_enabled()'
          python benchmarks/cpython_stdlib/suite_inventory.py "$dir/FREE_THREADING.json" --result "$out/reference-free-threading.json"
          cmp "$dir/reference-free-threading-linux.json" "$out/reference-free-threading.json"
          python "$dir/run_free_threading.py" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --compiler-commit "$CANDIDATE" --result "$out/evidence-free-threading-linux.json"
      - name: Verify the unchanged errno suite on the combined tree
        if: matrix.name == 'both'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-stdlib-reference/Lib"
          python tests/errno.py --compiler target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --opt-levels 0 3 --result-dir "$RUNNER_TEMP/receipts/errno"
      - name: Verify four complete annotationlib bodies at both levels
        if: matrix.name == 'annotation'
        run: |
          cat > "$RUNNER_TEMP/annotations" <<'SH'
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-stdlib-reference/Lib"
          dir=benchmarks/cpython_stdlib/full/functools
          out="$RUNNER_TEMP/receipts"
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python "$dir/run_annotationlib.py" "${args[@]}" --result "$out/format.json"
          cmp "$dir/annotationlib-linux.json" "$out/format.json"
          python "$dir/run_annotationlib.py" "${args[@]}" --forward-refs --result "$out/forwardrefs.json"
          cmp "$dir/annotation-forwardrefs-linux.json" "$out/forwardrefs.json"
          SH
          bash "$RUNNER_TEMP/annotations"
      - name: Recheck current main for the defaults and annotation candidates
        if: contains(fromJSON('["defaults","annotation","links","wraps","percent"]'), matrix.name)
        run: |
          while true; do
            read -r base tree commit < "$RUNNER_TEMP/source"
            git fetch --quiet --no-tags origin refs/heads/main:refs/remotes/origin/main
            if git diff --quiet "$base" origin/main -- crates Cargo.toml Cargo.lock tests/fixtures benchmarks/cpython_stdlib/full/functools; then
              cp "$RUNNER_TEMP/source" "$RUNNER_TEMP/receipts/final-source"
              echo "Verified final source $(cat "$RUNNER_TEMP/source")"
              break
            fi
            bash "$RUNNER_TEMP/prepare" "$SEED"
            cargo build --locked -j 2 -p imre-compiler -p imre-runtime
            cargo test --locked -j 2 -p imre-compiler -p imre-runtime --lib
            bash "$RUNNER_TEMP/compare"
            if test "$KIND" = annotation; then bash "$RUNNER_TEMP/annotations"; fi
          done
      - name: Recheck an overlapping main change on the warm runner
        if: matrix.name == 'cache' || matrix.name == 'both'
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-stdlib-reference/Lib"
          out="$RUNNER_TEMP/receipts"
          dir=benchmarks/cpython_stdlib/full/functools
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          while true; do
            read -r base tree commit < "$RUNNER_TEMP/source"
            mkdir -p "$out/history/$tree"
            cp "$RUNNER_TEMP/source" "$out/history/$tree/source"
            cp "$out/cache.json" "$out/reduce.json" "$out/bodies.json" "$out/history/$tree/"
            if test -d "$out/errno"; then cp -R "$out/errno" "$out/history/$tree/"; fi
            git fetch --quiet --no-tags origin refs/heads/main:refs/remotes/origin/main
            if git diff --quiet "$base" origin/main -- crates Cargo.toml Cargo.lock "$dir" benchmarks/cpython_stdlib/full/errno; then
              cp "$RUNNER_TEMP/source" "$out/final-source"
              echo "Verified final source $(cat "$out/final-source")"
              break
            fi
            bash "$RUNNER_TEMP/prepare" "$SEED"
            read -r base tree commit < "$RUNNER_TEMP/source"
            cargo build --locked -j 2 -p imre-compiler -p imre-runtime
            cargo test --locked -j 2 -p imre-compiler -p imre-runtime --lib
            source=tests/fixtures/callables/cache_parameters.py
            python "$source" > "$RUNNER_TEMP/oracle" 2> "$RUNNER_TEMP/oracle-err"
            for opt in 0 3; do
              extra=()
              if test "$opt" = 0; then extra+=(--sanitize); fi
              target/debug/imre build "$source" --no-cache --opt-level "$opt" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${extra[@]}" -o "$RUNNER_TEMP/exe"
              "$RUNNER_TEMP/exe" > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err"
              cmp "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/out"
              cmp "$RUNNER_TEMP/oracle-err" "$RUNNER_TEMP/err"
            done
            python "$dir/run_cache.py" "${args[@]}" --result "$out/cache.json"
            cmp "$dir/cache-parameters-linux.json" "$out/cache.json"
            python "$dir/run_reduce.py" "${args[@]}" --result "$out/reduce.json"
            cmp "$dir/reduce-linux.json" "$out/reduce.json"
            python "$dir/run_bodies.py" "${args[@]}" --compiler-commit "$commit" --result "$out/bodies.json"
            if test "$KIND" = both; then
              python tests/errno.py --compiler target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --opt-levels 0 3 --result-dir "$out/errno"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.name }}-${{ github.run_id }}-receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: ignore
