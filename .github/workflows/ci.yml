name: Shutil streams with native BytesIO from 945
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source without the workflow overlay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git switch --detach HEAD^
          test "$(git rev-parse HEAD)" = 2e3f5c4f0bfe70b92fc4ba064eb22212e7ae8aeb
          test "$(git rev-parse HEAD^{tree})" = b4b04898a9d4b22c9ea4e5123a0405f75f37735b
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          command -v clang-18 || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Compare stream files and standard output with pinned CPython at O0 and O3
        run: |
          set -euo pipefail
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$RUNNER_TEMP/evidence/binaries.sha256"
          python -B - <<'PYTHON' | tee "$RUNNER_TEMP/evidence/fixtures.log"
          """Check both repository stream fixtures against the existing file-suite oracle and snapshots."""
          import importlib.util
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          
          work=Path.cwd().resolve()
          tool=work/'target/debug'
          assert Path.cwd().resolve()==work and sys.version_info[:3]==(3,14,5)
          spec=importlib.util.spec_from_file_location('imre_stream_files',work/'tests/files.py')
          files=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(files)
          for fixture in sys.argv[1:] or ('shutil_stringio','shutil_streams','print_scalar_arguments','codec_writer'):
              source=work/'tests/fixtures/files'/(fixture+'.py')
              with tempfile.TemporaryDirectory(prefix='imre-shutil-cf00a19-fixture-') as case:
                  path=Path(case)
                  ref=path/'oracle'
                  files.seed(ref,fixture)
                  expected=files.run([sys.executable,'-I','-B',str(source)],ref)
                  assert expected.returncode==0,expected.stderr
                  for level in ('0','3'):
                      exe=path/'native'
                      subprocess.run([str(tool/'imre'),'build',str(source),'--opt-level',level,'--no-cache','--runtime',str(tool/'libimre_runtime.a'),'--clang','/usr/bin/clang-18','-o',str(exe)],check=True)
                      native=path/('O'+level)
                      files.seed(native,fixture)
                      actual=files.run([str(exe)],native)
                      assert (actual.returncode,actual.stdout,actual.stderr)==(expected.returncode,expected.stdout,expected.stderr),(fixture,level,actual.stdout,expected.stdout,actual.stderr)
                      assert files.snapshot(ref)==files.snapshot(native),(fixture,level)
                      print(f'{fixture} -O{level}: {len(expected.stdout.splitlines())} lines and every file matched',flush=True)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-streams-945
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7

