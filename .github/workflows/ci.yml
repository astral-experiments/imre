name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      unittest_source:
        description: Exact commit to build and run through the complete Linux unittest evidence gate
        type: string
        required: false
      sys_source:
        description: Exact commit to build and verify against the Linux sys suite
        type: string
        required: false
      logging_evidence:
        description: Run all pinned logging occurrences at O0 and O3 and upload the report
        type: boolean
        default: false
      release_artifacts:
        description: Build and test all release archives and the installer
        type: boolean
        default: false
      full_asan:
        description: Run the full AddressSanitizer suites at O1 and O0
        type: boolean
        default: false
      full_thinlto:
        description: Run all ThinLTO suites instead of the linking smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Main finishes its current run; GitHub keeps just one pending push.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.unittest_source && format('unittest-{0}', inputs.unittest_source) || inputs.sys_source || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  scope:
    if: github.event_name != 'push' && !inputs.sys_source && !inputs.unittest_source
    runs-on: ubuntu-24.04
    outputs:
      release_artifacts: ${{ steps.scope.outputs.release_artifacts }}
      full_asan: ${{ steps.scope.outputs.full_asan }}
      thinlto: ${{ steps.scope.outputs.thinlto }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: scope
        env:
          RELEASE_ARTIFACTS: ${{ inputs.release_artifacts || false }}
          FULL_ASAN: ${{ inputs.full_asan || false }}
        run: bash .github/scripts/ci-scope.sh

  unittest-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.unittest_source != '' }}
    runs-on: &linux-x64 >-
      ${{ github.repository == 'viarius-experiments/imre' && 'namespace-profile-ubuntu-24-04-16' ||
          github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      UNITTEST_SOURCE: ${{ inputs.unittest_source }}
      SYS_SOURCE: ${{ inputs.sys_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: .unittest-launcher
          sparse-checkout: benchmarks/cpython_stdlib/suite_modes.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Preserve the launcher from the dispatch ref
        run: |
          if [[ -n "$SYS_SOURCE" ]]; then echo 'Select one source gate per dispatch.' >&2; exit 1; fi
          [[ "$UNITTEST_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          cp .unittest-launcher/benchmarks/cpython_stdlib/suite_modes.py "$RUNNER_TEMP/suite_modes.py"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: unittest-source
          ref: ${{ inputs.unittest_source }}
          persist-credentials: false
      - name: Check the full compiler checkout
        working-directory: unittest-source
        run: |
          test -f Cargo.toml
          test "$(git rev-parse HEAD)" = "$UNITTEST_SOURCE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - run: cargo build -p imre-compiler -p imre-runtime --release --locked --features imre-compiler/verify-ir -j 2
        working-directory: unittest-source
      - name: Verify the selected suite at O0 and O3 in both compiler modes
        id: evidence
        working-directory: unittest-source
        run: |
          dir=benchmarks/cpython_stdlib/full/unittest
          python3 "$RUNNER_TEMP/suite_modes.py" --source "$UNITTEST_SOURCE" --entry "$dir/run.py" --reference "$dir/reference-linux.json" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source "$GITHUB_WORKSPACE/.cpython-stdlib-reference" --output "$RUNNER_TEMP/unittest-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && (steps.evidence.outcome == 'success' || steps.evidence.outcome == 'failure') }}
        with:
          name: unittest-evidence-linux
          path: ${{ runner.temp }}/unittest-evidence
          if-no-files-found: error
          retention-days: 7

  sys-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sys_source != '' && !inputs.unittest_source }}
    runs-on: *linux-x64
    timeout-minutes: 35
    env:
      SYS_SOURCE: ${{ inputs.sys_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: benchmarks/cpython_stdlib/full/sys
          persist-credentials: false
      - name: Select the sys gate for this dispatch
        run: |
          [[ "$SYS_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          cp benchmarks/cpython_stdlib/full/sys/ci.sh "$RUNNER_TEMP/sys-gate.sh"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sys_source }}
          persist-credentials: false
      - name: Check the source before building it
        run: test "$(git rev-parse HEAD)" = "$SYS_SOURCE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Get the original CPython test package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - run: cargo build -p imre-compiler -p imre-runtime --release --locked --features imre-compiler/verify-ir -j 2
      - name: Check sys at O0 and O3
        run: bash "$RUNNER_TEMP/sys-gate.sh"
      - name: Retain the validated Linux sys reports and tested source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sys-evidence-linux
          path: |
            ${{ runner.temp }}/sys-source.txt
            ${{ runner.temp }}/sys-evidence.json
            ${{ runner.temp }}/test-sys-O0.json
            ${{ runner.temp }}/test-sys-O3.json
          if-no-files-found: error
          retention-days: 7

  build-release-artifacts:
    needs: scope
    if: needs.scope.outputs.release_artifacts == 'true'
    uses: ./.github/workflows/build-release-binaries.yml
    with:
      include_macos: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:macos') }}

  linux-arm64:
    needs: scope
    # The archive job already builds and tests the runtime on ARM64.
    if: needs.scope.outputs.release_artifacts == 'false'
    runs-on: >-
      ${{ github.repository == 'viarius-experiments/imre' && 'nscloud-ubuntu-24.04-arm64-4x8' ||
          github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-aarch64-4' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo test -p imre-runtime --lib --locked

  windows-compiler:
    needs: scope
    runs-on: >-
      ${{ (github.repository == 'viarius-experiments/imre' || github.repository == 'astral-sh/imre') &&
          'namespace-profile-windows-2022-x86-64-16x32' || 'windows-2022' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The native runtime depends on POSIX process and filesystem APIs.
      - run: cargo test -p imre-compiler --lib --locked

  check:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.sys_source && !inputs.unittest_source)
    runs-on: *linux-x64
    timeout-minutes: 120
    env: &wheel-env
      IMRE_REAL_WHEEL: .cpython-stdlib-reference/Lib/ensurepip/_bundled/pip-26.1.1-py3-none-any.whl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - &setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install LLVM 18 and the CRC32C build tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 cmake valgrind
      - name: Verify and assemble the vendored CPython suite fixtures
        run: |
          python3 benchmarks/cpython_stdlib/full/test_stage_tests.py
          python3 benchmarks/cpython_stdlib/full/stage_tests.py "$RUNNER_TEMP/imre-cpython-fixtures"
          python3 -B benchmarks/cpython_stdlib/full/discover_staged.py "$RUNNER_TEMP/imre-cpython-fixtures"
          PYTHONPATH="$RUNNER_TEMP/imre-cpython-fixtures/Lib" python3 -B benchmarks/cpython_stdlib/suite_inventory.py \
            benchmarks/cpython_stdlib/full/inspect/UPSTREAM.json --result "$RUNNER_TEMP/inspect-staged-reference.json"
          cmp benchmarks/cpython_stdlib/full/inspect/reference-linux.json "$RUNNER_TEMP/inspect-staged-reference.json"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate slice-sum fusion on bounded heaps
        env:
          CLANG: clang-18
        run: |
          cargo build -p imre-runtime --locked
          cargo test --workspace --lib --locked slice_sum_validation::bounded_slice_sums -- --exact --ignored --nocapture
      - name: Free disk space for native test binaries
        run: cargo clean --profile dev
      - run: cargo build --workspace --release --locked --features imre-compiler/verify-ir
      - name: Verify the standard library support table
        run: python3 -B benchmarks/cpython_stdlib/full/support_table.py --imre target/release/imre --check
      - name: Compare interrupted socket calls and fd reuse with CPython
        run: python3 tests/socket_eintr.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18
      - &cpython-reference
        name: Get the pinned CPython unittest support and extension docstrings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: |
            Lib/test
            Lib/logging
            Lib/ensurepip/_bundled
            Modules
          persist-credentials: false
      - name: Compare POSIX fd readiness with CPython
        env:
          PYTHONPATH: .cpython-stdlib-reference/Lib
        run: python3 tests/posix_readiness.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --host-original
      - name: Run original CPython TCP methods and socket option controls
        env:
          PYTHONPATH: .cpython-stdlib-reference/Lib
        run: |
          dir=benchmarks/cpython_stdlib/full/socket
          python3 "$dir/run.py" --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18 --output "$RUNNER_TEMP/socket-evidence.json"
          cmp "$dir/evidence-linux.json" "$RUNNER_TEMP/socket-evidence.json"
      - name: Compare synchronous TCPServer with original CPython socketserver tests
        env:
          PYTHONPATH: .cpython-stdlib-reference/Lib
        run: |
          python3 benchmarks/cpython_stdlib/full/socketserver/run.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18 --output "$RUNNER_TEMP/socketserver-evidence.json"
          cmp benchmarks/cpython_stdlib/full/socketserver/evidence-linux.json "$RUNNER_TEMP/socketserver-evidence.json"
      - name: Check native string line boundaries and Unicode predicates against CPython
        env:
          PYTHONPATH: .cpython-stdlib-reference/Lib
        run: python3 tests/text_line_methods_upstream.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Check native dictionary translation against CPython
        env:
          PYTHONPATH: .cpython-stdlib-reference/Lib
        run: python3 tests/text_translate_upstream.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Compare builtin ord with CPython's original character and bytes tests
        env:
          PYTHONPATH: .cpython-stdlib-reference/Lib
        run: python3 tests/ord_upstream.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Run pinned unittest methods against native Imre
        run: |
          python3 benchmarks/cpython_stdlib/test_suite_evidence.py
          python3 tests/unittest_main.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 tests/unittest_main.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --manifest benchmarks/cpython_stdlib/full/errno/UPSTREAM.json --upstream-source benchmarks/cpython_stdlib/full/errno/upstream/Lib/test/test_errno.py --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/unittest/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-unittest.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/unittest/reference-linux.json "$RUNNER_TEMP/cpython-unittest.json"
      - name: Compare static inspect lookups with the pinned CPython suite
        run: |
          python3 benchmarks/cpython_stdlib/full/inspect/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-inspect.json"
      - name: Check typing overloads against the original CPython typing and warnings fixtures
        run: |
          python3 benchmarks/cpython_stdlib/full/typing/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-typing-overloads.json"
          cmp benchmarks/cpython_stdlib/full/typing/native-linux.json "$RUNNER_TEMP/cpython-typing-overloads.json"
          cmp benchmarks/cpython_stdlib/full/typing/warnings-client-linux.json "$RUNNER_TEMP/typing-warnings-client.json"
      - name: Verify the complete OS, POSIX and genericpath evidence
        run: |
          for level in 0 3; do
            for runner in value_cases native_descriptors host_descriptors credential_children pipe2_cases; do
              python3 "benchmarks/cpython_stdlib/full/os/$runner.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$level" --result "$RUNNER_TEMP/$runner-O$level.json"
            done
          done
          python3 benchmarks/cpython_stdlib/full/os/evidence.py --cpython-source .cpython-stdlib-reference --output "$RUNNER_TEMP" --check \
            --values-results "$RUNNER_TEMP/value_cases-O0.json" "$RUNNER_TEMP/value_cases-O3.json" \
            --credential-results "$RUNNER_TEMP/credential_children-O0.json" "$RUNNER_TEMP/credential_children-O3.json" \
            --pipe2-results "$RUNNER_TEMP/pipe2_cases-O0.json" "$RUNNER_TEMP/pipe2_cases-O3.json" \
            --descriptor-results "$RUNNER_TEMP/native_descriptors-O0.json" "$RUNNER_TEMP/host_descriptors-O0.json" "$RUNNER_TEMP/native_descriptors-O3.json" "$RUNNER_TEMP/host_descriptors-O3.json"
      - name: Check pinned types.SimpleNamespace tests and dictionary aliases
        run: |
          python3 benchmarks/cpython_stdlib/full/types/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-types.json"
      - name: Compare importlib ModuleSpec constructors and properties with pinned CPython
        run: python3 benchmarks/cpython_stdlib/full/importlib/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-importlib.json"
      - name: Check pinned linecache methods, cache mutation, and source encodings
        run: |
          python3 benchmarks/cpython_stdlib/full/linecache/generate_codecs.py --check
          python3 benchmarks/cpython_stdlib/full/linecache/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-linecache.json"
      - name: Compare structured OS failures with CPython
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/os-errno-fields-XXXXXX")
          src="$GITHUB_WORKSPACE/benchmarks/cpython_stdlib/full/os/errno_fields.py"
          cd "$work"
          python3 "$src" > reference
          for opt in 0 3; do
            "$GITHUB_WORKSPACE/target/release/imre" build "$src" --no-cache --runtime "$GITHUB_WORKSPACE/target/release/libimre_runtime.a" --clang /usr/bin/clang-18 --opt-level "$opt" -o "$work/fields"
            ./fields > native
            diff -u reference native
          done
      - name: Check sys streams and exits with vendored CPython methods
        run: bash benchmarks/cpython_stdlib/full/sys/ci.sh
      - name: Retain the validated Linux sys reports and tested source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sys-evidence-linux
          path: |
            ${{ runner.temp }}/sys-source.txt
            ${{ runner.temp }}/sys-evidence.json
            ${{ runner.temp }}/test-sys-O0.json
            ${{ runner.temp }}/test-sys-O3.json
          if-no-files-found: error
          retention-days: 7
      - name: Check pathlib file I/O, components and walking under the original CPython fixtures
        run: |
          for level in 0 3; do
            python3 benchmarks/cpython_stdlib/full/pathlib/native_files.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$level" --result "$RUNNER_TEMP/cpython-path-files-O$level.json"
            python3 benchmarks/cpython_stdlib/full/pathlib/walk_matrix.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$level"
          done
          # Upstream test_stat expects files and directories on the same device.
          python3 -X warn_default_encoding benchmarks/cpython_stdlib/full/pathlib/evidence.py --fixture-dir /dev/shm --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --cohort components --cohort walk --cohort basics --cohort metadata --cohort stat --cohort segments --cohort samefile --result "$RUNNER_TEMP/cpython-path-cohorts.json"
          python3 benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py "$RUNNER_TEMP/cpython-path-cohorts.json"
          python3 benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py --links "$RUNNER_TEMP/cpython-path-cohorts.json"
          python3 benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py --stat "$RUNNER_TEMP/cpython-path-cohorts.json"
          python3 benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py --segments "$RUNNER_TEMP/cpython-path-cohorts.json"
          python3 benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py --samefile "$RUNNER_TEMP/cpython-path-cohorts.json"
          python3 tests/paths.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --fixture metadata_views --fixture links --fixture link_protocols --fixture path_stat --fixture stat_options --fixture constructor_protocol --fixture path_protocol_descriptors --fixture samefile --fixture samefile_descriptors
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/pathlib/reference-linux.json benchmarks/cpython_stdlib/full/pathlib/evidence-linux.json
      - name: Account for every CPython itertools ID under its original fixtures
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          python3 "$dir/coverage.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --baseline "$dir/evidence-linux.json" --result "$RUNNER_TEMP/itertools-evidence-linux.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py "$dir/reference-linux.json" "$RUNNER_TEMP/itertools-evidence-linux.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py "$dir/reference-free-threading-linux.json" "$dir/evidence-free-threading-linux.json"
      - name: Run original fnmatch filters with native unittest
        run: |
          dir=benchmarks/cpython_stdlib/full/fnmatch
          tools=(--imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference)
          python3 "$dir/run_operations.py" "${tools[@]}" --result "$RUNNER_TEMP/fnmatch-operations.json"
          python3 "$dir/run_bodies.py" "${tools[@]}" --operations "$RUNNER_TEMP/fnmatch-operations.json" --compiler-commit "$GITHUB_SHA" --result "$RUNNER_TEMP/fnmatch-evidence.json"
      - name: Check POSIX normcase with the original path fixtures
        run: |
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/os/normcase.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/posix-normcase-O$opt.json" --check
          done
      - name: Run every CPython fnmatch case with native operations at O0 and O3
        run: python3 benchmarks/cpython_stdlib/full/fnmatch/run_operations.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-fnmatch.json"
      - name: Check subprocess.run with vendored CPython methods
        run: python3 benchmarks/cpython_stdlib/native_subprocess.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Run vendored CPython methods against native Imre
        run: |
          python3 benchmarks/cpython_stdlib/native_base64.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-base64.json"
          python3 benchmarks/cpython_stdlib/native_hashlib.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-hashlib.json"
          python3 benchmarks/cpython_stdlib/native_zip_members.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-zip-members.json"
          python3 benchmarks/cpython_stdlib/native_zipfile.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-zipfile.json"
          python3 benchmarks/cpython_stdlib/native_paths.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level 3 --result "$RUNNER_TEMP/cpython-paths.json"
          for level in 0 3; do
