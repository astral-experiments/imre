name: JSON verification
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact prospective commit in this repository
        required: true
        type: string
      audit:
        description: Additional required native controls
        type: choice
        default: decoder
        options: [decoder, decoder-merge, decoder-current-main, key-body, number-hooks]
permissions:
  contents: read
concurrency:
  group: json-stdlib-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: ${{ inputs.source }}
      JSON_AUDIT: ${{ inputs.audit }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source }}
          fetch-depth: ${{ inputs.audit == 'decoder-current-main' && '0' || '1' }}
          persist-credentials: false
      - name: Identify the exact source and tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          results="$RUNNER_TEMP/json-results"
          mkdir -p "$results"
          if [[ "$JSON_AUDIT" == decoder-current-main ]]; then
            # checkout fetched all branches, including main, and discarded its read credential.
            base=$(git rev-parse refs/remotes/origin/main)
            tree=$(git merge-tree --write-tree "$base" "$EXPECTED_SOURCE")
            export GIT_AUTHOR_DATE GIT_COMMITTER_DATE
            GIT_AUTHOR_DATE=$(git show -s --format=%cI "$base")
            GIT_COMMITTER_DATE=$GIT_AUTHOR_DATE
            merge=$(git -c user.name='Imre verification' -c user.email='github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base" -p "$EXPECTED_SOURCE" -m 'Verify the current prospective JSON decoder merge')
            git checkout --detach "$merge"
            echo "$base $EXPECTED_SOURCE $tree" | tee "$results/merge-inputs.txt"
          fi
          echo "JSON_TEST_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git cat-file -p HEAD | sed -n '/^$/q; /^tree /p; /^parent /p' > "$results/commit-objects.txt"
          git show -s --format='%H %T' | tee "$results/source.txt"
          echo "JSON_RESULTS=$results" >> "$GITHUB_ENV"
          echo "JSON_DIR=$GITHUB_WORKSPACE/benchmarks/cpython_stdlib/full/json" >> "$GITHUB_ENV"
          echo "JSON_IMRE=$GITHUB_WORKSPACE/target/stdlib-json/imre" >> "$GITHUB_ENV"
          echo "JSON_RUNTIME=$GITHUB_WORKSPACE/target/stdlib-json/libimre_runtime.a" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: |
            Lib/test
            Lib/json
          persist-credentials: false
      - name: Verify pinned sources and stock outcomes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib"
          python3 -B -m test --single-process --tempdir "$RUNNER_TEMP" --randseed 1 -u cpu --junit-xml "$JSON_RESULTS/reference.xml" test_json
          python3 -B "$JSON_DIR/reference.py" "$JSON_RESULTS/reference.xml" --result "$JSON_RESULTS/reference-linux.json"
          cmp "$JSON_DIR/reference-linux.json" "$JSON_RESULTS/reference-linux.json"
      - name: Install clang if absent
        if: ${{ !cancelled() }}
        run: |
          if ! test -x /usr/bin/clang-18; then
            sudo apt-get update && sudo apt-get install -y clang-18
          fi
      - name: Build the prospective compiler and runtime
        id: build
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          profile=(--config 'profile.stdlib-json.inherits="dev"' --config 'profile.stdlib-json.debug=0' --config 'profile.stdlib-json.incremental=false')
          cargo "${profile[@]}" build --locked --profile stdlib-json -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
          sha256sum "$JSON_IMRE" "$JSON_RUNTIME" | tee "$JSON_RESULTS/binaries.sha256"
      - name: Test native runtime and intact entry points
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          profile=(--config 'profile.stdlib-json.inherits="dev"' --config 'profile.stdlib-json.debug=0' --config 'profile.stdlib-json.incremental=false')
          cargo "${profile[@]}" test --locked --profile stdlib-json -j 2 -p imre-runtime --lib objects::json | tee "$JSON_RESULTS/runtime-json.txt"
          PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib" python3 -B "$JSON_DIR/startup.py" --compiler "$JSON_IMRE" --cpython-git "$PWD/.cpython-stdlib-reference" --result "$JSON_RESULTS/doctest-startup-linux.json"
      - name: Compare decoder behavior and type checks at O0 and O3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/json_records/stdlib_decoder_instance.py
          python3 -I -B "$fixture" > "$JSON_RESULTS/decoder-reference.txt"
          for opt in 0 3; do
            "$JSON_IMRE" build "$fixture" --no-cache --opt-level "$opt" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/decoder-instance"
            "$RUNNER_TEMP/decoder-instance" > "$JSON_RESULTS/decoder-O$opt.txt"
            diff -u "$JSON_RESULTS/decoder-reference.txt" "$JSON_RESULTS/decoder-O$opt.txt"
          done
          python3 -B tests/json_records.py --compiler "$JSON_IMRE" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18 --opt-levels 0 3 | tee "$JSON_RESULTS/json-records.txt"
      - name: Observe original key identity and nested decoding fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib"
          tools=(--imre "$JSON_IMRE" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18)
          python3 -B "$JSON_DIR/key_identity.py" "${tools[@]}" --result "$JSON_RESULTS/key-identity-linux.json"
          python3 -B "$JSON_DIR/deep_decode.py" "${tools[@]}" --result "$JSON_RESULTS/deep-decode-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && inputs.audit == 'key-body' }}
        with:
          name: json-key-details-${{ inputs.source }}
          path: ${{ runner.temp }}/json-results/key-identity-linux.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require native identity assertions in both unchanged key fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.audit == 'key-body' }}
        shell: bash
        run: |
          set -euo pipefail
          for fixture in object_key_iteration decoder_callables; do
            source="tests/fixtures/json_records/$fixture.py"
            python3 -I -B "$source" > "$JSON_RESULTS/$fixture-reference.txt"
            for opt in 0 3; do
              "$JSON_IMRE" build "$source" --no-cache --opt-level "$opt" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/$fixture"
              "$RUNNER_TEMP/$fixture" > "$JSON_RESULTS/$fixture-O$opt.txt"
              diff -u "$JSON_RESULTS/$fixture-reference.txt" "$JSON_RESULTS/$fixture-O$opt.txt"
            done
          done
          python3 -B - "$JSON_RESULTS/key-identity-linux.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert set(report["levels"]) == {"0", "3"}
          for level, data in report["levels"].items():
              attempt = data["native-body-attempts"]["native-key-assertions"]
              ids = {f"test.test_json.test_decode.Test{backend}Decode.test_keys_reuse" for backend in ["C", "Py"]}
              assert set(attempt.get("passed", [])) == ids and not attempt["failed"] and not attempt["skipped"], (level, attempt)
              for case in ids:
                  obs, = attempt["observations"][case]
                  assert obs["roles"] == dict(body="imre", operation="imre", assertions="imre", fixture="mixed"), (case, obs)
              assert data["native-distinct-owner-control"]["outcome"] == "pass", (level, data["native-distinct-owner-control"])
              print(f"-O{level}: both unchanged methods completed; separate owners were rejected")
          PY
      - name: Compare the overlapping native shutil callable path
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (inputs.audit == 'key-body' || inputs.audit == 'decoder-merge' || inputs.audit == 'decoder-current-main') }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "tests")
          import paths
          fixture = Path("tests/fixtures/paths/shutil_callable.py").resolve()
          results = Path(os.environ["JSON_RESULTS"])
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              reference = root / "reference"
              paths.seed(reference)
              expected = subprocess.run([sys.executable, "-E", "-B", fixture], cwd=reference, capture_output=True, check=True)
              assert not expected.stderr
              (results / "shutil-callables-reference.txt").write_bytes(expected.stdout)
              state = paths.snapshot(reference)
              for level in ("0", "3"):
                  binary = root / ("shutil-O" + level)
                  subprocess.run([os.environ["JSON_IMRE"], "build", fixture, "--no-cache", "--opt-level", level,
                                  "--runtime", os.environ["JSON_RUNTIME"], "--clang", "/usr/bin/clang-18", "-o", binary], check=True)
                  work = root / level
                  paths.seed(work)
                  actual = subprocess.run([binary], cwd=work, capture_output=True, check=True)
                  (results / ("shutil-callables-O" + level + ".txt")).write_bytes(actual.stdout)
                  assert (actual.stdout, actual.stderr, paths.snapshot(work)) == (expected.stdout, b"", state)
          PY
      - name: Observe numeric hook order and every feasible original fixture
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.audit == 'number-hooks' }}
        shell: bash
        run: |
          set -euo pipefail
          source="$PWD/tests/fixtures/json_records/number_hooks.py"
          export PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib"
          mkdir -p "$RUNNER_TEMP/numbers"
          cd "$RUNNER_TEMP/numbers"
          python3 -I -B "$source" > "$JSON_RESULTS/number-hooks-reference.txt"
          for opt in 0 3; do
            "$JSON_IMRE" build "$source" --no-cache --opt-level "$opt" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/numbers/driver"
            "$RUNNER_TEMP/numbers/driver" > "$JSON_RESULTS/number-hooks-O$opt.txt"
            diff -u "$JSON_RESULTS/number-hooks-reference.txt" "$JSON_RESULTS/number-hooks-O$opt.txt"
          done
          python3 -B "$JSON_DIR/native.py" --imre "$JSON_IMRE" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18 --result "$JSON_RESULTS/numeric-fixtures-linux.json"
      - name: Execute all available complete-method bodies and fixture operations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib"
          tools=(--imre "$JSON_IMRE" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18)
          python3 -B "$JSON_DIR/sweep.py" "${tools[@]}" --result "$JSON_RESULTS/routine-sweep-linux.json"
          python3 -B "$JSON_DIR/roundtrips.py" "${tools[@]}" --imre-revision "$JSON_TEST_REVISION" --result "$JSON_RESULTS/roundtrips-linux.json"
          python3 -B "$JSON_DIR/bodies.py" "${tools[@]}" --result "$JSON_RESULTS/bodies-linux.json"
      - name: Validate both full per-occurrence reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython-stdlib-reference/Lib"
          cp "$JSON_RESULTS/doctest-startup-linux.json" "$JSON_DIR/doctest-startup-linux.json"
          python3 -B "$JSON_DIR/evidence.py" --imre "$JSON_IMRE" --runtime "$JSON_RUNTIME" --clang /usr/bin/clang-18 --result "$JSON_RESULTS/evidence-linux.json"
          python3 -B benchmarks/cpython_stdlib/suite_evidence.py "$JSON_DIR/reference-linux.json" "$JSON_RESULTS/evidence-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: json-decoder-${{ inputs.source }}
          path: ${{ runner.temp }}/json-results
          if-no-files-found: warn
          retention-days: 14
