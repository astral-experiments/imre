name: Exact Imre ASan capacity probe
run-name: Full ASan capacity at addbc8e23673
'on':
  workflow_dispatch:
    inputs:
      full_asan:
        type: boolean
        default: true
        description: Run every O1 and O0 ASan suite
permissions:
  contents: read
jobs:
  routed-asan:
    runs-on: "${{ github.repository_id == '1423429334' && 'namespace-profile-ubuntu-24-04-16' ||\n    github.repository == 'astral-sh/imre'\
      \ && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}"
    timeout-minutes: 45
    env:
      IMRE_REAL_WHEEL: .cpython-stdlib-reference/Lib/ensurepip/_bundled/pip-26.1.1-py3-none-any.whl
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: addbc8e2367320efd248a6c3d1e297b755e98bdc
        fetch-depth: 4
        persist-credentials: false
    - name: Verify the exact candidate source and record runner capacity
      run: 'test "$(git rev-parse HEAD)" = ''addbc8e2367320efd248a6c3d1e297b755e98bdc''

        git show -s --format=''%H %T'' HEAD

        printf ''visible CPUs: ''; nproc

        df -B1 / "$RUNNER_TEMP"

        for p in target "$HOME/.cache/imre" "$HOME/.cargo" "$HOME/.rustup" .cpython-stdlib-reference; do if [[ -e "$p" ]]; then du -sB1
        "$p"; fi; done'
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.14.5
    - name: Install the wheel test dependencies
      run: python3 -m pip install "wheel==0.45.1" "packaging==25.0" "build==1.3.0" "setuptools==81.0.0"
    - name: Get the pinned CPython unittest support and extension docstrings
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: python/cpython
        ref: 5607950ef232dad16d75c0cf53101d9649d89115
        path: .cpython-stdlib-reference
        sparse-checkout: 'Lib/test

          Lib/logging

          Lib/ensurepip/_bundled

          Modules

          '
        persist-credentials: false
    - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
    - run: cargo build -p imre-compiler --release --locked --features imre-compiler/verify-ir
    - name: Build the runtime with AddressSanitizer
      env:
        RUSTC_BOOTSTRAP: '1'
        RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      run: 'imre_target="$(rustc -vV | sed -n ''s/^host: //p'')"

        cargo build -p imre-runtime --features corosensei/sanitizer --release --locked --target "$imre_target" --target-dir target/asan

        '
    - name: Measure linked fixture executables on the parent and candidate
      run: "python3 - <<'PY'\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport subprocess\nimport\
        \ sys\nimport tempfile\nimport time\n\nroot = Path.cwd()\nrunner = Path(os.environ['RUNNER_TEMP'])\ntarget = subprocess.check_output(['rustc','-vV'],\
        \ text=True).split('host: ')[1].splitlines()[0]\ncompiler = root/'target/release/imre'\nruntime = root/'target/asan'/target/'release/libimre_runtime.a'\n\
        parent = 'bdd32d88ed9ec475e837cc5927132059d57726e1'\nassert subprocess.check_output(['git','rev-parse','db7616412f4caf1537223b3d9fddb967777beb89^'],text=True).strip()\
        \ == parent\nwith tempfile.TemporaryDirectory(dir=runner) as work:\n    work = Path(work)\n    old = work/'old-tests'\n    old.mkdir()\n\
        \    with subprocess.Popen(['git','archive',parent,'tests'],stdout=subprocess.PIPE) as producer:\n        subprocess.run(['tar','-xf','-','-C',old],stdin=producer.stdout,check=True)\n\
        \        assert producer.wait() == 0\n    print('CAPACITY toolchain',json.dumps({k:hashlib.file_digest(p.open('rb'),'sha256').hexdigest()\
        \ for k,p in [('compiler',compiler),('runtime',runtime)]}),flush=True)\n    for suite, level in [('iterables','1'),('iterator_pipelines','0'),('containers','1')]:\n\
        \        counts = {}\n        for label, tests in [('parent',old/'tests'),('candidate',root/'tests')]:\n            with tempfile.TemporaryDirectory(dir=work)\
        \ as tmp:\n                tmp = Path(tmp)\n                env = dict(os.environ, TMPDIR=str(tmp), IMRE_CACHE_DIR=str(tmp/'aot-cache'),\
        \ PYTHONDONTWRITEBYTECODE='1')\n                cmd = [sys.executable,str(tests/(suite+'.py')),'--compiler',str(compiler),'--runtime',str(runtime),'--clang','clang-18','--sanitize','--opt-levels',level]\n\
        \                count = allocated = longest = 0\n                seen = {}\n                free_start = free_min = shutil.disk_usage(tmp).free\n\
        \                with subprocess.Popen(cmd,env=env) as process:\n                    while process.poll() is None:\n       \
        \                 live = total = biggest = 0\n                        pattern = 'imre-containers-*/*-O'+level if suite=='containers'\
        \ else 'imre-*/*/program-O'+level\n                        for p in tmp.glob(pattern):\n                            try:\n \
        \                               stat = p.stat()\n                            except FileNotFoundError:\n                   \
        \             continue\n                            total += 512 * stat.st_blocks\n                            biggest = max(biggest,stat.st_size)\n\
        \                            if stat.st_mode & 0o111:\n                                live += 1\n                         \
        \       fixture = p.name if suite=='containers' else p.parent.name\n                                seen[fixture] = max(seen.get(fixture,0),stat.st_size)\n\
        \                        count=max(count,live)\n                        allocated=max(allocated,total)\n                   \
        \     longest=max(longest,biggest)\n                        free_min=min(free_min,shutil.disk_usage(tmp).free)\n           \
        \             time.sleep(.025)\n                    assert process.returncode == 0, (suite,level,label,process.returncode)\n\
        \                row=dict(suite=suite,opt=level,version=label,observed_outputs=len(seen),peak_live_elfs=count,peak_allocated_bytes=allocated,max_single_bytes=longest,\n\
        \                         initial_free_bytes=free_start,min_free_bytes=free_min,compiler_cache_created=(tmp/'aot-cache').exists(),fixture_elf_bytes=seen)\n\
        \                print('CAPACITY fixture',json.dumps(row,sort_keys=True),flush=True)\n                counts[label]=count\n\
        \                assert not row['compiler_cache_created']\n        assert counts['parent'] > 1 and counts['candidate'] == 1,\
        \ counts\n\nPY"
    - name: Check native ownership and wheels with AddressSanitizer
      run: 'imre_target="$(rustc -vV | sed -n ''s/^host: //p'')"

        python3 tests/extension_wheel.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a"
        --clang clang-18 --sanitize

        python3 tests/wheel_record.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a"
        --clang clang-18 --sanitize --opt-levels 0

        python3 tests/differential.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a"
        --clang clang-18 --sanitize --opt-levels 1

        '
    - name: Measure installed baseline before the full suites
      run: 'df -B1 / "$RUNNER_TEMP"

        for p in target "$HOME/.cache/imre" "$HOME/.cargo" "$HOME/.rustup" .cpython-stdlib-reference; do if [[ -e "$p" ]]; then du -sB1
        "$p"; fi; done'
    - name: Run the full AddressSanitizer suites
      if: github.event_name != 'workflow_dispatch' || inputs.full_asan
      run: "imre_target=\"$(rustc -vV | sed -n 's/^host: //p')\"\npython3 tests/run_suites.py --log-dir /tmp/imre-suites-asan-o1 --suites\
        \ imports classes containers tuple_keys comprehensions fstrings calls inference iterables iterator_pipelines callables json_records\
        \ dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations\
        \ unions module_values base45 luhn exceptions io files paths processes argparse_cli \\\n  -- --compiler target/release/imre\
        \ --runtime \"target/asan/$imre_target/release/libimre_runtime.a\" --clang clang-18 --sanitize --opt-levels 1\npython3 tests/run_suites.py\
        \ --log-dir /tmp/imre-suites-asan-o0 --suites errno containers tuple_keys fstrings calls inference iterables iterator_pipelines\
        \ callables json_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives\
        \ string_reuse decoder_optimizations unions module_values base45 luhn exceptions files paths processes argparse_cli \\\n  --\
        \ --compiler target/release/imre --runtime \"target/asan/$imre_target/release/libimre_runtime.a\" --clang clang-18 --sanitize\
        \ --opt-levels 0\n"
    - name: Measure disk after the full suites
      if: always()
      run: 'df -B1 / "$RUNNER_TEMP"

        for p in target "$HOME/.cache/imre" "$HOME/.cargo" "$HOME/.rustup" .cpython-stdlib-reference; do if [[ -e "$p" ]]; then du -sB1
        "$p"; fi; done'
  fallback-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMRE_REAL_WHEEL: .cpython-stdlib-reference/Lib/ensurepip/_bundled/pip-26.1.1-py3-none-any.whl
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: addbc8e2367320efd248a6c3d1e297b755e98bdc
        fetch-depth: 4
        persist-credentials: false
    - name: Verify the exact candidate source and record runner capacity
      run: 'test "$(git rev-parse HEAD)" = ''addbc8e2367320efd248a6c3d1e297b755e98bdc''

        git show -s --format=''%H %T'' HEAD

        printf ''visible CPUs: ''; nproc

        df -B1 / "$RUNNER_TEMP"

        for p in target "$HOME/.cache/imre" "$HOME/.cargo" "$HOME/.rustup" .cpython-stdlib-reference; do if [[ -e "$p" ]]; then du -sB1
        "$p"; fi; done'
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.14.5
    - name: Install the wheel test dependencies
      run: python3 -m pip install "wheel==0.45.1" "packaging==25.0" "build==1.3.0" "setuptools==81.0.0"
    - name: Get the pinned CPython unittest support and extension docstrings
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: python/cpython
        ref: 5607950ef232dad16d75c0cf53101d9649d89115
        path: .cpython-stdlib-reference
        sparse-checkout: 'Lib/test

          Lib/logging

          Lib/ensurepip/_bundled

          Modules

          '
        persist-credentials: false
    - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
    - run: cargo build -p imre-compiler --release --locked --features imre-compiler/verify-ir
    - name: Build the runtime with AddressSanitizer
      env:
        RUSTC_BOOTSTRAP: '1'
        RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      run: 'imre_target="$(rustc -vV | sed -n ''s/^host: //p'')"

        cargo build -p imre-runtime --features corosensei/sanitizer --release --locked --target "$imre_target" --target-dir target/asan

        '
    - name: Check native ownership and wheels with AddressSanitizer
      run: 'imre_target="$(rustc -vV | sed -n ''s/^host: //p'')"

        python3 tests/extension_wheel.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a"
        --clang clang-18 --sanitize

        python3 tests/wheel_record.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a"
        --clang clang-18 --sanitize --opt-levels 0

        python3 tests/differential.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a"
        --clang clang-18 --sanitize --opt-levels 1

        '
    - name: Measure installed baseline before the full suites
      run: 'df -B1 / "$RUNNER_TEMP"

        for p in target "$HOME/.cache/imre" "$HOME/.cargo" "$HOME/.rustup" .cpython-stdlib-reference; do if [[ -e "$p" ]]; then du -sB1
        "$p"; fi; done'
    - name: Run the full AddressSanitizer suites
      if: github.event_name != 'workflow_dispatch' || inputs.full_asan
      run: "imre_target=\"$(rustc -vV | sed -n 's/^host: //p')\"\npython3 tests/run_suites.py --log-dir /tmp/imre-suites-asan-o1 --suites\
        \ imports classes containers tuple_keys comprehensions fstrings calls inference iterables iterator_pipelines callables json_records\
        \ dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations\
        \ unions module_values base45 luhn exceptions io files paths processes argparse_cli \\\n  -- --compiler target/release/imre\
        \ --runtime \"target/asan/$imre_target/release/libimre_runtime.a\" --clang clang-18 --sanitize --opt-levels 1\npython3 tests/run_suites.py\
        \ --log-dir /tmp/imre-suites-asan-o0 --suites errno containers tuple_keys fstrings calls inference iterables iterator_pipelines\
        \ callables json_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives\
        \ string_reuse decoder_optimizations unions module_values base45 luhn exceptions files paths processes argparse_cli \\\n  --\
        \ --compiler target/release/imre --runtime \"target/asan/$imre_target/release/libimre_runtime.a\" --clang clang-18 --sanitize\
        \ --opt-levels 0\n"
    - name: Measure disk after the full suites
      if: always()
      run: 'df -B1 / "$RUNNER_TEMP"

        for p in target "$HOME/.cache/imre" "$HOME/.cargo" "$HOME/.rustup" .cpython-stdlib-reference; do if [[ -e "$p" ]]; then du -sB1
        "$p"; fi; done'
