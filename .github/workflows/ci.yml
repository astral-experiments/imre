name: Argparse pinned suite evidence
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact argparse source revision
        type: choice
        required: true
        options:
          - '71ffc22719423ad434d0389a08e6d80395aece01'
          - 'ca977019d95d473818bc5bab8043d5c02a218dd8'
          - 'ffaeacce37443598a47cfae27815f277f509776b'
          - 'b65213dfe9d6fdd4b429bd079ae52cb302530f25'
          - '4568c9ddf08b7666251cc718f8c7e9e74d72a57c'
          - '4c68a78174db25c6db1efb6293d6be6dccdd42ef'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 180
    env:
      REVISION: ${{ inputs.revision }}
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_INCREMENTAL: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-argparse
          sparse-checkout: |
            Lib
            Tools/i18n
          persist-credentials: false
      - name: Verify the complete original CPython suite and reference
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git -C .cpython-argparse rev-parse HEAD)" = 5607950ef232dad16d75c0cf53101d9649d89115
          test "$(git hash-object --no-filters .cpython-argparse/Tools/i18n/pygettext.py)" = ddf4474d2bce55f7edd0ddd5db132ddea86ba88c
          mkdir -p "$RUNNER_TEMP/argparse-receipts"
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-argparse/Lib"
          python3 -B benchmarks/cpython_stdlib/suite_inventory.py benchmarks/cpython_stdlib/full/argparse/UPSTREAM.json --result "$RUNNER_TEMP/argparse-receipts/reference-linux.json"
          cmp benchmarks/cpython_stdlib/full/argparse/reference-linux.json "$RUNNER_TEMP/argparse-receipts/reference-linux.json"
      - name: Build the same native compiler and runtime revision
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
          {
            git rev-parse HEAD HEAD^{tree}
            git -C .cpython-argparse rev-parse HEAD
            python3 --version
            rustc --version
            /usr/bin/clang-18 --version
            sha256sum target/debug/imre target/debug/libimre_runtime.a
          } > "$RUNNER_TEMP/argparse-receipts/build.txt"
      - name: Run all 1893 occurrences at O0 and O3
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/.cpython-argparse/Lib" PYTHONUNBUFFERED=1
          out="$RUNNER_TEMP/argparse-receipts"
          python3 -B benchmarks/cpython_stdlib/full/argparse/evidence.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --imre-revision "$REVISION" --result "$out/evidence-linux.json" | tee "$out/run.log"
          python3 -B benchmarks/cpython_stdlib/suite_evidence.py "$out/reference-linux.json" "$out/evidence-linux.json" | tee "$out/validation.log"
      - name: Preserve the versioned results and build receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: argparse-evidence-${{ inputs.revision }}
          path: ${{ runner.temp }}/argparse-receipts/
          if-no-files-found: error
          retention-days: 14
