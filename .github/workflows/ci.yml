name: Shutil prospective random merge
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare and identify the prospective merge source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          base=$(git rev-parse HEAD)
          git fetch --no-tags origin refs/heads/codex/shutil-shared-random
          head=$(git rev-parse FETCH_HEAD)
          test "$head" = 872292d89670b0d924c90c3751731261e11f04d6
          tree=$(git merge-tree --write-tree "$base" "$head")
          src=$(git -c user.name='Imre CI' -c user.email='ci@localhost' commit-tree "$tree" -p "$base" -p "$head" -m 'Test the exact prospective random merge')
          git switch --detach "$src"
          test "$(git write-tree)" = "$tree"
          jq -n --arg base "$base" --arg head "$head" --arg tree "$tree" '{base:$base,head:$head,tree:$tree}' | tee "$RUNNER_TEMP/evidence/source.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          command -v clang-18 || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Four unchanged test_shutil entry modes
        run: |
          python -B benchmarks/cpython_stdlib/full/check_suite_startup.py --compiler target/debug/imre --cpython-git .cpython test.test_shutil > "$RUNNER_TEMP/evidence/startup-linux.json" || test $? = 1
          jq -e '.tests_executed==0 and (.checks|length==4) and all(.checks[]; (.diagnostic | contains("test_shutil.py:14:") | not))' "$RUNNER_TEMP/evidence/startup-linux.json"
      - name: Compare native draws and filesystem fixture at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          python -B benchmarks/cpython_stdlib/full/shutil/random_consumer.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/evidence/random-consumer-linux.json"
      - name: Check I/O and crossed exceptions on the same source
        run: |
          set -euo pipefail
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python -B tests/io.py --compiler target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 | tee "$RUNNER_TEMP/evidence/io.log"
          for control in check_csv_handlers copy_error_controls; do
            python -B "benchmarks/cpython_stdlib/full/shutil/$control.py" "${args[@]}" | tee "$RUNNER_TEMP/evidence/$control.log"
          done
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$RUNNER_TEMP/evidence/binaries.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-random-prospective
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
