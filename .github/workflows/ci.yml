name: Imre runner probe
run-name: Check Namespace runner access from Imre
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-ubuntu-24-04-16, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Check Ubuntu, CPU, memory, disk, and compiler tools
        shell: bash
        run: |
          set -eu
          . /etc/os-release
          test "$ID/$VERSION_ID" = ubuntu/24.04
          test "$(uname -m)" = x86_64
          python3 - <<'PY'
          import os, platform, shutil
          from pathlib import Path
          print('architecture:', platform.machine())
          print('visible CPUs:', len(os.sched_getaffinity(0)))
          print(next(line for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:')))
          print('free disk GiB:', shutil.disk_usage('.').free // 2**30)
          for tool in ('cargo', 'clang-18', 'llvm-config-18', 'pkg-config'):
              print(tool, shutil.which(tool))
          PY
