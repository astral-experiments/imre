name: Archive callbacks and every original shutil occurrence in both compiler modes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source without the workflow overlay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git switch --detach HEAD^
          test "$(git rev-parse HEAD)" = 275514a386c270c9cf4f08feaf1724078aab7687
          test "$(git rev-parse HEAD^{tree})" = cdb64f311b112fa5abd372266d7fe6188c1299d5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          (command -v clang-18 && command -v zstd) || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18 zstd)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Discover and run the untouched reference
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          out="$RUNNER_TEMP/evidence"
          dir=benchmarks/cpython_stdlib/full/shutil
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          mkdir "$RUNNER_TEMP/oracle"
          ln -s "$PWD/benchmarks/cpython_stdlib/upstream" "$RUNNER_TEMP/oracle/upstream"
          cp "$dir/UPSTREAM.json" "$RUNNER_TEMP/oracle/UPSTREAM.json"
          python -B benchmarks/cpython_stdlib/suite_inventory.py "$RUNNER_TEMP/oracle/UPSTREAM.json" --result "$out/reference-linux.json" || test $? = 1
          jq -e '.denominator==223 and (.reference|length==223)' "$out/reference-linux.json"
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$out/binaries.sha256"
      - name: Four unchanged test_shutil entry modes
        run: |
          python -B benchmarks/cpython_stdlib/full/check_suite_startup.py --compiler target/debug/imre --cpython-git .cpython test.test_shutil > "$RUNNER_TEMP/evidence/startup-linux.json" || test $? = 1
          jq -e '.operation=="check" and (.checks|length==4) and all(.checks[]; (.diagnostic | contains("test_shutil.py:14:") | not))' "$RUNNER_TEMP/evidence/startup-linux.json"
      - name: Original archive operations and crossed handlers at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          mod=benchmarks/cpython_stdlib/full/shutil
          opts=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python -B "$mod/archive_ops.py" "${opts[@]}" --cpython-source .cpython --result "$RUNNER_TEMP/evidence/archive-linux.json"
          for probe in archive_filters archive_handler_controls archive_root_controls archive_pack_controls check_csv_handlers copy_error_controls; do
            python -B "$mod/$probe.py" "${opts[@]}" | tee "$RUNNER_TEMP/evidence/$probe.log"
          done
      - name: Replay the os.chdir patch and verify actual restoration
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence"
          python -IB benchmarks/cpython_stdlib/full/shutil/mock_startup.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --compiler-tree "$(git rev-parse HEAD^{tree})" --cpython-source .cpython --result "$out/mock-startup.json"
          jq -e '.denominator==223 and .oracle.suite.tests_run==223 and (.oracle.suite.failures|length)==0 and (.oracle.suite.errors|length)==0 and (.oracle["patch-restore"]|contains("real chdir restored after exceptional exit")) and ([.native[]|select(.case=="patch-restore")]|length)==2' "$out/mock-startup.json"
      - name: Compare native draws and filesystem fixture at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          python -B benchmarks/cpython_stdlib/full/shutil/random_consumer.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/evidence/random-consumer-linux.json"
      - name: Cross warning and archive exception families at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          cd "$(mktemp -d)"
          mkdir dest
          printf invalid > damaged.tar
          cat > case.py <<'END_CASE'
          import csv
          import shutil
          import tarfile
          try:
              raise RuntimeWarning("archive observer")
          except (csv.Error, UnicodeEncodeError, OSError, shutil.RegistryError, tarfile.TarError):
              raise AssertionError("archive family caught RuntimeWarning")
          except Warning:
              print("warning")
          try:
              shutil.unpack_archive("damaged.tar", "dest")
          except Warning:
              raise AssertionError("Warning caught the archive read error")
          except shutil.ReadError:
              print("read error")
          try:
              raise shutil.RegistryError("duplicate")
          except Warning:
              raise AssertionError("Warning caught the registry error")
          except shutil.RegistryError:
              print("registry error")
          END_CASE
          python -IB case.py > "$evidence/cross-warning-reference.txt" 2> "$evidence/cross-warning-reference.stderr"
          for level in 0 3; do
            "$GITHUB_WORKSPACE/target/debug/imre" build case.py -o "$PWD/guard" --no-cache --opt-level "$level" --runtime "$GITHUB_WORKSPACE/target/debug/libimre_runtime.a" --clang /usr/bin/clang-18
            ./guard > "$evidence/cross-warning-O$level.txt" 2> "$evidence/cross-warning-O$level.stderr"
            cmp "$evidence/cross-warning-reference.txt" "$evidence/cross-warning-O$level.txt"
            cmp "$evidence/cross-warning-reference.stderr" "$evidence/cross-warning-O$level.stderr"
          done
          test -z "$(ls -A dest)"
      - name: Exercise the repaired local iterator and packed values
        run: |
          out="$RUNNER_TEMP/evidence"
          set -euo pipefail
          test "$(python -c 'import sys;print(sys.version.split()[0])')" = 3.14.5
          cargo test --locked -j 2 -p imre-compiler --lib effects::tests::local_and_final_analysis_agree_on_packed_list_allocations -- --exact > "$out/effects-test.log"
          grep -F '1 passed; 0 failed;' "$out/effects-test.log"
          work=$(mktemp -d "$RUNNER_TEMP/effects-XXXXXX")
          : > "$out/effects-fixtures.tsv"
          for fixture in tests/fixtures/iterator_pipelines/source_generator.py tests/fixtures/dataclasses/value_struct.py; do
            name=$(basename "$fixture" .py)
            PYTHONPATH="$PWD/stdlib" python -B "$fixture" > "$work/$name.ref" 2> "$work/$name.referr"
            for mode in ordinary reachable; do
              flags=()
              if [[ "$mode" == reachable ]]; then flags+=(--reachable-only); fi
              for level in 0 3; do
                target/debug/imre build "$fixture" -o "$work/probe" --no-cache --opt-level "$level" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${flags[@]}"
                "$work/probe" > "$work/$name.native" 2> "$work/$name.stderr"
                cmp "$work/$name.ref" "$work/$name.native"
                cmp "$work/$name.referr" "$work/$name.stderr"
                printf '%s\t-O%s\t%s\t%s\t%s\n' "$name" "$level" "$mode" "$(wc -l < "$work/$name.native")" "$(sha256sum "$work/$name.native" | cut -d' ' -f1)" >> "$out/effects-fixtures.tsv"
              done
            done
          done
          test "$(wc -l < "$out/effects-fixtures.tsv")" -eq 8
      - name: Verify both sides of the LLVM conflict and checked tuple indexing
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          for fixture in tests/fixtures/text/percent_tuple.py tests/fixtures/expressions/tuple_formatter_get_value.py; do
            label=$(basename "$fixture" .py)
            python -IB "$fixture" > "$work/$label.ref" 2> "$work/$label.referr"
            for level in 0 3; do
              target/debug/imre build "$fixture" -o "$work/probe" --no-cache --opt-level "$level" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18
              "$work/probe" > "$work/$label.native" 2> "$work/$label.err"
              cmp "$work/$label.ref" "$work/$label.native"
              cmp "$work/$label.referr" "$work/$label.err"
              echo "$label -O$level matches CPython" >> "$RUNNER_TEMP/evidence/tuple-controls.log"
            done
          done
      - name: Run all original occurrences in ordinary and reachable modes at both levels
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          d=benchmarks/cpython_stdlib/full/shutil
          out="$RUNNER_TEMP/evidence"
          reference_match=0
          diff -u "$d/reference-linux.json" "$out/reference-linux.json" > "$out/reference-diff.txt" || reference_match=$?
          python -B benchmarks/cpython_stdlib/suite_modes.py --source "$(git rev-parse HEAD)" --entry "$d/suite_modes_entry.py" --reference "$d/reference-linux.json" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython --output "$out/modes"
          exit "$reference_match"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-archive-modes-repaired
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
