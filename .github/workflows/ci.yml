name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-artifacts:
    uses: $/.github/workflows/build-release-binaries.yml

  macos-arm64:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'namespace-profile-macos-15' || 'macos-15' }}
    timeout-minutes: 45
    env:
      IMRE_REAL_WHEEL: .cpython-wheel-reference/Lib/ensurepip/_bundled/pip-26.1.1-py3-none-any.whl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: cargo build --workspace --release --locked
      - name: Verify the standard library reference and native ledgers
        run: |
          python3 benchmarks/cpython_stdlib/full/reference_report.py
          python3 benchmarks/cpython_stdlib/full/native_report.py
          python3 benchmarks/cpython_stdlib/full/test_native_report.py
      - run: cargo test --workspace --release --locked
      - name: Compare string core on Apple Silicon
        run: python3 benchmarks/cpython_stdlib/full/string/native_core.py --imre target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
      - name: Build and install a Imre extension wheel
        run: |
          python3 -m pip install "wheel==0.45.1" "packaging==25.0"
          python3 tests/extension_wheel.py --compiler target/release/imre --runtime target/release/libimre_runtime.a
      - uses: ./.github/actions/test-google-crc32c
      - name: Compare Apple Silicon executables with CPython
        run: |
          target/release/imre build tests/programs/control_flow.py -o "$RUNNER_TEMP/control_flow"
          lipo "$RUNNER_TEMP/control_flow" -verify_arch arm64
          python3 tests/run_suites.py --workers 3 --log-dir "$RUNNER_TEMP/imre-suites" \
            --suites unittest_main differential io files bytes paths processes argparse_cli workspaces base45 containers comprehensions tuple_keys callables \
            -- --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3

      - name: Get the pinned CPython test files and bundled pip wheel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-wheel-reference
          sparse-checkout: |
            Lib/ensurepip/_bundled
            Lib/test
          persist-credentials: false
      - name: Compare PyPA's RECORD validator with CPython
        run: python3 tests/wheel_record.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
      - name: Compare uv's upstream wheel checker with CPython
        run: python3 tests/uv_wheel_check.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --opt-levels 3
      - name: Check Darwin stat functions and exports against CPython
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          dir=benchmarks/cpython_stdlib/full/stat
          python3 "$dir/run_operations.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang --cpython-source .cpython-wheel-reference --result "$RUNNER_TEMP/cpython-stat.json"
          python3 "$dir/check_modes.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang
      - name: Compare Ruff’s reporters with CPython
        run: |
          target/release/imre build examples/conformance_report/upstream/conformance.py -o "$RUNNER_TEMP/ruff-conformance"
          python3 tests/ruff_program.py --binary "$RUNNER_TEMP/ruff-conformance"
          target/release/imre build examples/memory_report/upstream/memory_report.py -o "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_compare.py --binary "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_run.py --binary "$RUNNER_TEMP/ruff-memory"
          target/release/imre build examples/conformance_report/__main__.py --module-root examples -o "$RUNNER_TEMP/conformance-report"
          python3 benchmarks/conformance_grouping_inputs.py \
            --archive benchmarks/results/2026-10-22-collector-ownership-study.tar.xz \
            --output "$RUNNER_TEMP/conformance-inputs" --check-reporter "$RUNNER_TEMP/conformance-report"

  windows-compiler:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'namespace-profile-windows-2022-x86-64-16x32' || 'windows-2022' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The native runtime depends on POSIX process and filesystem APIs.
      - run: cargo test -p imre-compiler --lib --locked

  check:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      IMRE_REAL_WHEEL: .cpython-stdlib-reference/Lib/ensurepip/_bundled/pip-26.1.1-py3-none-any.whl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install LLVM 18 and the CRC32C build tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 cmake
      - name: Verify and assemble the vendored CPython suite fixtures
        run: |
          python3 benchmarks/cpython_stdlib/full/test_stage_tests.py
          python3 benchmarks/cpython_stdlib/full/stage_tests.py "$RUNNER_TEMP/imre-cpython-fixtures"
          python3 -B benchmarks/cpython_stdlib/full/discover_staged.py "$RUNNER_TEMP/imre-cpython-fixtures"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Validate slice-sum fusion on bounded heaps
        env:
          CLANG: clang-18
        run: |
          cargo build -p imre-runtime --locked
          cargo test -p imre-compiler --lib --locked slice_sum_validation::bounded_slice_sums -- --exact --ignored --nocapture
      - name: Free disk space for native test binaries
        run: cargo clean --profile dev
      - run: cargo build --workspace --release --locked --features imre-compiler/verify-ir
      - name: Get the pinned CPython unittest support and extension docstrings
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: |
            Lib/test
            Lib/ensurepip/_bundled
            Modules
          persist-credentials: false
      - name: Run pinned unittest methods against native Imre
        run: |
          python3 benchmarks/cpython_stdlib/test_suite_evidence.py
          python3 tests/unittest_main.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/unittest/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-unittest.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/unittest/reference-linux.json "$RUNNER_TEMP/cpython-unittest.json"
      - name: Compare static inspect lookups with the pinned CPython suite
        run: |
          python3 benchmarks/cpython_stdlib/full/inspect/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-inspect.json"
      - name: Verify the complete OS, POSIX and genericpath evidence
        run: |
          for level in 0 3; do
            for runner in value_cases native_descriptors host_descriptors credential_children; do
              python3 "benchmarks/cpython_stdlib/full/os/$runner.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$level" --result "$RUNNER_TEMP/$runner-O$level.json"
            done
          done
          python3 benchmarks/cpython_stdlib/full/os/evidence.py --cpython-source .cpython-stdlib-reference --output "$RUNNER_TEMP" --check \
            --values-results "$RUNNER_TEMP/value_cases-O0.json" "$RUNNER_TEMP/value_cases-O3.json" \
            --credential-results "$RUNNER_TEMP/credential_children-O0.json" "$RUNNER_TEMP/credential_children-O3.json" \
            --descriptor-results "$RUNNER_TEMP/native_descriptors-O0.json" "$RUNNER_TEMP/host_descriptors-O0.json" "$RUNNER_TEMP/native_descriptors-O3.json" "$RUNNER_TEMP/host_descriptors-O3.json"
      - name: Compare structured OS failures with CPython
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/os-errno-fields-XXXXXX")
          src="$GITHUB_WORKSPACE/benchmarks/cpython_stdlib/full/os/errno_fields.py"
          cd "$work"
          python3 "$src" > reference
          for opt in 0 3; do
            "$GITHUB_WORKSPACE/target/release/imre" build "$src" --no-cache --runtime "$GITHUB_WORKSPACE/target/release/libimre_runtime.a" --clang /usr/bin/clang-18 --opt-level "$opt" -o "$work/fields"
            ./fields > native
            diff -u reference native
          done
      - name: Check sys streams and exits with vendored CPython methods
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          LC_CTYPE: C.UTF-8
        run: |
          unset PYTHONUTF8 PYTHONIOENCODING
          sys_runner=(benchmarks/cpython_stdlib/full/sys/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference)
          python3 benchmarks/cpython_stdlib/native_sys.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          for opt in 0 3; do
            python3 -B "${sys_runner[@]}" --opt-level "$opt" --result "$RUNNER_TEMP/test-sys-O$opt.json" --evidence "$RUNNER_TEMP/sys-evidence-O$opt.json"
            python3 -B -X utf8 "${sys_runner[@]}" --opt-level "$opt" --locale-audit "$RUNNER_TEMP/sys-locale-utf8-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/sys/argv_boundary.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$opt"
          done
          jq -s . "$RUNNER_TEMP/sys-evidence-O0.json" "$RUNNER_TEMP/sys-evidence-O3.json" > "$RUNNER_TEMP/sys-evidence.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/sys/reference-linux.json "$RUNNER_TEMP/sys-evidence.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/sys/reference-linux.json benchmarks/cpython_stdlib/full/sys/evidence-linux.json
      - name: Check pathlib file I/O, components and walking under the original CPython fixtures
        run: |
          for level in 0 3; do
            python3 benchmarks/cpython_stdlib/full/pathlib/native_files.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$level" --result "$RUNNER_TEMP/cpython-path-files-O$level.json"
            python3 benchmarks/cpython_stdlib/full/pathlib/walk_matrix.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$level"
          done
          python3 -X warn_default_encoding benchmarks/cpython_stdlib/full/pathlib/evidence.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --cohort components --cohort walk --cohort basics --result "$RUNNER_TEMP/cpython-path-components-walk-basics.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/pathlib/reference-linux.json benchmarks/cpython_stdlib/full/pathlib/evidence-linux.json
      - name: Account for every CPython itertools ID under its original fixtures
        run: |
          dir=benchmarks/cpython_stdlib/full/itertools
          python3 "$dir/coverage.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --baseline "$dir/evidence-linux.json" --result "$RUNNER_TEMP/itertools-evidence-linux.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py "$dir/reference-linux.json" "$RUNNER_TEMP/itertools-evidence-linux.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py "$dir/reference-free-threading-linux.json" "$dir/evidence-free-threading-linux.json"
      - name: Check POSIX normcase with the original path fixtures
        run: |
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/os/normcase.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/posix-normcase-O$opt.json" --check
          done
      - name: Run every CPython fnmatch case with native operations at O0 and O3
        run: python3 benchmarks/cpython_stdlib/full/fnmatch/run_operations.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-fnmatch.json"
      - name: Check subprocess.run with vendored CPython methods
        run: python3 benchmarks/cpython_stdlib/native_subprocess.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Run vendored CPython methods against native Imre
        run: |
          python3 benchmarks/cpython_stdlib/native_base64.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-base64.json"
          python3 benchmarks/cpython_stdlib/native_hashlib.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-hashlib.json"
          python3 benchmarks/cpython_stdlib/native_zip_members.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-zip-members.json"
          python3 benchmarks/cpython_stdlib/native_zipfile.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-zipfile.json"
          python3 benchmarks/cpython_stdlib/native_paths.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level 3 --result "$RUNNER_TEMP/cpython-paths.json"
          for level in 0 3; do
            python3 benchmarks/cpython_stdlib/full/pathlib/native_lexical.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$level" --result "$RUNNER_TEMP/cpython-path-lexical-O$level.json"
            python3 benchmarks/cpython_stdlib/full/pathlib/native_traversal.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$level" --result "$RUNNER_TEMP/cpython-path-traversal-O$level.json"
          done
          python3 benchmarks/cpython_stdlib/native_shutil.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil.json"
          python3 benchmarks/cpython_stdlib/full/shutil/native_copy.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil-copy.json"
          python3 benchmarks/cpython_stdlib/full/shutil/native_rmtree.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil-rmtree.json"
          python3 benchmarks/cpython_stdlib/native_json.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-json.json"
          python3 benchmarks/cpython_stdlib/native_json_values.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-json-values.json"
          python3 benchmarks/cpython_stdlib/full/shlex/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shlex.json"
          diff -u benchmarks/cpython_stdlib/full/shlex/native-linux.json "$RUNNER_TEMP/cpython-shlex.json"
          python3 benchmarks/cpython_stdlib/native_os.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
          python3 benchmarks/cpython_stdlib/native_os_path.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-os-path.json"
          stat_dir=benchmarks/cpython_stdlib/full/stat
          python3 "$stat_dir/generate_module.py" --check
          python3 "$stat_dir/run_operations.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-stat.json"
          python3 "$stat_dir/check_modes.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/logging/native_timed.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/logging/native_config.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/cpython-logging-config-O$opt.json"
          done
          python3 benchmarks/cpython_stdlib/native_logging.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
          python3 benchmarks/cpython_stdlib/full/logging/native_levels.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
      - name: Run CPython logging record and formatter methods at O0 and O3
        run: |
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/logging/native_records.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-records-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_hierarchy.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-children-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_formatters.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-formatters-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_filters.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-filters-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/descriptor_seek.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-descriptor-seek-O$opt.json"
          done
      - name: Build and install a Imre extension wheel
        run: |
          python3 -m pip install "wheel==0.45.1" "packaging==25.0"
          python3 tests/extension_wheel.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18
      - uses: ./.github/actions/test-google-crc32c
        with:
          cc: clang-18
          cxx: clang++-18
      - name: Check native build caching, linker options, and status
        run: |
          # Exercise the distro toolchain without setup-python's LD_LIBRARY_PATH.
          for suite in build_cache module_objects link_cache build_output; do
            env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin python3 "tests/$suite.py" --compiler target/release/imre
          done
      - name: Run complete upstream copy methods in native Imre
        run: |
          python3 benchmarks/cpython_stdlib/full/copy/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/copy-native.json"
          cmp benchmarks/cpython_stdlib/full/copy/native-linux.json "$RUNNER_TEMP/copy-native.json"
          python3 benchmarks/cpython_stdlib/full/copy/allocation_failure.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Run complete itertools methods in native Imre
        run: |
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/itertools/native.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$opt" --result "$RUNNER_TEMP/itertools-O$opt.json"
            for exercise in repeat sources tee; do
              src="benchmarks/cpython_stdlib/full/itertools/$exercise.py"
              target/release/imre build "$src" --opt-level "$opt" -o "$RUNNER_TEMP/iterator"
              "$RUNNER_TEMP/iterator" > "$RUNNER_TEMP/iterator.native"
              python3 "$src" > "$RUNNER_TEMP/iterator.reference"
              diff -u "$RUNNER_TEMP/iterator.reference" "$RUNNER_TEMP/iterator.native"
            done
          done
      - name: Run vendored CPython Counter methods in native Imre
        run: python3 benchmarks/cpython_stdlib/native_counter.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/cpython-counter.json"
      - name: Compare uv's upstream wheel checker with CPython
        run: python3 tests/uv_wheel_check.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Compare PyPA's RECORD validator with CPython
        run: python3 tests/wheel_record.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Compare Ruff’s reporters with CPython
        run: |
          target/release/imre build examples/conformance_report/upstream/conformance.py -o "$RUNNER_TEMP/ruff-conformance"
          python3 tests/ruff_program.py --binary "$RUNNER_TEMP/ruff-conformance"
          target/release/imre build examples/memory_report/upstream/memory_report.py -o "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_compare.py --binary "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_run.py --binary "$RUNNER_TEMP/ruff-memory"
          target/release/imre build examples/conformance_report/__main__.py --module-root examples -o "$RUNNER_TEMP/conformance-report"
          python3 benchmarks/conformance_grouping_inputs.py \
            --archive benchmarks/results/2026-10-22-collector-ownership-study.tar.xz \
            --output "$RUNNER_TEMP/conformance-inputs" --check-reporter "$RUNNER_TEMP/conformance-report"
      - name: Compare Ruff’s ecosystem check with CPython on local Git repositories
        run: |
          python3 -m pip install --no-deps tomli==2.5.0 tomli-w==1.2.0 unidiff==1.0.0
          target/release/imre check --entry-profile examples/ruff_ecosystem/check-entry.json examples/ruff_ecosystem/ruff_ecosystem/__main__.py
          python3 tests/ruff_ecosystem_live.py --compiler target/release/imre --runtime target/release/libimre_runtime.a
      - name: Check CSV reader behavior with vendored CPython methods
        run: |
          python3 benchmarks/cpython_stdlib/native_csv.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/shutil/check_csv_handlers.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/csv/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/test-csv.json"
          cmp benchmarks/cpython_stdlib/full/csv/native-linux.json "$RUNNER_TEMP/test-csv.json"
      - name: Compare native suites with CPython
        run: |
          python3 tests/run_suites.py --workers 4 --log-dir /tmp/imre-suites-ordinary --suites differential imports classes text containers tuple_keys comprehensions fstrings calls inference iterables iterator_pipelines callables json_records toml_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files paths processes argparse_cli \
            -- --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18
      - name: Run original string core methods in native Imre
        run: python3 benchmarks/cpython_stdlib/full/string/native_core.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Validate guarded list lengths on bounded heaps
        run: |
          python3 tests/validate_list_length.py --compiler target/release/imre \
            --runtime target/release/libimre_runtime.a --clang clang-18
      - name: Validate the independent Rust Base45 reference
        run: |
          python3 benchmarks/reference/base45_codec/build.py --artifact-dir /tmp/imre-base45-reference --target-dir target/base45-reference
          python3 benchmarks/base45_validate.py --rust /tmp/imre-base45-reference/base45-reference --output /tmp/imre-base45-reference/validation.json
      - name: Validate the independent Rust Luhn reference
        run: |
          python3 benchmarks/reference/luhn_checksum/build.py --artifact-dir /tmp/imre-luhn-reference --target-dir target/luhn-reference
          python3 benchmarks/luhn_validate.py --rust /tmp/imre-luhn-reference/luhn-reference --output /tmp/imre-luhn-reference/validation.json
      - name: Build the runtime with AddressSanitizer
        env:
          RUSTC_BOOTSTRAP: '1'
          RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo build -p imre-runtime --features corosensei/sanitizer --release --locked --target "$imre_target" --target-dir target/asan
      - name: Check generated code and runtime with AddressSanitizer
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          python3 tests/extension_wheel.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize
          python3 tests/wheel_record.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 0
          python3 tests/run_suites.py --workers 4 --log-dir /tmp/imre-suites-asan-o1 --suites differential imports classes containers tuple_keys comprehensions fstrings calls inference iterables iterator_pipelines callables json_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files paths processes argparse_cli \
            -- --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 1
          python3 tests/run_suites.py --workers 4 --log-dir /tmp/imre-suites-asan-o0 --suites containers tuple_keys fstrings calls inference iterables iterator_pipelines callables json_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations unions module_values base45 luhn exceptions files paths processes argparse_cli \
            -- --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 0
      - name: Validate the route planner against an independent oracle
        run: |
          target/release/imre build examples/route_planner.py
          python3 benchmarks/validate.py --binary ./route_planner
      - name: Validate the dependency planner against an independent oracle
        run: |
          target/release/imre build examples/dependency_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/dependency-planner
          python3 benchmarks/dependency_validate.py --binary /tmp/dependency-planner
      - name: Validate the Rust planner references and integer boundaries
        run: |
          python3 benchmarks/reference/dependency_planner/build.py --artifact-dir /tmp/imre-rust-reference --target-dir target/rust-reference
          python3 benchmarks/reference/dependency_planner/check_boundaries.py --python python3 --imre /tmp/dependency-planner --rust-bigint /tmp/imre-rust-reference/planner-bigint --rust-i64 /tmp/imre-rust-reference/planner-i64 --output /tmp/imre-rust-reference/validation.json
      - name: Validate the incremental planner and numeric reference boundaries
        run: |
          target/release/imre build examples/incremental_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/incremental-planner
          python3 benchmarks/reference/incremental_planner/build.py --artifact-dir /tmp/imre-incremental-reference --target-dir target/incremental-reference
          # Checked i64 compares only in-range cases and must reject every excluded overflow case.
          python3 benchmarks/incremental_validate.py --python python3 --binary /tmp/incremental-planner --rust-bigint /tmp/imre-incremental-reference/planner-bigint --rust-i64 /tmp/imre-incremental-reference/planner-i64 --output /tmp/imre-incremental-reference/validation.json
      - name: Validate framed batches and recovery against CPython and Rust
        run: |
          target/release/imre build examples/batch_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/batch-planner
          python3 benchmarks/reference/incremental_planner/build.py --batch --artifact-dir /tmp/imre-batch-reference --target-dir target/incremental-reference
          python3 benchmarks/batch_validate.py --python python3 --binary /tmp/batch-planner --rust-bigint /tmp/imre-batch-reference/planner-batch-bigint --output /tmp/imre-batch-reference/validation.json
      - name: Validate file manifests and complete reports against CPython and Rust
        run: |
          target/release/imre build examples/manifest_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/manifest-planner
          python3 benchmarks/reference/incremental_planner/build.py --manifest --artifact-dir /tmp/imre-manifest-reference --target-dir target/incremental-reference
          python3 benchmarks/manifest_validate.py --python python3 --binary /tmp/manifest-planner --rust-bigint /tmp/imre-manifest-reference/planner-manifest-bigint --output /tmp/imre-manifest-reference/validation.json
      - name: Validate inventory reconciliation against CPython and Rust
        run: |
          target/release/imre build examples/inventory_reconciliation/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/inventory-reconciliation
          python3 benchmarks/reference/inventory_reconciliation/build.py --artifact-dir /tmp/imre-inventory-reference --target-dir target/inventory-reference
          python3 benchmarks/inventory_validate.py --python python3 --binary /tmp/inventory-reconciliation --rust-bigint /tmp/imre-inventory-reference/inventory-bigint --output /tmp/imre-inventory-reference/validation.json
      - name: Validate telemetry queries against CPython and Rust
        run: |
          target/release/imre build examples/telemetry_comparison/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/telemetry-comparison
          python3 benchmarks/reference/telemetry_comparison/build.py --artifact-dir /tmp/imre-telemetry-reference --target-dir target/telemetry-reference
          python3 benchmarks/telemetry_validate.py --python python3 --binary /tmp/telemetry-comparison --rust /tmp/imre-telemetry-reference/telemetry-reference --output /tmp/imre-telemetry-reference/validation.json
      - name: Validate callable record pipelines against CPython and Rust
        run: |
          target/release/imre build examples/record_pipeline/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/record-pipeline
          python3 benchmarks/reference/record_pipeline/build.py --artifact-dir /tmp/imre-record-reference
          python3 benchmarks/record_validate.py --python python3 --binary /tmp/record-pipeline --rust /tmp/imre-record-reference/record-reference
      - name: Validate memory report comparison against CPython and Rust
        run: |
          target/release/imre build examples/memory_report/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/memory-report
          target/release/imre build examples/memory_report/compute.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/memory-report-compute
          python3 benchmarks/reference/memory_report/build.py --artifact-dir /tmp/imre-memory-reference
          python3 benchmarks/memory_validate.py --python python3 --binary /tmp/memory-report --compute-binary /tmp/memory-report-compute --rust /tmp/imre-memory-reference/memory-report-reference

  thinlto:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - run: cargo build -p imre-compiler --release --locked
      - name: Build the bitcode runtime for ThinLTO
        env:
          RUSTFLAGS: -Clinker-plugin-lto
        run: cargo build -p imre-runtime --release --locked --target-dir target/lto
      - name: Check ThinLTO linking and native semantics
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          imre_lld_dir="$(rustc --print sysroot)/lib/rustlib/$imre_target/bin"
          python3 tests/lto.py --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --rust-lld "$imre_lld_dir/rust-lld" --python python3
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            suites=(module_values)
          else
            suites=(
              differential imports classes containers tuple_keys comprehensions fstrings calls
              inference iterables iterator_pipelines callables json_records dataclass_records
              expressions floats bytes matching assignments truthiness loop_else unpacking primitives
              string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files
              paths processes argparse_cli
            )
          fi
          python3 tests/run_suites.py --workers 4 --log-dir /tmp/imre-suites-thinlto --suites "${suites[@]}" \
            -- --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --lto-linker "$imre_lld_dir/gcc-ld/ld.lld" --opt-levels 3
