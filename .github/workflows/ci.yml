name: Subprocess shared mock integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: symbols
      CARGO_INCREMENTAL: '0'
      CPYTHON_PIN: 5607950ef232dad16d75c0cf53101d9649d89115
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 strace
      - name: Build one compiler and runtime containing the unchanged shared mock and merged wait implementation
        id: build
        run: |
          git rev-parse HEAD:crates > "$RUNNER_TEMP/product-crates"
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime
          tar -czf "$RUNNER_TEMP/subprocess-shared-mock-tools.tar.gz" -C target/debug imre libimre_runtime.a
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: subprocess-shared-mock-tools
          path: ${{ runner.temp }}/subprocess-shared-mock-tools.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Stage the exact upstream support tree and verify _testcapi
        run: |
          git init -q "$RUNNER_TEMP/cpython"
          git -C "$RUNNER_TEMP/cpython" fetch --depth=1 https://github.com/python/cpython.git "$CPYTHON_PIN"
          git -C "$RUNNER_TEMP/cpython" checkout -q --detach FETCH_HEAD
          mkdir "$RUNNER_TEMP/testlib" "$RUNNER_TEMP/receipts"
          ln -s "$RUNNER_TEMP/cpython/Lib/test" "$RUNNER_TEMP/testlib/test"
          if python -c 'import _testcapi; assert _testcapi.W_STOPCODE(3)==895'; then
            python -c 'import sys; print("SUBPROCESS_ORACLE="+sys.executable)' >> "$GITHUB_ENV"
          else
            mkdir "$RUNNER_TEMP/cpython-build"
            cd "$RUNNER_TEMP/cpython-build"
            "$RUNNER_TEMP/cpython/configure" --without-ensurepip
            make -j 2
            echo "SUBPROCESS_ORACLE=$RUNNER_TEMP/cpython-build/python" >> "$GITHUB_ENV"
          fi
          echo "PYTHONPATH=$RUNNER_TEMP/testlib" >> "$GITHUB_ENV"
      - name: Record unchanged suite startup and the native installed wait at O0 and O3
        run: |
          cp "$RUNNER_TEMP/product-crates" "$RUNNER_TEMP/receipts/product-crates"
          compiler="$PWD/target/debug/imre"
          runtime="$PWD/target/debug/libimre_runtime.a"
          sha256sum "$compiler" "$runtime" > "$RUNNER_TEMP/receipts/toolchain-sha256"
          root=benchmarks/cpython_stdlib/full
          rc=0
          "$SUBPROCESS_ORACLE" -B "$root/check_suite_startup.py" --compiler "$compiler" --cpython-git "$RUNNER_TEMP/cpython" test.test_subprocess > "$RUNNER_TEMP/receipts/startup.json" || rc=$?
          test "$rc" -le 1
          for level in 0 3; do
            "$SUBPROCESS_ORACLE" -B "$root/subprocess/signal_race_originals.py" --shared-mock --transfer-stopped-mock --imre "$compiler" --runtime "$runtime" --clang /usr/bin/clang-18 --opt-level "$level" --result "$RUNNER_TEMP/receipts/original-$level.json"
            "$SUBPROCESS_ORACLE" -B "$root/subprocess/stopped_status.py" --imre "$compiler" --runtime "$runtime" --clang /usr/bin/clang-18 --opt-level "$level" --result "$RUNNER_TEMP/receipts/kernel-$level.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.build.outcome == 'success'
        with:
          name: subprocess-shared-mock-receipts
          path: ${{ runner.temp }}/receipts
          if-no-files-found: warn
          retention-days: 14
