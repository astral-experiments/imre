name: Verify the final recursive deletion source
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare and identify the prospective merge source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          base=$(git rev-parse HEAD)
          git fetch --no-tags origin refs/heads/codex/shutil-rmtree-direntry-identity
          head=$(git rev-parse FETCH_HEAD)
          test "$head" = ac00835e20efc5d96243bcbf9760fb321ccb8c37
          tree=$(git merge-tree --write-tree "$base" "$head")
          src=$(git -c user.name='Imre CI' -c user.email='ci@localhost' commit-tree "$tree" -p "$base" -p "$head" -m 'Test the exact prospective rmtree merge')
          git switch --detach "$src"
          test "$(git write-tree)" = "$tree"
          jq -n --arg base "$base" --arg head "$head" --arg tree "$tree" '{base:$base,head:$head,tree:$tree}' | tee "$RUNNER_TEMP/evidence/source.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          command -v clang-18 || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Test iterator and packed value repair on this compiler
        run: |
          out="$RUNNER_TEMP/evidence"
          set -euo pipefail
          test "$(python -c 'import sys;print(sys.version.split()[0])')" = 3.14.5
          cargo test --locked -j 2 -p imre-compiler --lib effects::tests::local_and_final_analysis_agree_on_packed_list_allocations -- --exact > "$out/effects-test.log"
          grep -F '1 passed; 0 failed;' "$out/effects-test.log"
          work=$(mktemp -d "$RUNNER_TEMP/effects-XXXXXX")
          : > "$out/effects-fixtures.tsv"
          for fixture in tests/fixtures/iterator_pipelines/source_generator.py tests/fixtures/dataclasses/value_struct.py; do
            name=$(basename "$fixture" .py)
            PYTHONPATH="$PWD/stdlib" python -B "$fixture" > "$work/$name.ref" 2> "$work/$name.referr"
            for mode in ordinary reachable; do
              flags=()
              if [[ "$mode" == reachable ]]; then flags+=(--reachable-only); fi
              for level in 0 3; do
                target/debug/imre build "$fixture" -o "$work/probe" --no-cache --opt-level "$level" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${flags[@]}"
                "$work/probe" > "$work/$name.native" 2> "$work/$name.stderr"
                cmp "$work/$name.ref" "$work/$name.native"
                cmp "$work/$name.referr" "$work/$name.stderr"
                printf '%s\t-O%s\t%s\t%s\t%s\n' "$name" "$level" "$mode" "$(wc -l < "$work/$name.native")" "$(sha256sum "$work/$name.native" | cut -d' ' -f1)" >> "$out/effects-fixtures.tsv"
              done
            done
          done
          test "$(wc -l < "$out/effects-fixtures.tsv")" -eq 8
      - name: Discover and run the untouched reference
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          out="$RUNNER_TEMP/evidence"
          dir=benchmarks/cpython_stdlib/full/shutil
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          mkdir "$RUNNER_TEMP/oracle"
          ln -s "$PWD/benchmarks/cpython_stdlib/upstream" "$RUNNER_TEMP/oracle/upstream"
          cp "$dir/UPSTREAM.json" "$RUNNER_TEMP/oracle/UPSTREAM.json"
          python -B benchmarks/cpython_stdlib/suite_inventory.py "$RUNNER_TEMP/oracle/UPSTREAM.json" --result "$out/reference-linux.json" || test $? = 1
          jq -e '.denominator==223 and (.reference|length==223)' "$out/reference-linux.json"
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$out/binaries.sha256"
      - name: Exchange a real subdirectory and verify both runtimes at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          timeout 120 python -B benchmarks/cpython_stdlib/full/shutil/rmtree_identity_controls.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/evidence/directory-identity-linux.json"
      - name: Exercise runtime tests, original deletion routines, and crossed error controls
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          d=benchmarks/cpython_stdlib/full/shutil
          out="$RUNNER_TEMP/evidence"
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          cargo test --locked -j 2 -p imre-runtime | tee "$out/runtime-tests.log"
          python -B "$d/native_rmtree.py" "${args[@]}" --result "$out/rmtree-linux.json"
          for label in copy_error_controls check_csv_handlers; do python -B "$d/$label.py" "${args[@]}" | tee "$out/$label.log"; done
      - name: Pair all original occurrences with the actual hosted reference
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          out="$RUNNER_TEMP/evidence"
          cp -al benchmarks/cpython_stdlib "$RUNNER_TEMP/stdlib-runner"
          d="$RUNNER_TEMP/stdlib-runner/full/shutil"
          cp --remove-destination "$out/reference-linux.json" "$d/reference-linux.json"
          test "$(git hash-object "$RUNNER_TEMP/stdlib-runner/upstream/Lib/test/test_shutil.py")" = fb1a7d876a617e17bcecbb8d8b654a2a87dafe48
          args=(--imre "$PWD/target/debug/imre" --runtime "$PWD/target/debug/libimre_runtime.a" --clang /usr/bin/clang-18)
          python -B "$d/attempt_methods.py" "${args[@]}" --compiler-tree "$(git rev-parse HEAD^{tree})" --result "$out/method-attempts-linux.json"
          python -B "$d/evidence.py" "${args[@]}" --method-attempts "$out/method-attempts-linux.json" --result "$out/evidence-linux.json"
      - name: Check the newest prospective source immediately before handing it back
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          d=benchmarks/cpython_stdlib/full/shutil
          out="$RUNNER_TEMP/evidence/latest"
          mkdir -p "$out"
          for cycle in 1 2 3; do
            git fetch --no-tags origin '+refs/heads/main:refs/imre/verify/main' '+refs/pull/1165/head:refs/imre/verify/rmtree'
            base=$(git rev-parse refs/imre/verify/main)
            head=$(git rev-parse refs/imre/verify/rmtree)
            test "$head" = ac00835e20efc5d96243bcbf9760fb321ccb8c37
            tree=$(git merge-tree --write-tree "$base" "$head")
            commit=$(git -c user.name='Imre CI' -c user.email='ci@localhost' commit-tree "$tree" -p "$base" -p "$head" -m 'Test current recursive deletion source')
            git switch --detach "$commit"
            test "$(git write-tree)" = "$tree"
            jq -n --arg base "$base" --arg head "$head" --arg tree "$tree" '{base:$base,head:$head,tree:$tree}' | tee "$out/source.json"
            cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
            cargo test --locked -j 2 -p imre-runtime > "$out/runtime-tests.log"
            sha256sum target/debug/imre target/debug/libimre_runtime.a > "$out/binaries.sha256"
            args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
            python -B "$d/rmtree_identity_controls.py" "${args[@]}" --result "$out/directory-identity-linux.json"
            python -B "$d/native_rmtree.py" "${args[@]}" --result "$out/rmtree-linux.json"
            for probe in check_csv_handlers copy_error_controls; do
              python -B "$d/$probe.py" "${args[@]}" | tee "$out/$probe.log"
            done
            set -euo pipefail
            test "$(python -c 'import sys;print(sys.version.split()[0])')" = 3.14.5
            cargo test --locked -j 2 -p imre-compiler --lib effects::tests::local_and_final_analysis_agree_on_packed_list_allocations -- --exact > "$out/effects-test.log"
            grep -F '1 passed; 0 failed;' "$out/effects-test.log"
            work=$(mktemp -d "$RUNNER_TEMP/effects-XXXXXX")
            : > "$out/effects-fixtures.tsv"
            for fixture in tests/fixtures/iterator_pipelines/source_generator.py tests/fixtures/dataclasses/value_struct.py; do
              name=$(basename "$fixture" .py)
              PYTHONPATH="$PWD/stdlib" python -B "$fixture" > "$work/$name.ref" 2> "$work/$name.referr"
              for mode in ordinary reachable; do
                flags=()
                if [[ "$mode" == reachable ]]; then flags+=(--reachable-only); fi
                for level in 0 3; do
                  target/debug/imre build "$fixture" -o "$work/probe" --no-cache --opt-level "$level" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${flags[@]}"
                  "$work/probe" > "$work/$name.native" 2> "$work/$name.stderr"
                  cmp "$work/$name.ref" "$work/$name.native"
                  cmp "$work/$name.referr" "$work/$name.stderr"
                  printf '%s\t-O%s\t%s\t%s\t%s\n' "$name" "$level" "$mode" "$(wc -l < "$work/$name.native")" "$(sha256sum "$work/$name.native" | cut -d' ' -f1)" >> "$out/effects-fixtures.tsv"
                done
              done
            done
            test "$(wc -l < "$out/effects-fixtures.tsv")" -eq 8
            live=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$live" == "$base" ]]; then exit 0; fi
          done
          echo "Main moved while testing; the source and its controls are retained." >&2
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-rmtree-repaired
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
