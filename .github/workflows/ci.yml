name: Subprocess finalizer integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: cp benchmarks/cpython_stdlib/full/subprocess/ci-finalizer-*.py "$RUNNER_TEMP/"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 strace
      - name: Build the actual merge tree and check seven child processes at O0 and O3
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '1'
        run: python "$RUNNER_TEMP/ci-finalizer-live.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: subprocess-finalizer-integration
          path: ${{ runner.temp }}/subprocess-finalizer-verified.json
          if-no-files-found: error
          retention-days: 14
