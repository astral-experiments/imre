name: Check the merged random dependency and all original shutil occurrences
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f32d79711e52677738f07b0f4cbef6db812759ff
          fetch-depth: 0
      - name: Identify the merged source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = f32d79711e52677738f07b0f4cbef6db812759ff
          test "$(git rev-parse HEAD^)" = 200abdcdfdb971f42b546d9ff365a243bd639a69
          test "$(git rev-parse HEAD^{tree})" = 869be37b18d149ad9916397a357705b9f13b8178
          jq -n --arg commit f32d79711e52677738f07b0f4cbef6db812759ff --arg head 7e81e1525fa3996a7098e0b5855c061d03750ba2 --arg tree 869be37b18d149ad9916397a357705b9f13b8178 '{commit:$commit,head:$head,tree:$tree}' | tee "$RUNNER_TEMP/evidence/source.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          command -v clang-18 || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Four unchanged test_shutil entry modes
        run: |
          python -B benchmarks/cpython_stdlib/full/check_suite_startup.py --compiler target/debug/imre --cpython-git .cpython test.test_shutil > "$RUNNER_TEMP/evidence/startup-linux.json" || test $? = 1
          jq -e '.tests_executed==0 and (.checks|length==4) and all(.checks[]; (.diagnostic | contains("test_shutil.py:14:") | not))' "$RUNNER_TEMP/evidence/startup-linux.json"
      - name: Compare native draws and filesystem fixture at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          python -B benchmarks/cpython_stdlib/full/shutil/random_consumer.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/evidence/random-consumer-linux.json"
      - name: Check crossed CSV/shutil handlers and real failed symlink copies
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          for control in check_csv_handlers copy_error_controls; do
            python -B "benchmarks/cpython_stdlib/full/shutil/$control.py" "${args[@]}" | tee "$RUNNER_TEMP/evidence/$control.log"
          done
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$RUNNER_TEMP/evidence/binaries.sha256"
      - name: Run original text and bytes missing-PATH fixtures on this source
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          python -B - target/debug/imre target/debug/libimre_runtime.a /usr/bin/clang-18 "$RUNNER_TEMP/evidence/missing-path.json" <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from tempfile import TemporaryDirectory
          import hashlib, json, sys
          from test import test_shutil
          assert sys.version_info[:3] == (3,14,5)
          assert hashlib.sha1(b'blob '+str(len(data:=Path(test_shutil.__file__).read_bytes())).encode()+b'\x00'+data).hexdigest() == 'fb1a7d876a617e17bcecbb8d8b654a2a87dafe48'
          bench=Path('benchmarks/cpython_stdlib').resolve()
          sys.path[:0] = [str(bench/'full/shutil'),str(bench)]
          import which_defaults
          args=SimpleNamespace(**dict(zip(('imre','runtime','clang'),map(Path,sys.argv[1:4]),strict=True)))
          with TemporaryDirectory() as tmp:
           rows=which_defaults.paired(args,test_shutil,Path(tmp))
          for level,values in rows.items():
           assert set(values)=={'test.test_shutil.TestWhich.test_environ_path_missing','test.test_shutil.TestWhichBytes.test_environ_path_missing'}
           for value in values.values():
            assert value['native_calls']==2 and value['native_environment']=={'PATH':'absent','processes':2}
          Path(sys.argv[4]).write_text(json.dumps(rows,indent=2)+'\n')
          print([(level,len(values)) for level,values in rows.items()])
          PY
      - name: Run the unchanged unittest.mock fixture and verify chdir restoration
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          python -IB benchmarks/cpython_stdlib/full/shutil/mock_startup.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --compiler-tree "$(git rev-parse HEAD^{tree})" --cpython-source .cpython --result "$RUNNER_TEMP/evidence/mock-startup.json"
          jq -e '.denominator==223 and .oracle.suite.tests_run==223 and (.oracle.suite.failures|length)==0 and (.oracle.suite.errors|length)==0 and (.oracle["patch-restore"]|contains("real chdir restored after exceptional exit"))' "$RUNNER_TEMP/evidence/mock-startup.json"
      - name: Attempt every original shutil occurrence with its original fixture at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          dir=benchmarks/cpython_stdlib
          out="$RUNNER_TEMP/evidence"
          python -B "$dir/suite_inventory.py" "$dir/full/shutil/UPSTREAM.json" --result "$out/reference-linux.json"
          python -B "$dir/full/shutil/attempt_methods.py" --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --compiler-tree "$(git rev-parse HEAD^{tree})" --reference "$out/reference-linux.json" --result "$out/method-attempts-linux.json"
      - name: Validate native and assisted classifications for all 223 IDs at both levels
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence"
          dir=benchmarks/cpython_stdlib
          python -B - "$out" <<'PY'
          import json, sys, tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from contextlib import chdir
          out=Path(sys.argv[1]).resolve(); d=Path('benchmarks/cpython_stdlib/full/shutil').resolve(); sys.path.insert(0,str(d))
          import evidence as e
          source=Path('.cpython/Lib').resolve(); sys.path.insert(0,str(source))
          man=json.loads((d/'UPSTREAM.json').read_text()); ref=json.loads((out/'reference-linux.json').read_text())
          assert man['commit']==ref['cpython_commit'] and len(ref['reference'])==223
          e.verify_files(e.STDLIB/'upstream',man['files']);e.verify_interpreter_tests(man)
          import test
          test.__path__.insert(0,str(e.SOURCE.parent))
          from test import test_shutil
          assert Path(test_shutil.__file__).resolve()==e.SOURCE
          args=SimpleNamespace(imre=Path('target/debug/imre').resolve(),runtime=Path('target/debug/libimre_runtime.a').resolve(),clang=Path('/usr/bin/clang-18'),method_attempts=out/'method-attempts-linux.json')
          reports=[]
          for level in (0,3):
           with tempfile.TemporaryDirectory() as tmp,chdir(tmp):reports.append(e.run_level(args,test_shutil,ref,level,Path(tmp)))
          e.write_reports(out/'evidence-linux.json',reports,ref)
          for report in reports:print(report['opt_level'],report['counts'])
          sys.exit(int(any(r['counts'].get(k,0) for r in reports for k in ('failed','unexpected-skip'))))
          PY
          python -B "$dir/suite_evidence.py" "$out/reference-linux.json" "$out/evidence-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-merged-985
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
