name: Logging verification
on:
  workflow_dispatch:
    inputs:
      source:
        description: Immutable prospective commit from this repository
        required: true
        type: string
      audit:
        description: Source of the requested per-occurrence results
        type: choice
        options: [logging, removal, properties, text-stream, file-handler, list-clear, null-handler, handler-locks, startup]
        required: true
permissions:
  contents: read
concurrency:
  group: logging-audit-${{ inputs.audit }}-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: ${{ inputs.source }}
      AUDIT: ${{ inputs.audit }}
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Record exact source and tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git show -s --format='%H %T %P'
          mkdir -p "$RUNNER_TEMP/logging-results"
          git show -s --format='%H %T %P' > "$RUNNER_TEMP/logging-results/source.txt"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: |
            Lib/test
            Lib/logging
            Modules
          persist-credentials: false
      - name: Install clang if absent
        run: |
          if ! test -x /usr/bin/clang-18; then
            sudo apt-get update && sudo apt-get install -y clang-18
          fi
      - name: Build this source with IR verification
        run: cargo build --locked -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir -j 2
      - name: Execute unchanged routines and their differential checks
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/logging-results"
          imre="$PWD/target/debug/imre"
          runtime="$PWD/target/debug/libimre_runtime.a"
          ordinary=(--compiler "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 --opt-levels 0 3)
          tools=(--imre "$imre" --runtime "$runtime" --clang /usr/bin/clang-18)
          ref="$PWD/.cpython-stdlib-reference"
          case "$AUDIT" in
            logging|file-handler)
              if [[ "$AUDIT" == file-handler ]]; then
                for opt in 0 3; do
                  PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/native_files.py "${tools[@]}" --opt-level "$opt" --result "$results/files-O$opt.json"
                done
              fi
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/evidence.py "${tools[@]}" --result "$results/evidence-linux.json"
              python3 -B benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/logging/reference-linux.json "$results/evidence-linux.json"
              ;;
            startup)
              python3 -B - "$ref" "$imre" "$results" <<'PYTHON'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          ref, compiler, results = map(Path, sys.argv[1:])
          pin = "5607950ef232dad16d75c0cf53101d9649d89115"
          all_paths = subprocess.check_output(["git", "-C", ref, "ls-tree", "-r", "--name-only", pin, "--", "Lib/"], text=True).splitlines()
          support = [p.removeprefix("Lib/") for p in all_paths if p.endswith(".py") and not p.startswith("Lib/test/")]
          args = [sys.executable, "-B", "benchmarks/cpython_stdlib/full/check_suite_startup.py", "--compiler", compiler, "--cpython-git", ref]
          for name in support:
              args.extend(["--support-file", name])
          child = subprocess.run([*args, "test.test_logging"], stdout=subprocess.PIPE, check=False)
          report = json.loads(child.stdout)
          assert child.returncode == int(any(r["exit"] for r in report["checks"])) and len(report["checks"]) == 4
          assert report["tests_executed"] == 0 and report["support_files"] == support
          report["imre_revision"] = os.environ["EXPECTED_SOURCE"]
          report["imre_tree"] = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          report["primary_denominator"] = 272
          report["support_python_files"] = len(report.pop("support_files"))
          report["support_paths_sha256"] = hashlib.sha256(("\n".join(support)+"\n").encode()).hexdigest()
          report["staging"] = "Full pinned Lib/test plus every pinned Python source outside it under Lib/"
          (results / "startup-linux.json").write_text(json.dumps(report, indent=2) + "\n")
          child = subprocess.run([sys.executable, "-B", "benchmarks/cpython_stdlib/full/check_suite_startup.py", "--compiler", compiler, "--cpython-git", ref, "test.test_logging"], stdout=subprocess.PIPE, check=False)
          tests = json.loads(child.stdout)
          assert child.returncode == int(any(r["exit"] for r in tests["checks"])) and len(tests["checks"]) == 4
          assert tests["tests_executed"] == 0 and not tests["support_files"]
          tests.update(imre_revision=report["imre_revision"], imre_tree=report["imre_tree"], primary_denominator=272, staging="Full pinned Lib/test; Imre resolves standard-library module implementations")
          (results / "startup-tests-linux.json").write_text(json.dumps(tests, indent=2) + "\n")
          for row in report["checks"]:
              print(row["entry"], row["reachable_only"], row["exit"], row["diagnostic"])
          PYTHON
              ;;
            removal)
              for opt in 0 3; do
                python3 -B benchmarks/cpython_stdlib/full/os/native_descriptors.py "${tools[@]}" --cpython-source "$ref" --opt-level "$opt" --result "$results/os-descriptors-O$opt.json"
              done
              python3 -B tests/paths.py "${ordinary[@]}"
              python3 -B tests/processes.py "${ordinary[@]}"
              ;;
            null-handler|handler-locks)
              if [[ "$AUDIT" == handler-locks ]]; then
                cargo test --locked -p imre-runtime --lib -j 2 only_the_outermost_release_unblocks_another_thread
              fi
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/null_handler.py "${tools[@]}" --result "$results/null-handler.json"
              ;;
            list-clear)
              python3 -B tests/primitives.py "${ordinary[@]}"
              ;;
            text-stream)
              python3 -I -B tests/fixtures/files/string_io.py > "$results/stringio-reference.txt"
              for opt in 0 3; do
                "$imre" build tests/fixtures/files/string_io.py --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/stringio"
                "$RUNNER_TEMP/stringio" > "$results/stringio-O$opt.txt"
                diff -u "$results/stringio-reference.txt" "$results/stringio-O$opt.txt"
              done
              python3 -I -B tests/fixtures/callables/cache_parameters.py > "$results/cache-reference.txt"
              for opt in 0 3; do
                "$imre" build tests/fixtures/callables/cache_parameters.py --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/cache-parameters"
                "$RUNNER_TEMP/cache-parameters" > "$results/cache-O$opt.txt"
                diff -u "$results/cache-reference.txt" "$results/cache-O$opt.txt"
              done
              python3 -B tests/files.py "${ordinary[@]}"
              ;;
            properties)
              python3 -B tests/classes.py "${ordinary[@]}"
              python3 -B tests/dataclass_records.py "${ordinary[@]}"
              python3 -B benchmarks/cpython_stdlib/full/logging/adapter_properties.py "${tools[@]}" --cpython-source "$ref" --result "$results/adapter-properties.json"
              ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: logging-${{ inputs.audit }}-${{ inputs.source }}
          path: ${{ runner.temp }}/logging-results
