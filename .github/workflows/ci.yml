name: Shutil prospective merge evidence

on:
  workflow_dispatch:
    inputs:
      follow:
        description: Retest new merge sources until all public PR checks pass
        type: boolean
        default: false

env:
  SHUTIL_BRANCH: codex/shutil-move-native
  SHUTIL_PR: '902'

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  compare:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare the actual merge source
        run: |
          mkdir "$RUNNER_TEMP/shutil"
          base=$(git rev-parse HEAD)
          git fetch --no-tags origin "refs/heads/$SHUTIL_BRANCH"
          head=$(git rev-parse FETCH_HEAD)
          git -c user.name='Imre CI' -c user.email='ci@localhost' merge --no-ff --no-commit "$head"
          tree=$(git write-tree)
          jq -n --arg base "$base" --arg head "$head" --arg tree "$tree" '{base:$base,head:$head,tree:$tree}' | tee "$RUNNER_TEMP/shutil/source.json"
          git diff --exit-code
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build combined compiler and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          cargo build --release --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
          sha256sum target/release/{imre,libimre_runtime.a} | tee "$RUNNER_TEMP/shutil/binaries.sha256"

      - name: Verify prospective source 1
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/shutil-verify-fast.sh" > "$RUNNER_TEMP/shutil-verify-fast.sh"
          bash "$RUNNER_TEMP/shutil-verify-fast.sh" 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shutil-current-1
          path: ${{ runner.temp }}/current-1
          if-no-files-found: error
          retention-days: 7

      - name: Verify prospective source 2
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/shutil-verify-fast.sh" > "$RUNNER_TEMP/shutil-verify-fast.sh"
          bash "$RUNNER_TEMP/shutil-verify-fast.sh" 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shutil-current-2
          path: ${{ runner.temp }}/current-2
          if-no-files-found: error
          retention-days: 7

      - name: Verify prospective source 3
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/shutil-verify-fast.sh" > "$RUNNER_TEMP/shutil-verify-fast.sh"
          bash "$RUNNER_TEMP/shutil-verify-fast.sh" 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shutil-current-3
          path: ${{ runner.temp }}/current-3
          if-no-files-found: error
          retention-days: 7

      - name: Verify prospective source 4
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/shutil-verify-fast.sh" > "$RUNNER_TEMP/shutil-verify-fast.sh"
          bash "$RUNNER_TEMP/shutil-verify-fast.sh" 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shutil-current-4
          path: ${{ runner.temp }}/current-4
          if-no-files-found: error
          retention-days: 7

      - name: Verify prospective source 5
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/shutil-verify-fast.sh" > "$RUNNER_TEMP/shutil-verify-fast.sh"
          bash "$RUNNER_TEMP/shutil-verify-fast.sh" 5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shutil-current-5
          path: ${{ runner.temp }}/current-5
          if-no-files-found: error
          retention-days: 7

      - name: Verify prospective source 6
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/shutil-verify-fast.sh" > "$RUNNER_TEMP/shutil-verify-fast.sh"
          bash "$RUNNER_TEMP/shutil-verify-fast.sh" 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shutil-current-6
          path: ${{ runner.temp }}/current-6
          if-no-files-found: error
          retention-days: 7
