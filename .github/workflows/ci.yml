name: Shutil consumer of the native unittest mock
on: workflow_dispatch
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  verify:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .reference
      - name: Get the hosted compiler and runtime for the exact shared mock tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/tools"
          head=4ffa8406bae7e321093b5a4bb6550e2d4f34e502
          built=8b15136c335a70905ea0861c2483d717a2910f80
          tree=e0d012f12c138cd432f7a72e0dc20c42f21523d4
          for sha in "$head" "$built"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq .tree.sha)" = "$tree"
          done
          jq -n --arg head "$head" --arg built "$built" --arg tree "$tree" '{head:$head,hosted_commit:$built,tree:$tree,build_run:40180137616}' > "$RUNNER_TEMP/evidence/source.json"
          gh run download 40180137616 --repo "$GITHUB_REPOSITORY" --name build-github-archives-x86_64-unknown-linux-gnu --dir "$RUNNER_TEMP/release"
          python -IB - <<'PY'
          import os, shutil, tarfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          need = {"imre","libimre_runtime.a"}
          for file in (root/"release").rglob("*"):
              if not file.is_file() or ".tar." not in file.name:
                  continue
              try:
                  archive = tarfile.open(file)
              except tarfile.TarError:
                  continue
              with archive:
                  for member in archive:
                      name = Path(member.name).name
                      if name in need and member.isfile():
                          target = root/"tools"/name
                          with archive.extractfile(member) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src,dst)
                          target.chmod(0o755 if name=="imre" else 0o644)
                          need.remove(name)
          assert not need, (need, list((root/"release").rglob("*")))
          PY
      - name: Check original test bytes, real patch restoration, and complete suite entry points
        run: |
          if ! test -x /usr/bin/clang-18; then sudo apt-get -qq update; sudo apt-get -qq install clang-18; fi
          python -IB benchmarks/cpython_stdlib/full/shutil/mock_startup.py \
            --imre "$RUNNER_TEMP/tools/imre" --runtime "$RUNNER_TEMP/tools/libimre_runtime.a" \
            --clang /usr/bin/clang-18 --compiler-tree e0d012f12c138cd432f7a72e0dc20c42f21523d4 \
            --cpython-source .reference --result "$RUNNER_TEMP/evidence/mock-startup-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-mock-758
          path: ${{ runner.temp }}/evidence
          retention-days: 7
