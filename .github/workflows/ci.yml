name: Logging verification
on:
  workflow_dispatch:
    inputs:
      source:
        description: Immutable prospective commit from this repository
        required: true
        type: string
      audit:
        description: Source of the requested per-occurrence results
        type: choice
        options: [logging, removal, properties, text-stream, file-handler, list-clear, null-handler, handler-locks, startup, cache-trace, percent-scalar, record-attributes, adapter-events, adapter-tools, codec-writer, plain-file, standalone, hierarchy, drain]
        required: true
permissions:
  contents: read
concurrency:
  group: logging-audit-${{ inputs.audit }}-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: ${{ inputs.source }}
      AUDIT: ${{ inputs.audit }}
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Record exact source and tree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git show -s --format='%H %T %P'
          mkdir -p "$RUNNER_TEMP/logging-results"
          git show -s --format='%H %T %P' > "$RUNNER_TEMP/logging-results/source.txt"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: |
            Lib/test
            Lib/logging
            Lib/encodings
            Modules
          persist-credentials: false
      - name: Install clang if absent
        run: |
          if ! test -x /usr/bin/clang-18; then
            sudo apt-get update && sudo apt-get install -y clang-18
          fi
      - name: Build with default compiler features for prospective compiler checks
        if: inputs.audit == 'properties' || inputs.audit == 'handler-locks' || inputs.audit == 'drain' || inputs.audit == 'codec-writer'
        run: cargo build --locked -p imre-compiler -p imre-runtime -j 2
      - name: Build this source with IR verification
        run: cargo build --locked -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir -j 2
      - name: Execute unchanged routines and their differential checks
        shell: bash
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/logging-results"
          imre="$PWD/target/debug/imre"
          runtime="$PWD/target/debug/libimre_runtime.a"
          ordinary=(--compiler "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 --opt-levels 0 3)
          tools=(--imre "$imre" --runtime "$runtime" --clang /usr/bin/clang-18)
          ref="$PWD/.cpython-stdlib-reference"
          if [[ "$AUDIT" == properties || "$AUDIT" == handler-locks || "$AUDIT" == drain ]]; then
            for sample in tests/fixtures/iterator_pipelines/source_generator.py tests/fixtures/dataclasses/value_struct.py; do
              if [[ ! -f "$sample" ]]; then continue; fi
              PYTHONPATH="$PWD/stdlib" python3 -B "$sample" > "$results/overlap-reference"
              for mode in whole reachable; do
                flags=()
                if [[ "$mode" == reachable ]]; then flags=(--reachable-only); fi
                for opt in 0 3; do
                  "$imre" build "$sample" --no-cache --opt-level "$opt" "${flags[@]}" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/overlap"
                  "$RUNNER_TEMP/overlap" > "$results/overlap-actual"
                  cmp "$results/overlap-reference" "$results/overlap-actual"
                done
              done
            done
          fi
          case "$AUDIT" in
            logging|file-handler)
              if [[ "$AUDIT" == file-handler ]]; then
                for opt in 0 3; do
                  PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/native_files.py "${tools[@]}" --opt-level "$opt" --result "$results/files-O$opt.json"
                done
              fi
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/evidence.py "${tools[@]}" --result "$results/evidence-linux.json"
              python3 -B benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/logging/reference-linux.json "$results/evidence-linux.json"
              ;;
            cache-trace)
              python3 -B - "$imre" "$runtime" "$results" <<'PYTHON'
          import ast, json, shutil, subprocess, sys
          from pathlib import Path
          imre, runtime, out = map(Path, sys.argv[1:])
          source = Path('benchmarks/cpython_stdlib/full/logging/cache_values.py').read_text()
          lines = source.splitlines(keepends=True)
          nodes = ast.parse(source).body
          def probe(n):
              entry, binary = out.parent/'cache-prefix.py', out.parent/'cache-prefix'
              entry.write_text(''.join(lines[:nodes[n-1].end_lineno]))
              built = subprocess.run([imre, 'build', entry, '-o', binary, '--no-cache', '--opt-level', '0', '--clang', '/usr/bin/clang-18', '--runtime', runtime], capture_output=True, text=True, timeout=90)
              if built.returncode: raise RuntimeError(built.stderr)
              child = subprocess.run([binary], capture_output=True, text=True, timeout=20)
              print(n, nodes[n-1].lineno, child.returncode, child.stdout[-130:], child.stderr[-320:], flush=True)
              return child
          low, high = 0, len(nodes)
          failed = probe(high)
          if failed.returncode:
              while high-low>1:
                  middle=(low+high)//2
                  if probe(middle).returncode: high=middle
                  else: low=middle
              failed=probe(high)
              details={'node':high,'source':ast.get_source_segment(source,nodes[high-1]),'line':nodes[high-1].lineno,'returncode':failed.returncode,'stdout':failed.stdout,'stderr':failed.stderr}
              if shutil.which('gdb'):
                  bt=subprocess.run(['gdb','-q','--batch','-ex','run','-ex','bt','--args',out.parent/'cache-prefix'],capture_output=True,text=True,timeout=60)
                  details['backtrace']=bt.stdout[-12000:]+bt.stderr[-900:]
          else: details={'returncode':0,'stdout':failed.stdout,'stderr':failed.stderr}
          print(details,flush=True)
          (out/'cache-trace.json').write_text(json.dumps(details,indent=2)+chr(10))
          PYTHON
              ;;
            startup)
              python3 -B - "$ref" "$imre" "$results" <<'PYTHON'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          ref, compiler, results = map(Path, sys.argv[1:])
          pin = "5607950ef232dad16d75c0cf53101d9649d89115"
          all_paths = subprocess.check_output(["git", "-C", ref, "ls-tree", "-r", "--name-only", pin, "--", "Lib/"], text=True).splitlines()
          support = [p.removeprefix("Lib/") for p in all_paths if p.endswith(".py") and not p.startswith("Lib/test/")]
          args = [sys.executable, "-B", "benchmarks/cpython_stdlib/full/check_suite_startup.py", "--compiler", compiler, "--cpython-git", ref]
          for name in support:
              args.extend(["--support-file", name])
          child = subprocess.run([*args, "test.test_logging"], stdout=subprocess.PIPE, check=False)
          report = json.loads(child.stdout)
          assert child.returncode == int(any(r["exit"] for r in report["checks"])) and len(report["checks"]) == 4
          assert report["tests_executed"] == 0 and report["support_files"] == support
          report["imre_revision"] = os.environ["EXPECTED_SOURCE"]
          report["imre_tree"] = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          report["primary_denominator"] = 272
          report["support_python_files"] = len(report.pop("support_files"))
          report["support_paths_sha256"] = hashlib.sha256(("\n".join(support)+"\n").encode()).hexdigest()
          report["staging"] = "Full pinned Lib/test plus every pinned Python source outside it under Lib/"
          (results / "startup-linux.json").write_text(json.dumps(report, indent=2) + "\n")
          child = subprocess.run([sys.executable, "-B", "benchmarks/cpython_stdlib/full/check_suite_startup.py", "--compiler", compiler, "--cpython-git", ref, "test.test_logging"], stdout=subprocess.PIPE, check=False)
          tests = json.loads(child.stdout)
          assert child.returncode == int(any(r["exit"] for r in tests["checks"])) and len(tests["checks"]) == 4
          assert tests["tests_executed"] == 0 and not tests["support_files"]
          tests.update(imre_revision=report["imre_revision"], imre_tree=report["imre_tree"], primary_denominator=272, staging="Full pinned Lib/test; Imre resolves standard-library module implementations")
          (results / "startup-tests-linux.json").write_text(json.dumps(tests, indent=2) + "\n")
          for row in report["checks"]:
              print(row["entry"], row["reachable_only"], row["exit"], row["diagnostic"])
          PYTHON
              ;;
            removal)
              for opt in 0 3; do
                python3 -B benchmarks/cpython_stdlib/full/os/native_descriptors.py "${tools[@]}" --cpython-source "$ref" --opt-level "$opt" --result "$results/os-descriptors-O$opt.json"
              done
              python3 -B tests/paths.py "${ordinary[@]}"
              python3 -B tests/processes.py "${ordinary[@]}"
              ;;
            null-handler|handler-locks)
              if [[ "$AUDIT" == handler-locks ]]; then
                cargo test --locked -p imre-runtime --lib -j 2 only_the_outermost_release_unblocks_another_thread
              fi
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/null_handler.py "${tools[@]}" --result "$results/null-handler.json"
              ;;
            hierarchy)
              for opt in 0 3; do
                python3 -B benchmarks/cpython_stdlib/full/logging/native_hierarchy.py "${tools[@]}" --cpython-source "$ref" --opt-level "$opt" --result "$results/hierarchy-O$opt.json"
              done
              ;;
            standalone)
              fixture=benchmarks/cpython_stdlib/full/logging/standalone_values.py
              python3 -I -B "$fixture" > "$results/standalone-reference.stdout" 2> "$results/standalone-reference.stderr"
              for opt in 0 3; do
                "$imre" build "$fixture" --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/standalone-logger"
                "$RUNNER_TEMP/standalone-logger" > "$results/standalone-O$opt.stdout" 2> "$results/standalone-O$opt.stderr"
                cmp "$results/standalone-reference.stdout" "$results/standalone-O$opt.stdout"
                cmp "$results/standalone-reference.stderr" "$results/standalone-O$opt.stderr"
              done
              if [[ -f benchmarks/cpython_stdlib/full/logging/standalone_handlers.py ]]; then
                python3 -I -B benchmarks/cpython_stdlib/full/logging/native_standalone.py "${tools[@]}" --cpython-source "$ref" --result "$results/standalone-handlers-linux.json"
                cmp benchmarks/cpython_stdlib/full/logging/standalone-handlers-linux.json "$results/standalone-handlers-linux.json"
              fi
              ;;
            plain-file)
              python3 -I -B benchmarks/cpython_stdlib/full/logging/native_plain_encoding.py "${tools[@]}" --cpython-source "$ref" --result "$results/plain-file-encoding.json"
              cmp benchmarks/cpython_stdlib/full/logging/plain-file-encoding-linux.json "$results/plain-file-encoding.json"
              python3 -B tests/files.py "${ordinary[@]}"
              ;;
            codec-writer)
              cargo test --locked -p imre-runtime -j 2 strict_registry_errors_retain_text_and_copy_bytes
              sample=tests/fixtures/processes/shell_output.py
              python3 -I -B "$sample" > "$results/shell-reference"
              for opt in 0 3; do
                "$imre" build "$sample" --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/shell-output"
                "$RUNNER_TEMP/shell-output" > "$results/shell-O$opt"
                cmp "$results/shell-reference" "$results/shell-O$opt"
              done
              python3 -I -B benchmarks/cpython_stdlib/full/logging/codec_writer.py "${tools[@]}" --cpython-source "$ref" --result "$results/codec-writer.json"
              cmp benchmarks/cpython_stdlib/full/logging/codec-writer-linux.json "$results/codec-writer.json"
              python3 -I -B benchmarks/cpython_stdlib/full/sys/codec_device.py "${tools[@]}" --cpython-source "$ref" --result "$results/sys-codec-device.json"
              cmp benchmarks/cpython_stdlib/full/sys/codec-device-linux.json "$results/sys-codec-device.json"
              if [[ -f benchmarks/cpython_stdlib/full/logging/native_encoding.py ]]; then
                binding=benchmarks/cpython_stdlib/full/sys/stdout_binding.py
                python3 -I -B "$binding" "$results/binding-reference-file" > "$results/binding-reference-stdout"
                for opt in 0 3; do
                  "$imre" build "$binding" --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/binding"
                  "$RUNNER_TEMP/binding" "$results/binding-file-O$opt" > "$results/binding-stdout-O$opt"
                  cmp "$results/binding-reference-file" "$results/binding-file-O$opt"
                  cmp "$results/binding-reference-stdout" "$results/binding-stdout-O$opt"
                  mkdir "$RUNNER_TEMP/import-snapshots-O$opt"
                  PYTHONPATH="$PWD/benchmarks/cpython_stdlib:$PWD/benchmarks/cpython_stdlib/full/sys" python3 -B -c 'from pathlib import Path; from suite_native import Toolchain; from import_snapshots import check_import_snapshots; import sys; check_import_snapshots(Toolchain(Path(sys.argv[1]), Path(sys.argv[2]), Path("/usr/bin/clang-18"), int(sys.argv[3])), Path(sys.argv[4]))' "$imre" "$runtime" "$opt" "$RUNNER_TEMP/import-snapshots-O$opt"
                done
                PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/native_encoding.py "${tools[@]}" --cpython-source "$ref" --result "$results/unchanged-stream.json"
              fi
              python3 -B tests/files.py "${ordinary[@]}"
              ;;
            adapter-tools)
              tar -czf "$results/toolchain.tgz" -C "$PWD/target/debug" imre libimre_runtime.a
              (cd target/debug && sha256sum imre libimre_runtime.a) > "$results/toolchain.sha256"
              ;;
            record-attributes|adapter-events)
              fixture=tests/fixtures/files/logging_record_attributes.py
              if [[ "$AUDIT" == adapter-events ]]; then fixture=tests/fixtures/files/logging_adapter_events.py; fi
              python3 -I -B "$fixture" > "$results/attributes-reference.txt"
              for opt in 0 3; do
                "$imre" build "$fixture" --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/record-attributes"
                "$RUNNER_TEMP/record-attributes" > "$results/attributes-O$opt.txt"
                diff -u "$results/attributes-reference.txt" "$results/attributes-O$opt.txt"
              done
              if [[ "$AUDIT" == adapter-events && -f benchmarks/cpython_stdlib/full/logging/native_adapter_events.py ]]; then
                PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/native_adapter_events.py "${tools[@]}" --cpython-source "$ref" --result "$results/adapter-events.json"
              fi
              python3 -B tests/files.py "${ordinary[@]}"
              ;;
            list-clear)
              python3 -B tests/primitives.py "${ordinary[@]}"
              ;;
            text-stream)
              python3 -I -B tests/fixtures/files/string_io.py > "$results/stringio-reference.txt"
              for opt in 0 3; do
                "$imre" build tests/fixtures/files/string_io.py --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/stringio"
                "$RUNNER_TEMP/stringio" > "$results/stringio-O$opt.txt"
                diff -u "$results/stringio-reference.txt" "$results/stringio-O$opt.txt"
              done
              python3 -I -B tests/fixtures/callables/cache_parameters.py > "$results/cache-reference.txt"
              for opt in 0 3; do
                "$imre" build tests/fixtures/callables/cache_parameters.py --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/cache-parameters"
                "$RUNNER_TEMP/cache-parameters" > "$results/cache-O$opt.txt"
                diff -u "$results/cache-reference.txt" "$results/cache-O$opt.txt"
              done
              python3 -B tests/files.py "${ordinary[@]}"
              ;;
            percent-scalar)
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/percent_filename.py "${tools[@]}" --result "$results/quoted-filename.json"
              PYTHONPATH="$ref/Lib" python3 -B tests/text.py "${ordinary[@]}"
              PYTHONPATH="$ref/Lib" python3 -B tests/errno.py "${ordinary[@]}" --evidence "$results/errno-evidence.json"
              PYTHONPATH="$ref/Lib" python3 -B tests/unittest_main.py --compiler "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 --manifest benchmarks/cpython_stdlib/full/errno/UPSTREAM.json --upstream-source benchmarks/cpython_stdlib/full/errno/upstream/Lib/test/test_errno.py
              ;;
            drain)
              cargo test --locked -p imre-runtime --lib -j 2 only_the_outermost_release_unblocks_another_thread
              python3 -B tests/classes.py "${ordinary[@]}"
              python3 -B tests/dataclass_records.py "${ordinary[@]}"
              python3 -B benchmarks/cpython_stdlib/full/logging/adapter_properties.py "${tools[@]}" --cpython-source "$ref" --result "$results/adapter-properties.json"
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/null_handler.py "${tools[@]}" --result "$results/null-handler.json"
              fixture=tests/fixtures/logging/basic.py
              python3 -I -B "$fixture" > "$results/basic-reference.stdout" 2> "$results/basic-reference.stderr"
              for opt in 0 3; do
                "$imre" build "$fixture" --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/logging-basic"
                "$RUNNER_TEMP/logging-basic" > "$results/basic-O$opt.stdout" 2> "$results/basic-O$opt.stderr"
                cmp "$results/basic-reference.stdout" "$results/basic-O$opt.stdout"
                cmp "$results/basic-reference.stderr" "$results/basic-O$opt.stderr"
              done
              PYTHONPATH="$ref/Lib" python3 -B benchmarks/cpython_stdlib/full/logging/evidence.py "${tools[@]}" --result "$results/evidence-linux.json"
              python3 -B benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/logging/reference-linux.json "$results/evidence-linux.json"
              if [[ -f benchmarks/cpython_stdlib/full/logging/cache_values.py ]]; then
                sample=benchmarks/cpython_stdlib/full/logging/cache_values.py
                python3 -I -B "$sample" > "$results/cache-reference"
                for opt in 0 3; do
                  "$imre" build "$sample" --no-cache --opt-level "$opt" --runtime "$runtime" --clang /usr/bin/clang-18 -o "$RUNNER_TEMP/drain-cache"
                  "$RUNNER_TEMP/drain-cache" > "$results/cache-O$opt"
                  cmp "$results/cache-reference" "$results/cache-O$opt"
                done
                cp "$results/evidence-linux.json" benchmarks/cpython_stdlib/full/logging/evidence-linux.json
                python3 -B benchmarks/cpython_stdlib/full/support_table.py --imre "$imre"
                cp docs/stdlib.md "$results/stdlib.md"
              fi
              ;;
            properties)
              python3 -B tests/classes.py "${ordinary[@]}"
              python3 -B tests/dataclass_records.py "${ordinary[@]}"
              python3 -B benchmarks/cpython_stdlib/full/logging/adapter_properties.py "${tools[@]}" --cpython-source "$ref" --result "$results/adapter-properties.json"
              ;;
            *) exit 2 ;;
          esac
      - name: Print failed logging occurrences
        if: failure() && inputs.audit == 'logging'
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "logging-results" / "evidence-linux.json"
          if path.is_file():
              for level in json.loads(path.read_text()):
                  for row in level["records"]:
                      if row["classification"] == "failed":
                          print(level["opt_level"], row["id"], row.get("reason", row.get("evidence")))
          PYTHON
      - name: Preserve the full per-occurrence JSON in this run log
        if: (success() || failure()) && (inputs.audit == 'logging' || inputs.audit == 'drain')
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, hashlib, os, textwrap
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'logging-results/evidence-linux.json'
          if not path.is_file():
              print('No ledger was generated before the earlier failure.')
              raise SystemExit(0)
          data = path.read_bytes()
          print('LOGGING-JSON-SHA256:', hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(gzip.compress(data, mtime=0)).decode('ascii')
          for part in textwrap.wrap(encoded, 2000):
              print('LOGGING-JSON-GZIP:', part)
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: (success() || failure()) && inputs.audit != 'logging' && inputs.audit != 'adapter-tools'
        with:
          name: logging-${{ inputs.audit }}-${{ inputs.source }}
          path: ${{ runner.temp }}/logging-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() && inputs.audit == 'adapter-tools'
        with:
          name: logging-tools-${{ inputs.source }}
          path: ${{ runner.temp }}/logging-results
          retention-days: 1
          compression-level: 0
