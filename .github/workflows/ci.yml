name: Shutil ownership and capacity on the original fixtures
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source without the workflow overlay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git switch --detach HEAD^
          test "$(git rev-parse HEAD)" = 9aee426c14ba5785096ac3e3bfa46f91b89039fd
          test "$(git rev-parse HEAD^{tree})" = 9cf6eacf512db048216883fd023d05dd9b9b90ea
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          command -v clang-18 || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Run the four unchanged test_shutil startup modes on this source
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence/startup-linux.json"
          python -B benchmarks/cpython_stdlib/full/check_suite_startup.py --compiler target/debug/imre --cpython-git .cpython test.test_shutil > "$out" || test $? = 1
          jq -e '(.checks|length==4) and all(.checks[]; (.diagnostic | contains("test_shutil.py:14:") | not))' "$out"
      - name: Pair the untouched reference and seven original ownership, disk and terminal cases
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          out="$RUNNER_TEMP/evidence"
          dir=benchmarks/cpython_stdlib/full/shutil
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          mkdir "$RUNNER_TEMP/oracle"
          ln -s "$PWD/benchmarks/cpython_stdlib/upstream" "$RUNNER_TEMP/oracle/upstream"
          cp "$dir/UPSTREAM.json" "$RUNNER_TEMP/oracle/UPSTREAM.json"
          python -B benchmarks/cpython_stdlib/suite_inventory.py "$RUNNER_TEMP/oracle/UPSTREAM.json" --result "$out/reference-linux.json" || test $? = 1
          jq -e '.denominator==223 and (.reference|length==223)' "$out/reference-linux.json"
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$out/binaries.sha256"
          python -B "$dir/misc_ops.py" "${args[@]}" --result "$out/misc-linux.json"
      - name: Compare independent real descriptor, terminal and crossed-handler controls
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib:$PWD/benchmarks/cpython_stdlib/full/shutil:$PWD/benchmarks/cpython_stdlib"
          python -B - <<'PYTHON'
          import json,os,tempfile
          from pathlib import Path
          from suite_native import Toolchain
          from ownership_controls import compare as ownership
          from capacity_controls import compare as capacity
          result={}
          for n in (0,3):
              tools=Toolchain(Path('target/debug/imre').resolve(),Path('target/debug/libimre_runtime.a').resolve(),Path('/usr/bin/clang-18'),n)
              for label,check in [('ownership',ownership),('capacity',capacity)]:
                  with tempfile.TemporaryDirectory() as temp:
                      try:
                          row={'status':'pass','cases':check(tools,Path(temp))}
                      except Exception as exc:
                          row={'status':'failed','reason':str(exc)}
                  result[f'{label}-O{n}']=row
                  print(label,n,row,flush=True)
          (Path(os.environ['RUNNER_TEMP'])/'evidence/misc-controls.json').write_text(json.dumps(result,indent=2)+'\n')
          assert all(r.get('cases')==23 and r['status']=='pass' for r in result.values())
          PYTHON
      - name: Verify buffered seek and partial-write recovery with main's writer
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          cargo test --locked -j 2 -p imre-runtime an_unseekable_writer_keeps_pending_bytes_after_seek
          export PYTHONPATH="$PWD/.cpython/Lib:$PWD/benchmarks/cpython_stdlib/full/shutil:$PWD/benchmarks/cpython_stdlib"
          python -B - <<'PYTHON'
          import json,os,tempfile
          from pathlib import Path
          from suite_native import Toolchain
          from buffered_seek_controls import compare
          result={}
          for level in (0,3):
              tools=Toolchain(Path('target/debug/imre').resolve(),Path('target/debug/libimre_runtime.a').resolve(),Path('/usr/bin/clang-18'),level)
              with tempfile.TemporaryDirectory() as tmp:
                  try:
                      result[f'O{level}']={'status':'pass','cases':compare(tools,Path(tmp))}
                  except Exception as error:
                      result[f'O{level}']={'status':'failed','reason':str(error)}
          print(result,flush=True)
          (Path(os.environ['RUNNER_TEMP'])/'evidence/buffered-seek-controls.json').write_text(json.dumps(result,indent=2)+chr(10))
          assert all(r['status']=='pass' and len(r['cases'])==2 for r in result.values())
          PYTHON
      - name: Compare retained OS error arguments with pinned CPython
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib:$PWD/benchmarks/cpython_stdlib"
          python -B - <<'PYTHON'
          from pathlib import Path
          import json,os,subprocess,sys,tempfile
          from suite_native import Toolchain
          source=Path('benchmarks/cpython_stdlib/full/shutil/os_args_case.py').read_bytes()
          result={}
          for opt in (0,3):
              try:
                  with tempfile.TemporaryDirectory() as temp:
                      work=Path(temp)
                      tools=Toolchain(Path('target/debug/imre').resolve(),Path('target/debug/libimre_runtime.a').resolve(),Path('/usr/bin/clang-18'),opt)
                      exe=tools.build(source,work)
                      def run(argv):
                          p=subprocess.run([*argv, 'absent-fixture'],cwd=work,capture_output=True,text=True,check=True,timeout=30)
                          return [p.stdout,p.stderr]
                      expected=run([sys.executable,work/'case.py'])
                      actual=run([exe])
                      result[f'O{opt}']={'expected':expected,'actual':actual,'pass':actual==expected}
              except Exception as err:
                  result[f'O{opt}']={'pass':False,'reason':str(err)}
          print(result,flush=True)
          (Path(os.environ['RUNNER_TEMP'])/'evidence/os-args-control.json').write_text(json.dumps(result,indent=2)+chr(10))
          assert all(row['pass'] for row in result.values())
          PYTHON
      - name: Compare warning filters on real boolean file descriptors
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib:$PWD/benchmarks/cpython_stdlib/full/shutil:$PWD/benchmarks/cpython_stdlib"
          python -B - <<'PYTHON'
          from pathlib import Path
          import json,os,tempfile
          from suite_native import Toolchain
          from descriptor_warning_controls import compare
          result={}
          for level in (0,3):
              tools=Toolchain(Path('target/debug/imre').resolve(),Path('target/debug/libimre_runtime.a').resolve(),Path('/usr/bin/clang-18'),level)
              with tempfile.TemporaryDirectory() as tmp:
                  try:
                      rows=compare(tools,Path(tmp))
                      result[f'O{level}']={'status':'pass','cases':rows}
                  except Exception as error:
                      result[f'O{level}']={'status':'failed','reason':str(error)}
          (Path(os.environ['RUNNER_TEMP'])/'evidence/descriptor-warning-controls.json').write_text(json.dumps(result,indent=2)+chr(10))
          print({level:(len(r.get('cases',[])),r.get('reason')) for level,r in result.items()})
          assert all(r['status']=='pass' and len(r['cases'])==34 for r in result.values())
          PYTHON
      - name: Check exact errors across copy, CSV, archive, and syscall fallback
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -uo pipefail
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          d=benchmarks/cpython_stdlib/full/shutil
          bad=0
          for control in check_csv_handlers copy_error_controls fastcopy_controls archive_handler_controls; do
            extra=()
            if test "$control" = archive_handler_controls; then extra=(--with-fastcopy --with-warnings); fi
            python -B "$d/$control.py" "${args[@]}" "${extra[@]}" | tee "$RUNNER_TEMP/evidence/$control.log" || bad=1
          done
          exit "$bad"
      - name: Run all unchanged routines and preserve each original occurrence
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          d=benchmarks/cpython_stdlib/full/shutil
          out="$RUNNER_TEMP/evidence"
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python -B "$d/attempt_methods.py" "${args[@]}" --compiler-tree "$(git rev-parse HEAD^{tree})" --reference "$out/reference-linux.json" --result "$out/method-attempts-linux.json"
          python -B "$d/evidence.py" "${args[@]}" --reference "$out/reference-linux.json" --method-attempts "$out/method-attempts-linux.json" --result "$out/evidence-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-capacity-9aee426
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7


