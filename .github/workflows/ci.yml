name: Argparse 968 prospective runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_INCREMENTAL: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 45375ede540b8bd3912f95b1345a4fc586505673
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Test the actual prospective tree and record its provenance
        shell: bash
        run: |
          set -euo pipefail
          base_checkout="$PWD"
          pr=45375ede540b8bd3912f95b1345a4fc586505673
          cat > "$RUNNER_TEMP/argparse-driver" <<'SH'
          #!/bin/sh
          if test "$1" = build; then
            shift
            exec "$GITHUB_WORKSPACE/target/debug/imre" build --no-cache "$@"
          fi
          exec "$GITHUB_WORKSPACE/target/debug/imre" "$@"
          SH
          chmod +x "$RUNNER_TEMP/argparse-driver"
          cat > "$RUNNER_TEMP/argparse-cross.py" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          root = Path(os.environ["GITHUB_WORKSPACE"])
          driver = Path(os.environ["RUNNER_TEMP"], "argparse-driver")
          runtime = root / "target/debug/libimre_runtime.a"
          required = ("benchmarks/cpython_stdlib/full/types/namespaces.py",
                       "benchmarks/cpython_stdlib/full/inspect/static_attributes.py",
                       "tests/fixtures/paths/walking.py", "tests/fixtures/processes/file_redirects.py",
                       "tests/fixtures/text/line_methods.py",
                       "tests/fixtures/module_values/wrapper_attributes/main.py",
                       "benchmarks/cpython_stdlib/full/logging/hierarchy_values.py",
                       "benchmarks/cpython_stdlib/full/logging/handler_values.py",
                       "tests/fixtures/classes/constant_strings.py",
                       "tests/fixtures/files/string_io.py",
                       "tests/fixtures/primitives/clear_record_buffer.py",
                       "tests/fixtures/containers/dict_fromkeys.py",
                       "tests/fixtures/classes/fixed_lineage.py", "tests/fixtures/text/ord.py",
                       "benchmarks/cpython_stdlib/full/sys/version_info.py",
                       "benchmarks/cpython_stdlib/full/sys/stream_buffer.py")
          required += ("benchmarks/cpython_stdlib/full/unittest/mock_reset.py",
                       "tests/fixtures/containers/dict_method_copy.py")
          required += ("benchmarks/cpython_stdlib/full/unittest/context_regex.py",)
          optional = ("tests/fixtures/classes/initializer_hook.py",)
          for name in (*required, *(path for path in optional if (root / path).is_file())):
              source = root / name
              local_imports = name.endswith(("/wrapper_attributes/main.py", "/classes/constant_strings.py", "/sys/version_info.py"))
              samples = (("1","1","LF","1"), ("2","1","LF","1"),
                         ("1","8191","1","LF"), ("2","4096","CR","2")) if name.endswith("/sys/stream_buffer.py") else ((),)
              with TemporaryDirectory() as tmp:
                  directory = Path(tmp)
                  ref_dir = directory / "cpython"
                  ref_dir.mkdir()
                  def observed(argv, cwd):
                      env = os.environ.copy()
                      if local_imports:
                          env["PYTHONPATH"] = str(source.parent)
                      p = subprocess.run(argv, cwd=cwd, env=env, capture_output=True, timeout=90)
                      return p.returncode, p.stdout, p.stderr
                  expected = [observed([sys.executable, "-B", source, *args], ref_dir) for args in samples]
                  assert all(result[0] == 0 for result in expected), (name, expected)
                  for level in ("0", "3"):
                      output = directory / ("native-" + level)
                      native_dir = directory / ("case-" + level)
                      native_dir.mkdir()
                      subprocess.run([driver, "build", source, "--runtime", runtime, "--clang", "/usr/bin/clang-18",
                                      *(["--module-root", source.parent] if local_imports else []),
                                      "--quiet", "--opt-level", level, "-o", output], check=True)
                      for args, reference in zip(samples, expected, strict=True):
                          actual = observed([output, *args], native_dir)
                          assert actual == reference, (name, args, level, reference, actual)
              print(name, "O0/O3 exit, stdout, stderr matched", flush=True)
          PY
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin refs/heads/main
            base=$(git rev-parse FETCH_HEAD)
            tree=$(git merge-tree --write-tree "$base" "$pr")
            candidate=$(git -c user.name='Argparse preflight' -c user.email='noreply@github.com' commit-tree "$tree" -p "$base" -p "$pr" -m 'Hosted validation of PR #968')
            git checkout --detach "$candidate"
            test "$(git rev-parse HEAD^{tree})" = "$tree"
            echo "Attempt $attempt: base=$base pr=$pr tree=$tree"
            cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
            cargo test --locked -j 2 -p imre-runtime --lib
            python3 tests/argparse_cli.py --compiler "$RUNNER_TEMP/argparse-driver" --runtime "$base_checkout/target/debug/libimre_runtime.a" --python "$(command -v python3)" --clang /usr/bin/clang-18 --opt-levels 0 3
            python3 tests/io.py --compiler "$base_checkout/target/debug/imre" --runtime "$base_checkout/target/debug/libimre_runtime.a" --python "$(command -v python3)" --clang /usr/bin/clang-18 --opt-levels 0 3
            python3 tests/unittest_main.py --compiler "$RUNNER_TEMP/argparse-driver" --runtime "$base_checkout/target/debug/libimre_runtime.a" --python "$(command -v python3)" --clang /usr/bin/clang-18 --opt-levels 0 3
            python3 tests/paths.py --fixture resolution --compiler "$RUNNER_TEMP/argparse-driver" --runtime "$base_checkout/target/debug/libimre_runtime.a" --python "$(command -v python3)" --clang /usr/bin/clang-18 --opt-levels 0 3
            for level in 0 3; do
              python3 benchmarks/cpython_stdlib/native_sys.py --imre "$RUNNER_TEMP/argparse-driver" --runtime "$base_checkout/target/debug/libimre_runtime.a" --python "$(command -v python3)" --clang /usr/bin/clang-18 --opt-level "$level"
            done
            python3 benchmarks/cpython_stdlib/full/logging/null_handler.py --imre "$RUNNER_TEMP/argparse-driver" --runtime "$base_checkout/target/debug/libimre_runtime.a" --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/argparse-null-handler.json"
            python3 "$RUNNER_TEMP/argparse-cross.py"
            echo "Passed: base=$base pr=$pr tree=$tree (-O0 and -O3 stdout, stderr and exit; runtime ownership)." >> "$GITHUB_STEP_SUMMARY"
            git fetch --no-tags origin refs/heads/main
            latest=$(git rev-parse FETCH_HEAD)
            inputs=(benchmarks/cpython_stdlib/full/unittest/context_regex.py benchmarks/cpython_stdlib/full/logging/null_handler.py benchmarks/cpython_stdlib/full/logging/UPSTREAM.json tests/paths.py tests/files.py tests/fixtures/paths tests/fixtures/sys/streams_exit.py benchmarks/cpython_stdlib/native_sys.py benchmarks/cpython_stdlib/upstream.py benchmarks/cpython_stdlib/UPSTREAM.json benchmarks/cpython_stdlib/upstream benchmarks/cpython_stdlib/full/sys/stream_errno.py benchmarks/cpython_stdlib/full/sys/exit_payloads.py benchmarks/cpython_stdlib/full/unittest/mock_reset.py tests/fixtures/containers/dict_method_copy.py tests/io.py tests/unittest_main.py tests/fixtures/unittest_main crates Cargo.toml Cargo.lock rust-toolchain.toml tests/argparse_cli.py tests/fixtures/argparse
                    tests/fixtures/paths/walking.py tests/fixtures/processes/file_redirects.py tests/fixtures/text/line_methods.py
                    benchmarks/cpython_stdlib/full/types/namespaces.py benchmarks/cpython_stdlib/full/inspect/static_attributes.py
                    tests/fixtures/module_values/wrapper_attributes benchmarks/cpython_stdlib/full/logging/hierarchy_values.py
                    benchmarks/cpython_stdlib/full/logging/handler_values.py
                    tests/fixtures/classes/constant_strings.py tests/fixtures/classes/_constant_strings.py tests/fixtures/files/string_io.py
                    tests/fixtures/primitives/clear_record_buffer.py tests/fixtures/containers/dict_fromkeys.py tests/fixtures/classes/initializer_hook.py
                    tests/fixtures/classes/fixed_lineage.py tests/fixtures/text/ord.py benchmarks/cpython_stdlib/full/sys/version_info.py
                    benchmarks/cpython_stdlib/full/sys/version_info_owner.py benchmarks/cpython_stdlib/full/sys/stream_buffer.py)
            if git diff --quiet "$base" "$latest" -- "${inputs[@]}"; then
              echo "Verified product source through main=$latest; tree=$tree (base=$base, pr=$pr)."
              exit 0
            fi
            echo "Main changed during the tests; rebuilding the next prospective tree."
          done
          echo "Main kept changing through all five attempts; inspect the tested trees before merging." >&2
          exit 1
