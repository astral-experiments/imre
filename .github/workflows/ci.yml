name: Pathlib prospective source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathlib:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      PATHLIB_PUBLIC_HEAD: 42f71e57205fc58b57a71c7625530f52099d01a0
      CARGO_INCREMENTAL: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib
          persist-credentials: false
      - name: Install the native linker
        run: |
          if ! test -x /usr/bin/clang-18; then
            sudo apt-get update
            sudo apt-get install -y clang-18
          fi
      - name: Prepare the four pinned package startup checks
        run: |
          cat > "$RUNNER_TEMP/pathlib-startup.py" <<'PROBE'
          import hashlib,json,pathlib,subprocess,sys
          imre,lib,out=sys.argv[1:]
          root=pathlib.Path(lib).resolve()
          inputs={'imre_pathlib_imports.py': "import test.test_pathlib as suite_0\nprint('IMRE_IMPORTS_OK')\n", 'imre_pathlib_run.py': "import test.test_pathlib as suite_0\nimport unittest\n\ntests = unittest.TestSuite([unittest.defaultTestLoader.loadTestsFromModule(suite_0)])\nresult = unittest.TextTestRunner(verbosity=2).run(tests)\nprint('IMRE_SUITE_RESULT', result.testsRun, len(result.failures), len(result.errors), len(result.skipped))\n"}
          for name,source in inputs.items():
              (root/name).write_text(source,encoding='utf-8')
          support=hashlib.sha256((root/'test/support/__init__.py').read_bytes()).hexdigest()
          assert support=='ab77f9f5d2a4cd07f21550980fc84a224553a8d7c7ffdda409ebd7f3ee1941c4'
          records=[]
          for file in inputs:
              for flags in ([],['--reachable-only']):
                  cp=subprocess.run([imre,'check',root/file,'--module-root',root,*flags],capture_output=True,text=True,timeout=120)
                  records.append({'entry':file,'mode':flags or ['whole'],'check_exit':cp.returncode,'diagnostic':cp.stderr.strip().replace(str(root),'Lib')})
                  assert cp.returncode in (0,1) and 'panicked at' not in cp.stderr,records[-1]
          pathlib.Path(out).write_text(json.dumps({'test_support_sha256':support,'checks':records},indent=2)+'\n')
          PROBE
      - name: Build and exercise the actual prospective source, refreshing main as needed
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pathlib-target"
          reports="$RUNNER_TEMP/pathlib-prospective"
          mkdir -p "$reports"
          while true; do
            git fetch --quiet --no-tags origin refs/heads/main
            base=$(git rev-parse FETCH_HEAD)
            git switch --quiet --detach "$base"
            git -c user.name=charliermarsh -c user.email=charlie.r.marsh@gmail.com merge --no-ff --no-commit "$PATHLIB_PUBLIC_HEAD"
            tree=$(git write-tree)
            expected=$(git merge-tree --write-tree "$base" "$PATHLIB_PUBLIC_HEAD")
            test "$tree" = "$expected"
            git diff --quiet
            out="$reports/$base"
            mkdir -p "$out"
            printf 'main %s\npr %s\ntree %s\n' "$base" "$PATHLIB_PUBLIC_HEAD" "$tree" | tee "$out/source.txt"
            cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
            cargo test --locked -j 2 -p imre-runtime --lib > "$out/runtime-tests.txt"
            imre="$CARGO_TARGET_DIR/debug/imre"
            runtime="$CARGO_TARGET_DIR/debug/libimre_runtime.a"
            sha256sum "$imre" "$runtime" >> "$out/source.txt"
            python3 -B -X warn_default_encoding benchmarks/cpython_stdlib/full/pathlib/evidence.py \
              --imre "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference \
              --cohort metadata --result "$out/metadata.json"
            python3 -B benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py "$out/metadata.json" | tee "$out/unchanged-methods.txt"
            python3 -B tests/paths.py --compiler "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 \
              --fixture links --fixture link_protocols --opt-levels 0 3 | tee "$out/path-checks.txt"
            python3 -B benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py --links "$out/metadata.json" | tee -a "$out/unchanged-methods.txt"
            probe="$RUNNER_TEMP/pathlib-startup.py"
            startup_root="$RUNNER_TEMP/pathlib-test-only"
            if ! test -d "$startup_root/test"; then mkdir -p "$startup_root"; cp -a .cpython-stdlib-reference/Lib/test "$startup_root/test"; fi
            python3 "$probe" "$imre" "$startup_root" "$out/startup-test-only.json"
            python3 "$probe" "$imre" .cpython-stdlib-reference/Lib "$out/startup-full-lib.json"
            latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            git merge --abort
            if test "$latest" = "$base"; then
              cp "$out/source.txt" "$reports/verified-source.txt"
              cat "$out/source.txt" "$out/unchanged-methods.txt" "$out/path-checks.txt" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "Main advanced to $latest; reusing this target for the new source."
          done
      - name: Retain the tested trees and both occurrence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pathlib-923-prospective
          path: ${{ runner.temp }}/pathlib-prospective
          if-no-files-found: warn
          retention-days: 7
