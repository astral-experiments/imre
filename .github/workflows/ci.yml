name: Check copy mode after a real link disappears
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact source without the workflow overlay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git switch --detach HEAD^
          test "$(git rev-parse HEAD)" = d9f2d4231ab60f7cf726b336546b5ea65b4c15ae
          test "$(git rev-parse HEAD^{tree})" = 6c3d1e71a659285d3ab5589c76dcb63f2ff50cff
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          (command -v clang-18 && command -v zstd) || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18 zstd)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Discover and run the untouched reference
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          out="$RUNNER_TEMP/evidence"
          dir=benchmarks/cpython_stdlib/full/shutil
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          mkdir "$RUNNER_TEMP/oracle"
          ln -s "$PWD/benchmarks/cpython_stdlib/upstream" "$RUNNER_TEMP/oracle/upstream"
          cp "$dir/UPSTREAM.json" "$RUNNER_TEMP/oracle/UPSTREAM.json"
          python -B benchmarks/cpython_stdlib/suite_inventory.py "$RUNNER_TEMP/oracle/UPSTREAM.json" --result "$out/reference-linux.json" || test $? = 1
          jq -e '.denominator==223 and (.reference|length==223)' "$out/reference-linux.json"
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$out/binaries.sha256"
      - name: Verify symlinks, original metadata methods, directory identity and copy errors
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.cpython/Lib"
          out="$RUNNER_TEMP/evidence"
          d=benchmarks/cpython_stdlib/full/shutil
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python -B "$d/copymode_symlink_controls.py" "${args[@]}" --result "$out/symlink-lookups.json"
          python -B "$d/native_copy.py" "${args[@]}" --result "$out/copy-linux.json"
          python -B "$d/copyfile.py" "${args[@]}" --result "$out/copyfile-linux.json"
          python -B "$d/copy_error_controls.py" "${args[@]}" | tee "$out/copy-errors.log"
          python -B "$d/rmtree_identity_controls.py" "${args[@]}" --result "$out/rmtree-identity.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-copymode
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
