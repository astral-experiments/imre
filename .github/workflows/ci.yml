          python3 benchmarks/cpython_stdlib/full/shutil/native_copy.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil-copy.json"
          python3 benchmarks/cpython_stdlib/full/shutil/native_rmtree.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil-rmtree.json"
          python3 benchmarks/cpython_stdlib/full/shutil/rmtree_identity_controls.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/cpython-shutil-directory-identity.json"
          python3 benchmarks/cpython_stdlib/full/shutil/tree_ops.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil-copytree.json"
          python3 benchmarks/cpython_stdlib/full/shutil/move_ops.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shutil-move.json"
          python3 benchmarks/cpython_stdlib/full/shutil/move_cross_device.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/native_json.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-json.json"
          python3 benchmarks/cpython_stdlib/native_json_values.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-json-values.json"
          python3 benchmarks/cpython_stdlib/full/shlex/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-shlex.json"
          diff -u benchmarks/cpython_stdlib/full/shlex/native-linux.json "$RUNNER_TEMP/cpython-shlex.json"
          python3 benchmarks/cpython_stdlib/native_os.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
          python3 benchmarks/cpython_stdlib/native_os_path.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-os-path.json"
          stat_dir=benchmarks/cpython_stdlib/full/stat
          python3 "$stat_dir/generate_module.py" --check
          python3 "$stat_dir/test_generate_module.py"
          python3 "$stat_dir/run_operations.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/cpython-stat.json"
          python3 "$stat_dir/check_modes.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/logging/native_timed.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/logging/native_config.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/cpython-logging-config-O$opt.json"
          done
          python3 benchmarks/cpython_stdlib/native_logging.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
          python3 benchmarks/cpython_stdlib/full/logging/native_levels.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference
      - name: Run CPython logging record and formatter methods at O0 and O3
        run: |
          python3 benchmarks/cpython_stdlib/full/logging/adapter_properties.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/logging-adapter-properties.json"
          python3 benchmarks/cpython_stdlib/full/logging/null_handler.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/logging-null-handler.json"
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/logging/native_records.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-records-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_hierarchy.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-children-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_formatters.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-formatters-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_files.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-files-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_rotation.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-rotation-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_filters.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-filters-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/native_handlers.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-handlers-O$opt.json"
            python3 benchmarks/cpython_stdlib/full/logging/descriptor_seek.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --opt-level "$opt" --result "$RUNNER_TEMP/logging-descriptor-seek-O$opt.json"
          done
      - name: Replay every pinned Linux logging occurrence
        id: logging_replay
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.logging_evidence && steps.logging_inputs.outcome == 'success' }}
        run: |
          python3 benchmarks/cpython_stdlib/full/logging/evidence.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/logging-evidence-linux.json"
          python3 benchmarks/cpython_stdlib/suite_evidence.py benchmarks/cpython_stdlib/full/logging/reference-linux.json "$RUNNER_TEMP/logging-evidence-linux.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && (steps.logging_replay.outcome == 'success' || steps.logging_replay.outcome == 'failure') }}
        with:
          name: cpython-logging-evidence-linux
          path: ${{ runner.temp }}/logging-evidence-linux.json
          if-no-files-found: warn
      - &install-wheel-tools
        name: Install the wheel test dependencies
        run: python3 -m pip install "wheel==0.45.1" "packaging==25.0" "build==1.3.0" "setuptools==81.0.0"
      - name: Build and install Imre extension wheels
        run: |
          python3 tests/extension_wheel.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18
          python3 tests/setuptools_wheel.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang clang-18
      - uses: ./.github/actions/test-google-crc32c
        with:
          cc: clang-18
          cxx: clang++-18
      - name: Run Python entry points and discover Imre with stock uv
        run: |
          python3 tests/python_cli.py --compiler target/release/imre
          python3 tests/uv_python_find.py --compiler target/release/imre
      - name: Check native build caching, linker options, and status
        run: |
          # Exercise the distro toolchain without setup-python's LD_LIBRARY_PATH.
          for suite in build_cache module_objects link_cache build_output; do
            env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin python3 "tests/$suite.py" --compiler target/release/imre
          done
      - name: Check native task context and original CPython contextvars cases
        run: |
          suite=benchmarks/cpython_stdlib/full/contextvars
          python3 "$suite/focused.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 "$suite/run.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/contextvars-native.json"
          cmp "$suite/native-linux.json" "$RUNNER_TEMP/contextvars-native.json"
      - name: Check original CPython textwrap cases against native indentation
        run: |
          suite=benchmarks/cpython_stdlib/full/textwrap
          python3 "$suite/run.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/textwrap-native.json"
          cmp "$suite/native-linux.json" "$RUNNER_TEMP/textwrap-native.json"
      - name: Run original textwrap exception assertions through native unittest
        run: |
          gate=benchmarks/cpython_stdlib/full/unittest/textwrap_exception.py
          args=(--textwrap-suite benchmarks/cpython_stdlib/full/textwrap --cpython-source .cpython-stdlib-reference --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18)
          python3 "$gate" "${args[@]}" --baseline "$RUNNER_TEMP/textwrap-native.json" --result "$RUNNER_TEMP/textwrap-unittest.json"
          python3 "$gate" "${args[@]}" --reachable-only --result "$RUNNER_TEMP/textwrap-unittest-reachable.json"
      - name: Run complete upstream copy methods in native Imre
        run: |
          python3 benchmarks/cpython_stdlib/full/copy/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/copy-native.json"
          cmp benchmarks/cpython_stdlib/full/copy/native-linux.json "$RUNNER_TEMP/copy-native.json"
          python3 benchmarks/cpython_stdlib/full/copy/allocation_failure.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Check native StringIO against CPython streams and original methods
        run: |
          python3 benchmarks/cpython_stdlib/full/doctest/stringio/native.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source "$RUNNER_TEMP/imre-cpython-fixtures" --result "$RUNNER_TEMP/stringio-native.json"
          cmp benchmarks/cpython_stdlib/full/doctest/stringio/observations-linux.json "$RUNNER_TEMP/stringio-native.json"
          python3 benchmarks/cpython_stdlib/full/doctest/stringio/consumer_startup.py --imre target/release/imre --cpython-git .cpython-stdlib-reference --result "$RUNNER_TEMP/stringio-startup.json"
      - name: Run complete itertools methods in native Imre
        run: |
          for opt in 0 3; do
            python3 benchmarks/cpython_stdlib/full/itertools/native.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --opt-level "$opt" --result "$RUNNER_TEMP/itertools-O$opt.json"
            for exercise in repeat sources tee; do
              src="benchmarks/cpython_stdlib/full/itertools/$exercise.py"
              target/release/imre build "$src" --opt-level "$opt" -o "$RUNNER_TEMP/iterator"
              "$RUNNER_TEMP/iterator" > "$RUNNER_TEMP/iterator.native"
              python3 "$src" > "$RUNNER_TEMP/iterator.reference"
              diff -u "$RUNNER_TEMP/iterator.reference" "$RUNNER_TEMP/iterator.native"
            done
          done
      - name: Compare runtime tuple spreads and check the unchanged itertools entry points
        run: |
          python3 benchmarks/cpython_stdlib/full/itertools/tuple_spread_audit.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-git .cpython-stdlib-reference --result "$RUNNER_TEMP/itertools-tuple-spreads.json"
          python3 benchmarks/cpython_stdlib/full/itertools/whole_files.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-git .cpython-stdlib-reference --result "$RUNNER_TEMP/itertools-whole-files.json"
      - name: Run vendored CPython Counter methods in native Imre
        run: python3 benchmarks/cpython_stdlib/native_counter.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/cpython-counter.json"
      - name: Compare native doctest suites with the pinned interpreter
        run: python3 benchmarks/cpython_stdlib/full/doctest/native.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/doctest-execution.json"
      - name: Compare uv's upstream wheel checker with CPython
        run: python3 tests/uv_wheel_check.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Compare PyPA's RECORD validator with CPython
        run: python3 tests/wheel_record.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Compare Ruff’s reporters with CPython
        run: |
          target/release/imre build examples/conformance_report/upstream/conformance.py -o "$RUNNER_TEMP/ruff-conformance"
          python3 tests/ruff_program.py --binary "$RUNNER_TEMP/ruff-conformance"
          target/release/imre build examples/memory_report/upstream/memory_report.py -o "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_compare.py --binary "$RUNNER_TEMP/ruff-memory"
          python3 tests/ruff_memory_run.py --binary "$RUNNER_TEMP/ruff-memory"
          target/release/imre build examples/conformance_report/__main__.py --module-root examples -o "$RUNNER_TEMP/conformance-report"
          python3 benchmarks/conformance_grouping_inputs.py \
            --archive benchmarks/results/2026-10-22-collector-ownership-study.tar.xz \
            --output "$RUNNER_TEMP/conformance-inputs" --check-reporter "$RUNNER_TEMP/conformance-report"
      - name: Compare Ruff’s ecosystem check and format commands with CPython
        run: |
          python3 -m pip install --no-deps tomli==2.5.0 tomli-w==1.2.0 unidiff==1.0.0
          target/release/imre check --entry-profile examples/ruff_ecosystem/markdown-entry.json examples/ruff_ecosystem/ruff_ecosystem/__main__.py
          python3 tests/patchset.py --compiler target/release/imre --runtime target/release/libimre_runtime.a
          python3 tests/ruff_ecosystem_live.py --compiler target/release/imre --runtime target/release/libimre_runtime.a
      - name: Compare fixed-offset datetime operations and original methods with CPython
        run: |
          suite=benchmarks/cpython_stdlib/full/datetime
          python3 "$suite/focused.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 "$suite/run.py" --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/test-datetime.json"
          cmp "$suite/native-linux.json" "$RUNNER_TEMP/test-datetime.json"
      - name: Compare original time methods and local civil time with CPython
        run: |
          suite=benchmarks/cpython_stdlib/full/time
          python3 tests/time_local.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 "$suite/run.py" --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/test-time.json"
          cmp "$suite/evidence-linux.json" "$RUNNER_TEMP/test-time.json"
      - name: Check CSV reader behavior with vendored CPython methods
        run: |
          python3 benchmarks/cpython_stdlib/native_csv.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/shutil/check_csv_handlers.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/csv/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/test-csv.json"
          cmp benchmarks/cpython_stdlib/full/csv/native-linux.json "$RUNNER_TEMP/test-csv.json"
      - name: Compare native warning filters with CPython
        run: |
          python3 benchmarks/cpython_stdlib/full/warnings/run.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference --result "$RUNNER_TEMP/test-warnings.json"
          cmp benchmarks/cpython_stdlib/full/warnings/native-linux.json "$RUNNER_TEMP/test-warnings.json"
      - name: Compare native suites with CPython
        run: |
          sdk=$(mktemp -d "$RUNNER_TEMP/imre-ordinary.XXXXXX")
          cp target/release/{imre,libimre_runtime.a} "$sdk/"
          "$sdk/imre" --emit-bundled-stdlib > "$sdk/imre-stdlib.zip"
          python3 scripts/bundle-linux-toolchain.py "$sdk/imre-toolchain"
          python3 scripts/build-bundled-providers.py "$sdk/imre"

          # Each suite builds in a new temporary tree. Use the packaged providers
          # without keeping a cached executable for every temporary entry point.
          env -u LD_LIBRARY_PATH IMREFLAGS=--no-cache python3 tests/run_suites.py --kill-failed-children --log-dir /tmp/imre-suites-ordinary --suites socket_tcp socketserver_tcp http_server errno differential imports classes text containers tuple_keys comprehensions fstrings calls inference iterables iterator_pipelines callables json_records toml_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files paths processes argparse_cli \
            -- --compiler "$sdk/imre" --runtime "$sdk/libimre_runtime.a" --clang ''
          cat /tmp/imre-suites-ordinary/socket_tcp.log
      - name: Run original string core methods in native Imre
        run: |
          python3 benchmarks/cpython_stdlib/full/string/native_core.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
          python3 benchmarks/cpython_stdlib/full/string/template_scaling.py --imre target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Run pinned str.expandtabs methods and checked allocation controls
        run: PYTHONPATH=.cpython-stdlib-reference/Lib python3 tests/text_expandtabs_upstream.py --compiler target/release/imre --runtime target/release/libimre_runtime.a --clang /usr/bin/clang-18
      - name: Validate guarded list lengths on bounded heaps
        run: |
          python3 tests/validate_list_length.py --compiler target/release/imre \
            --runtime target/release/libimre_runtime.a --clang clang-18
      - name: Validate the independent Rust Base45 reference
        run: |
          python3 benchmarks/reference/base45_codec/build.py --artifact-dir /tmp/imre-base45-reference --target-dir target/base45-reference
          python3 benchmarks/base45_validate.py --rust /tmp/imre-base45-reference/base45-reference --output /tmp/imre-base45-reference/validation.json
      - name: Validate the independent Rust Luhn reference
        run: |
          python3 benchmarks/reference/luhn_checksum/build.py --artifact-dir /tmp/imre-luhn-reference --target-dir target/luhn-reference
          python3 benchmarks/luhn_validate.py --rust /tmp/imre-luhn-reference/luhn-reference --output /tmp/imre-luhn-reference/validation.json
      - name: Validate the route planner against an independent oracle
        run: |
          target/release/imre build examples/route_planner.py
          python3 benchmarks/validate.py --binary ./route_planner
      - name: Validate the dependency planner against an independent oracle
        run: |
          target/release/imre build examples/dependency_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/dependency-planner
          python3 benchmarks/dependency_validate.py --binary /tmp/dependency-planner
      - name: Validate the Rust planner references and integer boundaries
        run: |
          python3 benchmarks/reference/dependency_planner/build.py --artifact-dir /tmp/imre-rust-reference --target-dir target/rust-reference
          python3 benchmarks/reference/dependency_planner/check_boundaries.py --python python3 --imre /tmp/dependency-planner --rust-bigint /tmp/imre-rust-reference/planner-bigint --rust-i64 /tmp/imre-rust-reference/planner-i64 --output /tmp/imre-rust-reference/validation.json
      - name: Validate the incremental planner and numeric reference boundaries
        run: |
          target/release/imre build examples/incremental_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/incremental-planner
          python3 benchmarks/reference/incremental_planner/build.py --artifact-dir /tmp/imre-incremental-reference --target-dir target/incremental-reference
          # Checked i64 compares only in-range cases and must reject every excluded overflow case.
          python3 benchmarks/incremental_validate.py --python python3 --binary /tmp/incremental-planner --rust-bigint /tmp/imre-incremental-reference/planner-bigint --rust-i64 /tmp/imre-incremental-reference/planner-i64 --output /tmp/imre-incremental-reference/validation.json
      - name: Validate framed batches and recovery against CPython and Rust
        run: |
          target/release/imre build examples/batch_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/batch-planner
          python3 benchmarks/reference/incremental_planner/build.py --batch --artifact-dir /tmp/imre-batch-reference --target-dir target/incremental-reference
          python3 benchmarks/batch_validate.py --python python3 --binary /tmp/batch-planner --rust-bigint /tmp/imre-batch-reference/planner-batch-bigint --output /tmp/imre-batch-reference/validation.json
      - name: Validate file manifests and complete reports against CPython and Rust
        run: |
          target/release/imre build examples/manifest_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/manifest-planner
          python3 benchmarks/reference/incremental_planner/build.py --manifest --artifact-dir /tmp/imre-manifest-reference --target-dir target/incremental-reference
          python3 benchmarks/manifest_validate.py --python python3 --binary /tmp/manifest-planner --rust-bigint /tmp/imre-manifest-reference/planner-manifest-bigint --output /tmp/imre-manifest-reference/validation.json
      - name: Verify task board requests and journal recovery
        run: |
          target/release/imre build examples/task_board/app.py --module-root examples/task_board --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o "$RUNNER_TEMP/task-board"
          python3 examples/task_board/verify.py --python python3
          python3 examples/task_board/verify.py --binary "$RUNNER_TEMP/task-board"
      - name: Validate inventory reconciliation against CPython and Rust
        run: |
          target/release/imre build examples/inventory_reconciliation/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/inventory-reconciliation
          python3 benchmarks/reference/inventory_reconciliation/build.py --artifact-dir /tmp/imre-inventory-reference --target-dir target/inventory-reference
          python3 benchmarks/inventory_validate.py --python python3 --binary /tmp/inventory-reconciliation --rust-bigint /tmp/imre-inventory-reference/inventory-bigint --output /tmp/imre-inventory-reference/validation.json
      - name: Validate telemetry queries against CPython and Rust
        run: |
          target/release/imre build examples/telemetry_comparison/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/telemetry-comparison
          python3 benchmarks/reference/telemetry_comparison/build.py --artifact-dir /tmp/imre-telemetry-reference --target-dir target/telemetry-reference
          python3 benchmarks/telemetry_validate.py --python python3 --binary /tmp/telemetry-comparison --rust /tmp/imre-telemetry-reference/telemetry-reference --output /tmp/imre-telemetry-reference/validation.json
      - name: Validate callable record pipelines against CPython and Rust
        run: |
          target/release/imre build examples/record_pipeline/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/record-pipeline
          python3 benchmarks/reference/record_pipeline/build.py --artifact-dir /tmp/imre-record-reference
          python3 benchmarks/record_validate.py --python python3 --binary /tmp/record-pipeline --rust /tmp/imre-record-reference/record-reference
      - name: Validate memory report comparison against CPython and Rust
        run: |
          target/release/imre build examples/memory_report/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/memory-report
          target/release/imre build examples/memory_report/compute.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/memory-report-compute
          python3 benchmarks/reference/memory_report/build.py --artifact-dir /tmp/imre-memory-reference
          python3 benchmarks/memory_validate.py --python python3 --binary /tmp/memory-report --compute-binary /tmp/memory-report-compute --rust /tmp/imre-memory-reference/memory-report-reference

  asan:
    if: ${{ !inputs.thinlto_classes_phase_probe && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.sys_source && !inputs.unittest_source)) }}
    runs-on: *linux-x64
    timeout-minutes: 120
    env: *wheel-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - *setup-python
      - *install-wheel-tools
      - *cpython-reference
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - run: cargo build -p imre-compiler --release --locked --features imre-compiler/verify-ir
      - &build-asan
        name: Build the runtime with AddressSanitizer
        env:
          RUSTC_BOOTSTRAP: '1'
          RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo build -p imre-runtime --features corosensei/sanitizer --release --locked --target "$imre_target" --target-dir target/asan
      - &build-asan-providers
        name: Build instrumented bundled standard library providers
        run: python3 scripts/build-bundled-providers.py target/release/imre --clang /usr/bin/clang-18 --sanitize
      - &asan-smoke
        name: Check native ownership and wheels with AddressSanitizer
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          python3 tests/extension_wheel.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize
          python3 tests/wheel_record.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 0
          python3 tests/differential.py --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 1
      - &asan-suites
        name: Run the full AddressSanitizer suites
        if: github.event_name != 'workflow_dispatch' || inputs.full_asan
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          python3 tests/run_suites.py --log-dir /tmp/imre-suites-asan-o1 --suites imports classes containers tuple_keys comprehensions fstrings calls inference iterables iterator_pipelines callables json_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files paths processes argparse_cli \
            -- --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 1
          python3 tests/run_suites.py --log-dir /tmp/imre-suites-asan-o0 --suites errno containers tuple_keys fstrings calls inference iterables iterator_pipelines callables json_records dataclass_records expressions floats bytes matching assignments truthiness loop_else unpacking primitives string_reuse decoder_optimizations unions module_values base45 luhn exceptions files paths processes argparse_cli \
            -- --compiler target/release/imre --runtime "target/asan/$imre_target/release/libimre_runtime.a" --clang clang-18 --sanitize --opt-levels 0

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: *linux-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - *setup-python
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  pr-asan:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_asan == 'true'
    runs-on: *linux-x64
    timeout-minutes: 45
    env: *wheel-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - *prepare-scorecard-history
      - *setup-python
      - *install-wheel-tools
      - *cpython-reference
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - run: cargo build -p imre-compiler --release --locked --features imre-compiler/verify-ir
      - *build-asan
      - *build-asan-providers
      - *asan-smoke
      - *asan-suites
      - *verify-stdlib-table

  thinlto:
    needs: scope
    if: needs.scope.outputs.thinlto == 'true'
    runs-on: *linux-x64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - run: cargo build -p imre-compiler --release --locked
      - name: Build the bitcode runtime for ThinLTO
        env:
          RUSTFLAGS: -Clinker-plugin-lto
        run: cargo build -p imre-runtime --release --locked --target-dir target/lto
      - name: Check ThinLTO linking and native semantics
        env:
          FULL_THINLTO: ${{ inputs.full_thinlto || false }}
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          imre_lld_dir="$(rustc --print sysroot)/lib/rustlib/$imre_target/bin"
          export IMRE_CI_LLD="$imre_lld_dir/gcc-ld/ld.lld"
          export IMRE_CI_LTO_CACHE="$RUNNER_TEMP/imre-thinlto-cache"
          mkdir -p "$IMRE_CI_LTO_CACHE"
          ci_lld="$GITHUB_WORKSPACE/.github/scripts/ci-thinlto-ld.lld"
          python3 tests/lto.py --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --rust-lld "$ci_lld" --python python3
          if [[ "$FULL_THINLTO" != true ]]; then
            suites=(module_values)
          else
            suites=(
              differential imports classes containers tuple_keys comprehensions fstrings calls
              inference iterables iterator_pipelines callables json_records dataclass_records
              expressions floats bytes matching assignments truthiness loop_else unpacking primitives
              string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files
              paths processes argparse_cli
            )
          fi
          python3 tests/run_suites_children.py
          python3 tests/run_suites.py --kill-failed-children --log-dir /tmp/imre-suites-thinlto --suites "${suites[@]}" \
            -- --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --lto-linker "$ci_lld" --opt-levels 3

  thinlto-classes-phase-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.thinlto_classes_phase_probe
    runs-on: *linux-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Authenticate the supplemental source and selection
        env:
          UNITTEST_SOURCE: ${{ inputs.unittest_source }}
          SYS_SOURCE: ${{ inputs.sys_source }}
          LOGGING: ${{ inputs.logging_evidence }}
          RELEASE: ${{ inputs.release_artifacts }}
          ASAN: ${{ inputs.full_asan }}
          THIN: ${{ inputs.full_thinlto }}
        run: |
          set -euo pipefail
          [[ -z "$UNITTEST_SOURCE" && -z "$SYS_SOURCE" && "$LOGGING" != true && "$RELEASE" != true && "$ASAN" != true && "$THIN" != true ]]
          [[ "$(git rev-parse HEAD^)" == 32f5e52212fed7adff056970d8913187b13fe113 ]]
          [[ "$(git diff-tree --no-commit-id --name-only -r HEAD)" == .github/workflows/ci.yml ]]
          [[ "$(git rev-parse HEAD:.github/scripts/ci-thinlto-ld.lld)" == da708fb33915005fa357eaa46347c142c254c72d ]]
          [[ "$(git rev-parse HEAD:tests/run_suites.py)" == 4c3e012434d01b971bce578e20cc66408c45e78d ]]
          [[ "$(git rev-parse HEAD:tests/run_suites_children.py)" == 81df562fbbd64c4fefdb77abe6c473da2c3e951e ]]
          [[ "$(git rev-parse HEAD:tests/classes.py)" == 004c249cdc5e35b9cf66495751aed5334bba22dd ]]
          [[ "$(git rev-parse HEAD:tests/fixtures/classes/class_data_setup.py)" == 81d4ec755a69cb9da4e0f7b63e5f783989626a25 ]]
          [[ "$(git rev-parse HEAD:tests/class_data_sources.py)" == 367802df45d3019d3b5f9a42509626295182ebe6 ]]
          [[ "$(git rev-parse HEAD:tests/comprehensions.py)" == c7225cf89cff363113d67938dfcb77ee8b5904f1 ]]
          [[ "$(git rev-parse HEAD:tests/lto.py)" == 4d5815181c7e219bff71f20a8ee30e6db282428b ]]
          [[ "$(sha256sum .github/scripts/ci-thinlto-ld.lld | cut -d' ' -f1)" == b64290363fb78545ea4e03de965765672a7cb463955a3878ff64937c9a1a51ff ]]
          [[ "$(nproc)" == 16 ]]
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
          memory="$(awk '/^MemAvailable:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)"
          (( available > 60 * 1024 * 1024 * 1024 && memory >= 24 * 1024 * 1024 * 1024 ))
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Build the release compiler
        run: |
          set -euo pipefail
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
          memory="$(awk '/^MemAvailable:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)"
          (( available > 60 * 1024 * 1024 * 1024 && memory >= 24 * 1024 * 1024 * 1024 ))
          cargo build -p imre-compiler --release --locked
      - name: Build the bitcode runtime for ThinLTO
        env:
          RUSTFLAGS: -Clinker-plugin-lto
        run: |
          set -euo pipefail
          available="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
          memory="$(awk '/^MemAvailable:/ {printf "%.0f", $2 * 1024}' /proc/meminfo)"
          (( available > 60 * 1024 * 1024 * 1024 && memory >= 24 * 1024 * 1024 * 1024 ))
          cargo build -p imre-runtime --release --locked --target-dir target/lto
      - name: Run the supplemental original classes suite with a linker phase trace
        env:
          FULL_THINLTO: 'true'
        run: |
          set -euo pipefail
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          imre_lld_dir="$(rustc --print sysroot)/lib/rustlib/$imre_target/bin"
          export IMRE_CI_LLD="$imre_lld_dir/gcc-ld/ld.lld"
          export IMRE_CI_LTO_CACHE="$RUNNER_TEMP/imre-thinlto-cache"
          mkdir -p "$IMRE_CI_LTO_CACHE"
          phase_dir="$(mktemp -d "$RUNNER_TEMP/imre-classes-phase.XXXXXXXX")"
          chmod 700 "$phase_dir"
          ci_lld="$GITHUB_WORKSPACE/.github/scripts/ci-thinlto-ld.lld"
          if ! python3 tests/lto.py --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --rust-lld "$ci_lld" --python python3 >"$phase_dir/cli.log" 2>&1; then echo 'SUPPLEMENTAL_CLI_CONTROL_FAILED'; exit 1; fi
          if ! grep -q '^Passed 10 ThinLTO CLI checks$' "$phase_dir/cli.log"; then echo 'SUPPLEMENTAL_CLI_SUMMARY_UNCONFIRMED'; exit 1; fi
          if ! python3 tests/run_suites_children.py >"$phase_dir/children.log" 2>&1; then echo 'SUPPLEMENTAL_CHILD_CONTROL_FAILED'; exit 1; fi
          overall=0
          for sample in first second; do
            sample_dir="$phase_dir/$sample"
            mkdir -m 700 "$sample_dir"
            set +e
            python3 - "$imre_target" "$sample_dir" "$sample" 2>"$sample_dir/controller.stderr" <<'PY'
          import ctypes, errno, json, os, re, signal, stat, subprocess, sys, time
          from pathlib import Path
          target, directory, sample = sys.argv[1:]
          assert sample in ('first', 'second')
          root = Path(directory)
          assert root.is_dir() and stat.S_IMODE(root.stat().st_mode) == 0o700
          trace = root / 'linker.jsonl'
          fd = os.open(trace, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)
          os.close(fd)
          shim = root / 'linker-shim'
          shim_source = "#!/usr/bin/python3\nimport json, os, signal, stat, subprocess, sys, time\nfrom pathlib import Path\ntrace = Path(__file__).with_name('linker.jsonl')\nfd = os.open(trace, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK)\nst = os.fstat(fd)\nassert stat.S_ISREG(st.st_mode) and st.st_uid == os.getuid() and stat.S_IMODE(st.st_mode) == 0o600 and st.st_nlink == 1 and st.st_size < 256*1024\ndef record(kind, **more):\n    data = (json.dumps({'event':kind,'monotonic_ns':time.monotonic_ns(),'pid':os.getpid(),**more},separators=(',',':'))+'\\n').encode()\n    assert len(data) < 512\n    os.write(fd,data)\n    os.fsync(fd)\nrecord('ENTRY')\nchild = None\ndef forward(sig, frame):\n    if child is not None:\n        try: os.kill(child.pid, sig)\n        except ProcessLookupError: pass\nfor sig in (signal.SIGINT,signal.SIGTERM,signal.SIGHUP): signal.signal(sig,forward)\ntry:\n    child = subprocess.Popen([str(Path(os.environ['GITHUB_WORKSPACE'])/'.github/scripts/ci-thinlto-ld.lld'),*sys.argv[1:]])\n    record('FLOW_START',child_pid=child.pid)\n    rc = child.wait()\n    record('EXIT',returncode=rc)\nfinally:\n    os.close(fd)\nif rc < 0:\n    signal.signal(-rc, signal.SIG_DFL)\n    os.kill(os.getpid(), -rc)\nsys.exit(rc)\n"
          fd = os.open(shim, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o700)
          with os.fdopen(fd, 'w') as f:
              f.write(shim_source)
          backend = root / 'backend-shim'
          backend_source = "#!/usr/bin/python3\nimport json, os, stat, sys, time\nfrom pathlib import Path\ntrace = Path(__file__).with_name('linker.jsonl')\nfd = os.open(trace, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK)\nst = os.fstat(fd)\nassert stat.S_ISREG(st.st_mode) and st.st_uid == os.getuid() and stat.S_IMODE(st.st_mode) == 0o600 and st.st_nlink == 1 and st.st_size < 256*1024\njobs = [x.partition('=')[2] for x in sys.argv[1:] if x.startswith('--thinlto-jobs=')]\nselected = int(jobs[0]) if len(jobs)==1 and jobs[0].isdigit() else None\ndata = Path('/proc/self/stat').read_text()\nfields = data[data.rfind(')')+2:].split()\nevent = {'event':'BACKEND','monotonic_ns':time.monotonic_ns(),'pid':os.getpid(),'selected_backend_jobs':selected,'start_ticks':int(fields[19])}\nline = (json.dumps(event,separators=(',',':'))+'\\n').encode()\nassert len(line)<512\nos.write(fd,line); os.fsync(fd); os.close(fd)\nif selected != 4: sys.exit(2)\nreal = os.environ.pop('IMRE_PHASE_REAL_LLD')\nos.environ['IMRE_CI_LLD'] = real\nos.execv(real,[real,*sys.argv[1:]])\n"
          fd = os.open(backend, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o700)
          with os.fdopen(fd, 'w') as f:
              f.write(backend_source)
          real_lld = os.environ['IMRE_CI_LLD']
          real_lld_stat = os.stat(real_lld)
          assert stat.S_ISREG(real_lld_stat.st_mode)
          child_env = dict(os.environ, IMRE_CI_LLD=str(backend), IMRE_PHASE_REAL_LLD=real_lld)
          cache = Path(os.environ['IMRE_CI_LTO_CACHE'])
          assert cache.is_dir() and cache.resolve(strict=True).is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve(strict=True))
          def cache_count():
              counts = {'regular_files':0,'directories':0,'symlinks':0,'other':0,'entries':0}
              snap_start = time.monotonic()
              def walk(fd, depth):
                  if depth > 64: raise RuntimeError('cache depth cap')
                  with os.scandir(fd) as entries:
                      for e in entries:
                          counts['entries'] += 1
                          if counts['entries'] > 100000: raise RuntimeError('cache entry cap')
                          if counts['entries'] % 128 == 0:
                              disk = os.statvfs('.').f_bavail * os.statvfs('.').f_frsize
                              mem = next(int(x.split()[1])*1024 for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))
                              if time.monotonic()-snap_start > 30 or disk < 44*1024**3 or mem < 12*1024**3: raise RuntimeError('cache snapshot floor/deadline')
                          if e.is_symlink(): counts['symlinks'] += 1
                          elif e.is_dir(follow_symlinks=False):
                              before = e.stat(follow_symlinks=False)
                              child_fd = os.open(e.name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                              try:
                                  held = os.fstat(child_fd)
                                  if (held.st_dev,held.st_ino)!=(before.st_dev,before.st_ino): raise RuntimeError('cache dir identity drift')
                                  walk(child_fd,depth+1)
                              finally: os.close(child_fd)
                              counts['directories'] += 1
                          elif e.is_file(follow_symlinks=False): counts['regular_files'] += 1
                          else: counts['other'] += 1
              fd = os.open(cache, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try: walk(fd,0)
              finally: os.close(fd)
              if time.monotonic()-snap_start > 30: raise RuntimeError('cache snapshot deadline')
              return counts
          cache_before = cache_count()
          ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) == 0 or sys.exit('subreaper unavailable')
          command = ['python3', 'tests/run_suites.py', '--workers', '1', '--kill-failed-children', '--log-dir', str(root / 'suite'), '--suites', 'classes', '--', '--compiler', 'target/release/imre', '--runtime', 'target/lto/release/libimre_runtime.a', '--clang', 'clang-18', '--target', target, '--lto-linker', str(shim), '--opt-levels', '3']
          pending = []
          def caught(s, frame):
              pending.append(s)
