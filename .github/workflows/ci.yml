name: Verify the current StringIO merge source

on: workflow_dispatch
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  compare:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Prepare the reference and compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          cp .github/verify-stringio-869.sh "$RUNNER_TEMP/verify-stringio-869.sh"
      - name: Build and compare the actual merge source until the public checks finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/verify-stringio-869.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stringio-869-integration
          path: ${{ runner.temp }}/stringio-869
          if-no-files-found: error
          retention-days: 7
