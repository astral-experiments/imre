name: Pathlib prospective source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathlib:
    runs-on: ${{ github.repository == 'astral-sh/imre' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 75
    env:
      PATHLIB_PUBLIC_HEAD: b480aa1141707780ade3290e23449134e3b7a7c7
      CARGO_INCREMENTAL: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Install the native linker
        run: |
          if ! test -x /usr/bin/clang-18; then
            sudo apt-get update
            sudo apt-get install -y clang-18
          fi
      - name: Build and exercise the actual prospective source, refreshing main as needed
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/pathlib-target"
          reports="$RUNNER_TEMP/pathlib-prospective"
          mkdir -p "$reports"
          while true; do
            git fetch --quiet --no-tags origin refs/heads/main
            base=$(git rev-parse FETCH_HEAD)
            git switch --quiet --detach "$base"
            git -c user.name=charliermarsh -c user.email=charlie.r.marsh@gmail.com merge --no-ff --no-commit "$PATHLIB_PUBLIC_HEAD"
            tree=$(git write-tree)
            expected=$(git merge-tree --write-tree "$base" "$PATHLIB_PUBLIC_HEAD")
            test "$tree" = "$expected"
            git diff --quiet
            out="$reports/$base"
            mkdir -p "$out"
            printf 'main %s\npr %s\ntree %s\n' "$base" "$PATHLIB_PUBLIC_HEAD" "$tree" | tee "$out/source.txt"
            cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
            cargo test --locked -j 2 -p imre-runtime --lib > "$out/runtime-tests.txt"
            imre="$CARGO_TARGET_DIR/debug/imre"
            runtime="$CARGO_TARGET_DIR/debug/libimre_runtime.a"
            sha256sum "$imre" "$runtime" >> "$out/source.txt"
            python3 -B -X warn_default_encoding benchmarks/cpython_stdlib/full/pathlib/evidence.py \
              --imre "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 --cpython-source .cpython-stdlib-reference \
              --cohort metadata --result "$out/metadata.json"
            python3 -B benchmarks/cpython_stdlib/full/pathlib/metadata_receipt.py "$out/metadata.json" | tee "$out/unchanged-methods.txt"
            python3 -B tests/paths.py --compiler "$imre" --runtime "$runtime" --clang /usr/bin/clang-18 \
              --fixture io --fixture metadata_views --opt-levels 0 3 | tee "$out/path-checks.txt"
            latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            git merge --abort
            if test "$latest" = "$base"; then
              cp "$out/source.txt" "$reports/verified-source.txt"
              cat "$out/source.txt" "$out/unchanged-methods.txt" "$out/path-checks.txt" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "Main advanced to $latest; reusing this target for the new source."
          done
      - name: Retain the tested trees and both occurrence reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pathlib-857-prospective
          path: ${{ runner.temp }}/pathlib-prospective
          if-no-files-found: warn
          retention-days: 7
