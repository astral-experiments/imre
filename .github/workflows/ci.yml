name: Verify the prospective TextIOWrapper integration
on:
  workflow_dispatch:
    inputs:
      sys_source:
        description: Exact, independently checked-out product source
        required: true
        type: string
permissions:
  contents: read
jobs:
  textio-source:
    runs-on: namespace-profile-ubuntu-24-04-16
    timeout-minutes: 60
    env:
      SYS_SOURCE: ${{ inputs.sys_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: benchmarks/cpython_stdlib/full/sys
          persist-credentials: false
      - name: Select the original I/O controls for this dispatch
        run: |
          [[ "$SYS_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          cp -R benchmarks/cpython_stdlib/full/sys/hosted-2404 "$RUNNER_TEMP/textio-controls"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sys_source }}
          fetch-depth: 3
          persist-credentials: false
      - name: Check the source before building it
        run: test "$(git rev-parse HEAD)" = "$SYS_SOURCE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Get the original CPython test package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython-stdlib-reference
          sparse-checkout: Lib/test
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 strace
      - run: cargo build -p imre-compiler -p imre-runtime --release --locked --features imre-compiler/verify-ir -j 2
      - name: Read canonical main at warm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: .textio-base
          persist-credentials: false
      - name: Verify the current product tree at warm
        id: checkpoint_warm
        run: python3 -B "$RUNNER_TEMP/textio-controls/select_product.py" warm
      - name: Build newly overlapping changes with verify-ir
        if: steps.checkpoint_warm.outputs.changed == 'true'
        run: cargo build -p imre-compiler -p imre-runtime --release --locked --features imre-compiler/verify-ir -j 2
      - name: Measure original TextIOWrapper methods and Click factories at O0 and O3
        run: bash "$RUNNER_TEMP/textio-controls/run.sh"
      - name: Read canonical main at end
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: .textio-base
          persist-credentials: false
      - name: Verify the current product tree at end
        id: checkpoint_end
        run: python3 -B "$RUNNER_TEMP/textio-controls/select_product.py" end
      - name: Qualify intervening runtime changes on the warm build target
        if: steps.checkpoint_end.outputs.changed == 'true'
        run: |
          b="$RUNNER_TEMP/textio-controls"
          mkdir "$b/previous"
          cp "$b"/*.json "$b"/*.log "$b/previous/"
          cargo build -p imre-compiler -p imre-runtime --release --locked --features imre-compiler/verify-ir -j 2
          bash "$b/run.sh"
      - name: Retain the original inputs and public I/O observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: textio-2404-components
          path: |
            ${{ runner.temp }}/textio-controls/*.json
            ${{ runner.temp }}/textio-controls/*.log
            ${{ runner.temp }}/textio-controls/inputs
            ${{ runner.temp }}/textio-controls/previous/
          if-no-files-found: error
