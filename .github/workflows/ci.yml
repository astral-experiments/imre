name: Imre platform runner probe
run-name: Check existing Namespace Windows and macOS profiles from Imre
on: workflow_dispatch
permissions: {}
jobs:
  windows:
    runs-on: namespace-profile-windows-2022-x86-64-16x32
    timeout-minutes: 3
    steps:
      - name: Check the Windows compiler platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($arch -ne 'X64') { throw "Expected x64, got $arch" }
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Output "$($os.Caption) $arch, $([Environment]::ProcessorCount) CPUs"
          rustc -Vv
          cargo --version
  macos:
    runs-on: namespace-profile-macos-15
    timeout-minutes: 3
    steps:
      - name: Check Apple Silicon and the macOS 26 SDK required by CPython
        shell: bash
        run: |
          set -eu
          test "$(uname -m)" = arm64
          shopt -s nullglob
          for dev in "$(xcode-select -p)" /Applications/Xcode_26*.app/Contents/Developer; do
            version=$(DEVELOPER_DIR="$dev" xcrun --sdk macosx --show-sdk-version) || continue
            echo "SDK $version in $dev"
            if [[ ${version%%.*} == 26 ]]; then exit 0; fi
          done
          exit 1
