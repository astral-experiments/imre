name: Generate the random import row on its resolved native compiler
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 50
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8e5287af1e6aa18135ce2c97011b82c1733f8ee8
          fetch-depth: 0
      - name: Prepare and identify the prospective merge source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          test "$(git rev-parse HEAD)" = 8e5287af1e6aa18135ce2c97011b82c1733f8ee8
          test "$(git rev-parse HEAD^1)" = f3d1c1d21231d017db78b9fff70f5c51a5b3e1e4
          test "$(git rev-parse HEAD^2)" = b69f45b029f1f5f124760a9fb61b8618c07cadda
          test "$(git write-tree)" = 9330616e4d9b17212080f893d68ee92c6f95529e
          jq -n --arg base b69f45b029f1f5f124760a9fb61b8618c07cadda --arg head f3d1c1d21231d017db78b9fff70f5c51a5b3e1e4 --arg candidate 8e5287af1e6aa18135ce2c97011b82c1733f8ee8 --arg tree 9330616e4d9b17212080f893d68ee92c6f95529e '{base:$base,head:$head,candidate:$candidate,tree:$tree}' | tee "$RUNNER_TEMP/evidence/source.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 5607950ef232dad16d75c0cf53101d9649d89115
          path: .cpython
          sparse-checkout: Lib/test
          persist-credentials: false
      - name: Build native compiler and runtime
        run: |
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/evidence/source.txt"
          command -v clang-18 || (sudo apt-get update && sudo apt-get install -y clang-18 lld-18)
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
      - name: Four unchanged test_shutil entry modes
        run: |
          python -B benchmarks/cpython_stdlib/full/check_suite_startup.py --compiler target/debug/imre --cpython-git .cpython test.test_shutil > "$RUNNER_TEMP/evidence/startup-linux.json" || test $? = 1
          jq -e '.tests_executed==0 and (.checks|length==4) and all(.checks[]; (.diagnostic | contains("test_shutil.py:14:") | not))' "$RUNNER_TEMP/evidence/startup-linux.json"
      - name: Compare native draws and filesystem fixture at O0 and O3
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          python -B benchmarks/cpython_stdlib/full/shutil/random_consumer.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/evidence/random-consumer-linux.json"
      - name: Check I/O and crossed exceptions on the same source
        run: |
          set -euo pipefail
          args=(--imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18)
          python -B tests/io.py --compiler target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 | tee "$RUNNER_TEMP/evidence/io.log"
          for control in check_csv_handlers copy_error_controls; do
            python -B "benchmarks/cpython_stdlib/full/shutil/$control.py" "${args[@]}" | tee "$RUNNER_TEMP/evidence/$control.log"
          done
          sha256sum target/debug/imre target/debug/libimre_runtime.a > "$RUNNER_TEMP/evidence/binaries.sha256"
      - name: Check iterator and packed values against CPython on this compiler
        run: |
          out="$RUNNER_TEMP/evidence"
          set -euo pipefail
          test "$(python -c 'import sys;print(sys.version.split()[0])')" = 3.14.5
          cargo test --locked -j 2 -p imre-compiler --lib effects::tests::local_and_final_analysis_agree_on_packed_list_allocations -- --exact > "$out/effects-test.log"
          grep -F '1 passed; 0 failed;' "$out/effects-test.log"
          work=$(mktemp -d "$RUNNER_TEMP/effects-XXXXXX")
          : > "$out/effects-fixtures.tsv"
          for fixture in tests/fixtures/iterator_pipelines/source_generator.py tests/fixtures/dataclasses/value_struct.py; do
            name=$(basename "$fixture" .py)
            PYTHONPATH="$PWD/stdlib" python -B "$fixture" > "$work/$name.ref" 2> "$work/$name.referr"
            for mode in ordinary reachable; do
              flags=()
              if [[ "$mode" == reachable ]]; then flags+=(--reachable-only); fi
              for level in 0 3; do
                target/debug/imre build "$fixture" -o "$work/probe" --no-cache --opt-level "$level" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 "${flags[@]}"
                "$work/probe" > "$work/$name.native" 2> "$work/$name.stderr"
                cmp "$work/$name.ref" "$work/$name.native"
                cmp "$work/$name.referr" "$work/$name.stderr"
                printf '%s\t-O%s\t%s\t%s\t%s\n' "$name" "$level" "$mode" "$(wc -l < "$work/$name.native")" "$(sha256sum "$work/$name.native" | cut -d' ' -f1)" >> "$out/effects-fixtures.tsv"
              done
            done
          done
          test "$(wc -l < "$out/effects-fixtures.tsv")" -eq 8
      - name: Run original text and bytes missing-PATH fixtures on this source
        run: |
          set -euo pipefail
          python -B - target/debug/imre target/debug/libimre_runtime.a /usr/bin/clang-18 "$RUNNER_TEMP/evidence/missing-path.json" <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from tempfile import TemporaryDirectory
          import hashlib, json, sys
          from test import test_shutil
          assert sys.version_info[:3] == (3,14,5)
          assert hashlib.sha1(b'blob '+str(len(data:=Path(test_shutil.__file__).read_bytes())).encode()+b'\x00'+data).hexdigest() == 'fb1a7d876a617e17bcecbb8d8b654a2a87dafe48'
          bench=Path('benchmarks/cpython_stdlib').resolve()
          sys.path[:0] = [str(bench/'full/shutil'),str(bench)]
          import which_defaults
          args=SimpleNamespace(**dict(zip(('imre','runtime','clang'),map(Path,sys.argv[1:4]),strict=True)))
          with TemporaryDirectory() as tmp:
           rows=which_defaults.paired(args,test_shutil,Path(tmp))
          for level,values in rows.items():
           assert set(values)=={'test.test_shutil.TestWhich.test_environ_path_missing','test.test_shutil.TestWhichBytes.test_environ_path_missing'}
           for value in values.values():
            assert value['native_calls']==2 and value['native_environment']=={'PATH':'absent','processes':2}
          Path(sys.argv[4]).write_text(json.dumps(rows,indent=2)+'\n')
          print([(level,len(values)) for level,values in rows.items()])
          PY
      - name: Check the compiler features merged in the same batch
        run: |
          out="$RUNNER_TEMP/evidence"
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/random-batch-XXXXXX")
          : > "$out/batch-fixtures.tsv"
          for fixture in tests/fixtures/callables/cache_info.py tests/fixtures/dataclasses/boxed_records.py tests/fixtures/exceptions/generic_args_records.py tests/fixtures/files/logging_adapter_core.py tests/fixtures/paths/fnmatch_py314.py tests/fixtures/processes/list2cmdline.py tests/fixtures/iterables/math_product.py; do
            name=$(basename "$fixture" .py)
            env -u PYTHONPATH PYTHONHASHSEED=0 python -B "$fixture" > "$work/$name.ref" 2> "$work/$name.referr"
            for level in 0 3; do
              target/debug/imre build "$fixture" -o "$work/probe" --no-cache --opt-level "$level" --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18
              PYTHONHASHSEED=0 "$work/probe" > "$work/$name.native" 2> "$work/$name.stderr"
              cmp "$work/$name.ref" "$work/$name.native"
              cmp "$work/$name.referr" "$work/$name.stderr"
              printf '%s\t-O%s\t%s\t%s\n' "$name" "$level" "$(wc -l < "$work/$name.native")" "$(sha256sum "$work/$name.native" | cut -d' ' -f1)" >> "$out/batch-fixtures.tsv"
            done
          done
          test "$(wc -l < "$out/batch-fixtures.tsv")" -eq 14
      - name: Generate and check the table with the resolved compiler and pinned CPython
        if: always() && hashFiles('target/debug/imre') != ''
        run: |
          set -euo pipefail
          dir=benchmarks/cpython_stdlib/full
          evidence="$RUNNER_TEMP/evidence"
          docs=$(jq -r .base "$evidence/source.json")
          git cat-file -e "$docs:$dir/support_table.py"
          git cat-file -e "$docs:docs/stdlib.md"
          git diff --exit-code "$docs" HEAD -- "$dir/support_table.py"
          echo "$docs" > "$evidence/table-source.txt"
          git cat-file -e "HEAD:$dir/api_examples.toml"
          python -B "$dir/support_table.py" --imre target/debug/imre
          python -B "$dir/support_table.py" --imre target/debug/imre --check
          git diff --exit-code HEAD -- "$dir/api_examples.toml"
          cp docs/stdlib.md "$dir/api_examples.toml" "$evidence/"
          python - <<'PY'
          from pathlib import Path
          rows = [s for s in Path('docs/stdlib.md').read_text().splitlines() if s.startswith(('| `random` |', '| `shutil` |'))]
          assert len(rows) == 2 and any(s.startswith('| `random` | Yes |') for s in rows)
          print(*rows, sep='\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shutil-random-canonical
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
