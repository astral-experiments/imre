          target/release/imre build examples/incremental_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/incremental-planner
          python3 benchmarks/reference/incremental_planner/build.py --artifact-dir /tmp/imre-incremental-reference --target-dir target/incremental-reference
          # Checked i64 compares only in-range cases and must reject every excluded overflow case.
          python3 benchmarks/incremental_validate.py --python python3 --binary /tmp/incremental-planner --rust-bigint /tmp/imre-incremental-reference/planner-bigint --rust-i64 /tmp/imre-incremental-reference/planner-i64 --output /tmp/imre-incremental-reference/validation.json
      - name: Validate framed batches and recovery against CPython and Rust
        run: |
          target/release/imre build examples/batch_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/batch-planner
          python3 benchmarks/reference/incremental_planner/build.py --batch --artifact-dir /tmp/imre-batch-reference --target-dir target/incremental-reference
          python3 benchmarks/batch_validate.py --python python3 --binary /tmp/batch-planner --rust-bigint /tmp/imre-batch-reference/planner-batch-bigint --output /tmp/imre-batch-reference/validation.json
      - name: Validate file manifests and complete reports against CPython and Rust
        run: |
          target/release/imre build examples/manifest_planner/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/manifest-planner
          python3 benchmarks/reference/incremental_planner/build.py --manifest --artifact-dir /tmp/imre-manifest-reference --target-dir target/incremental-reference
          python3 benchmarks/manifest_validate.py --python python3 --binary /tmp/manifest-planner --rust-bigint /tmp/imre-manifest-reference/planner-manifest-bigint --output /tmp/imre-manifest-reference/validation.json
      - name: Verify task board requests and journal recovery
        run: |
          target/release/imre build examples/task_board/app.py --module-root examples/task_board --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o "$RUNNER_TEMP/task-board"
          python3 examples/task_board/verify.py --python python3
          python3 examples/task_board/verify.py --binary "$RUNNER_TEMP/task-board"
      - name: Validate inventory reconciliation against CPython and Rust
        run: |
          target/release/imre build examples/inventory_reconciliation/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/inventory-reconciliation
          python3 benchmarks/reference/inventory_reconciliation/build.py --artifact-dir /tmp/imre-inventory-reference --target-dir target/inventory-reference
          python3 benchmarks/inventory_validate.py --python python3 --binary /tmp/inventory-reconciliation --rust-bigint /tmp/imre-inventory-reference/inventory-bigint --output /tmp/imre-inventory-reference/validation.json
      - name: Validate telemetry queries against CPython and Rust
        run: |
          target/release/imre build examples/telemetry_comparison/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/telemetry-comparison
          python3 benchmarks/reference/telemetry_comparison/build.py --artifact-dir /tmp/imre-telemetry-reference --target-dir target/telemetry-reference
          python3 benchmarks/telemetry_validate.py --python python3 --binary /tmp/telemetry-comparison --rust /tmp/imre-telemetry-reference/telemetry-reference --output /tmp/imre-telemetry-reference/validation.json
      - name: Validate callable record pipelines against CPython and Rust
        run: |
          target/release/imre build examples/record_pipeline/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/record-pipeline
          python3 benchmarks/reference/record_pipeline/build.py --artifact-dir /tmp/imre-record-reference
          python3 benchmarks/record_validate.py --python python3 --binary /tmp/record-pipeline --rust /tmp/imre-record-reference/record-reference
      - name: Validate memory report comparison against CPython and Rust
        run: |
          target/release/imre build examples/memory_report/__main__.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/memory-report
          target/release/imre build examples/memory_report/compute.py --module-root examples --runtime target/release/libimre_runtime.a --clang clang-18 --opt-level 3 -o /tmp/memory-report-compute
          python3 benchmarks/reference/memory_report/build.py --artifact-dir /tmp/imre-memory-reference
          python3 benchmarks/memory_validate.py --python python3 --binary /tmp/memory-report --compute-binary /tmp/memory-report-compute --rust /tmp/imre-memory-reference/memory-report-reference

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: *linux-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - *setup-python
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  pr-asan:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_asan == 'true'
    runs-on: *linux-x64
    timeout-minutes: 45
    env: *wheel-env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - *setup-python
      - *install-wheel-tools
      - *cpython-reference
      - run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - run: cargo build -p imre-compiler --release --locked --features imre-compiler/verify-ir
      - *build-asan
      - *asan-smoke
      - *asan-suites

  thinlto:
    needs: scope
    if: needs.scope.outputs.thinlto == 'true'
    runs-on: *linux-x64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - run: cargo build -p imre-compiler --release --locked
      - name: Build the bitcode runtime for ThinLTO
        env:
          RUSTFLAGS: -Clinker-plugin-lto
        run: cargo build -p imre-runtime --release --locked --target-dir target/lto
      - name: Check ThinLTO linking and native semantics
        env:
          FULL_THINLTO: ${{ inputs.full_thinlto || false }}
        run: |
          imre_target="$(rustc -vV | sed -n 's/^host: //p')"
          imre_lld_dir="$(rustc --print sysroot)/lib/rustlib/$imre_target/bin"
          export IMRE_CI_LLD="$imre_lld_dir/gcc-ld/ld.lld"
          export IMRE_CI_LTO_CACHE="$RUNNER_TEMP/imre-thinlto-cache"
          mkdir -p "$IMRE_CI_LTO_CACHE"
          ci_lld="$GITHUB_WORKSPACE/.github/scripts/ci-thinlto-ld.lld"
          python3 tests/lto.py --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --rust-lld "$ci_lld" --python python3
          if [[ "$FULL_THINLTO" != true ]]; then
            suites=(module_values)
          else
            suites=(
              differential imports classes containers tuple_keys comprehensions fstrings calls
              inference iterables iterator_pipelines callables json_records dataclass_records
              expressions floats bytes matching assignments truthiness loop_else unpacking primitives
              string_reuse decoder_optimizations unions module_values base45 luhn exceptions io files
              paths processes argparse_cli
            )
          fi
          python3 tests/run_suites_children.py
          python3 tests/run_suites.py --kill-failed-children --log-dir /tmp/imre-suites-thinlto --suites "${suites[@]}" \
            -- --compiler target/release/imre --runtime target/lto/release/libimre_runtime.a --clang clang-18 --target "$imre_target" --lto-linker "$ci_lld" --opt-levels 3
