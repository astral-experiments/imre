name: Reproduce all-skipped doctests before and after the fix
on:
  push:
    branches: [codex/doctest-all-skipped-validation]
permissions:
  contents: read
jobs:
  sample:
    runs-on: github-ubuntu-24.04-x86_64-4
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Install Clang 18
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Reproduce the two false successes from the unmodified base
        run: |
          git diff --exit-code HEAD^ HEAD -- crates
          git show HEAD^^:crates/imre-compiler/stdlib/doctest.py > crates/imre-compiler/stdlib/doctest.py
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
          python3 -B - <<'PY'
          from pathlib import Path
          import shutil,sys,subprocess,tempfile
          sys.path.insert(0,'benchmarks/cpython_stdlib')
          from suite_native import Toolchain
          root=Path('benchmarks/cpython_stdlib/full/doctest')
          for opt in (0,3):
              with tempfile.TemporaryDirectory() as wd:
                  d=Path(wd)
                  shutil.copy(root/'upstream/Lib/test/test_doctest/sample_doctest_skip.py',d)
                  binary=Toolchain(Path('target/debug/imre'),Path('target/debug/libimre_runtime.a'),Path('/usr/bin/clang-18'),opt).build((root/'controls/skip.py').read_bytes(),d)
                  ref=subprocess.run([sys.executable,'-B',d/'case.py'],capture_output=True,check=True)
                  got=subprocess.run([binary],capture_output=True,check=True)
                  assert ref.stdout.count(b'skipped: all examples were skipped\n')==2
                  assert got.stderr==ref.stderr==b'' and got.stdout==ref.stdout.replace(b'skipped: all examples were skipped\n',b'passed\n'), (ref,got)
                  print(f'O{opt} before: only the two all-skipped runTest results differ')
          PY
      - name: Exercise the exact corrected source, compare all six cases and existing controls
        run: |
          git restore --source=HEAD -- crates/imre-compiler/stdlib/doctest.py
          git diff --exit-code HEAD -- crates
          cargo build --locked -j 2 -p imre-compiler -p imre-runtime --features imre-compiler/verify-ir
          python3 -B benchmarks/cpython_stdlib/full/doctest/native.py --imre target/debug/imre --runtime target/debug/libimre_runtime.a --clang /usr/bin/clang-18 --result "$RUNNER_TEMP/skips.json"
          python3 -c 'import json,sys;print("DOCTEST_SKIP_RECEIPT="+json.dumps([{k:v for k,v in s.items() if k!="modules"} for s in json.load(open(sys.argv[1]))],separators=(",",":")))' "$RUNNER_TEMP/skips.json"
