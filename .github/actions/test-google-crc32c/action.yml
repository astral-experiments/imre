name: Test the rebuilt google-crc32c wheel
description: Run the unchanged upstream suite against both native builds
inputs:
  cc:
    description: C compiler for the extension and the application
    default: clang
  cxx:
    description: C++ compiler for the CRC32C library
    default: clang++
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: google/crc32c
        ref: 02e65f4fd3065d27b2e29324800ca6d04df16126 # 1.1.2
        path: .upstream-crc32c
        persist-credentials: false
    - shell: bash
      env:
        CC: ${{ inputs.cc }}
        CXX: ${{ inputs.cxx }}
      run: |
        python3 -m pip install "pytest==8.4.2"
        work="$RUNNER_TEMP/google-crc32c"
        mkdir -p "$work/include" "$work/consumer"
        target/release/imre extension-header > "$work/include/Python.h"
        python3 benchmarks/google_crc32c_build.py --crc32c-source .upstream-crc32c --output "$work" \
          --imre-include "$work/include" --cc "$CC" --cxx "$CXX"
        python3 scripts/pack_extension_wheel.py "$work/wheel" --name google-crc32c --version 1.8.0 --output "$work/dist"
        python3 -m pip install --no-index --no-deps --no-compile --only-binary=:all: \
          --implementation im --python-version 1 --abi imre1 --target "$work/site" "$work"/dist/*.whl
        cp examples/google_crc32c/driver.py "$work/consumer/"
        target/release/imre build "$work/consumer/driver.py" --extension-path "$work/site" --clang "$CC" -o "$work/driver"
        python3 tests/google_crc32c.py cpython --cpython-package "$work/cpython"
        python3 tests/google_crc32c.py imre --imre-binary "$work/driver"
        python3 tests/google_crc32c.py fallback
