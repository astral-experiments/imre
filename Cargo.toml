[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/viarius-experiments/imre"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ruff_python_ast = "=0.0.15"
ruff_python_codegen = "=0.0.15"
ruff_python_stdlib = "=0.0.15"
ruff_python_parser = "=0.0.15"
ruff_source_file = "=0.0.15"
ruff_python_trivia = "=0.0.15"
ruff_text_size = "=0.0.15"
ruff_db = "=0.0.15"
ty_python_semantic = "=0.0.15"
ty_python_core = "=0.0.15"
ty_module_resolver = "=0.0.15"
ty_site_packages = "=0.0.15"
ty_vendored = "=0.0.15"
salsa = "=0.28.5"
# Salsa's generated code and runtime must use matching internal macro rules.
salsa-macro-rules = "=0.28.5"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
compact_str = "=0.10.0"
itoa = "=1.0.18"
fancy-regex = "=0.20.0"
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"

[profile.release]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
debug = 0

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[patch.crates-io]
ruff_annotate_snippets = { git = "https://github.com/astral-sh/ruff.git", rev = "091d4521d657eaf85659b8f20830507f99bb532c" }
