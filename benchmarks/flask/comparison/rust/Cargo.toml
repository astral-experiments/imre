[package]
name = "imre-flask-hyper-control"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
num-bigint = "0.4"
percent-encoding = "2"
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["net", "rt"] }

[workspace]
