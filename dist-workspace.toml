[workspace]
members = ["cargo:."]
packages = ["imre"]

[dist]
cargo-dist-version = "0.32.0"
hosting = ["simple"]
simple-download-url = "https://labs.astral.sh/imre/releases/{tag}"
create-release = false
installers = ["shell"]
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
unix-archive = ".tar.gz"
checksum = "sha256"
source-tarball = false
auto-includes = false
build-local-artifacts = false
local-artifacts-jobs = ["./build-release-binaries"]

# The installer moves the Linux native toolchain as one private directory.
[dist.binaries]
"*" = ["imre", "libimre_runtime.a", "libimre_runtime_jemalloc.a", "imre-toolchain"]
aarch64-apple-darwin = ["imre", "libimre_runtime.a"]

[dist.min-glibc-version]
"*" = "2.39"
