[workspace]
members = ["cargo:."]
packages = ["relar"]

[dist]
cargo-dist-version = "0.32.0"
hosting = ["simple"]
simple-download-url = "https://labs.astral.sh/relar/releases/{tag}"
create-release = false
installers = ["shell"]
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
unix-archive = ".tar.gz"
checksum = "sha256"
source-tarball = false
auto-includes = false
build-local-artifacts = false
local-artifacts-jobs = ["./build-release-binaries"]

# Install the runtime archives and the packaged linker beside the compiler.
[dist.binaries]
"*" = ["relar", "librelar_runtime.a", "librelar_runtime_jemalloc.a"]
x86_64-unknown-linux-gnu = ["relar", "librelar_runtime.a", "librelar_runtime_jemalloc.a", "relar-ld.lld"]
aarch64-apple-darwin = ["relar", "librelar_runtime.a"]

[dist.min-glibc-version]
"*" = "2.39"
